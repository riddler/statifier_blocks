          cardFor("blk_AUTH").dataset.runActive === undefined
        );

        editor.destroy();
        mount.remove();
      });

      /*
       * sb-68b. The third slot style, and the two claims it rests on.
       *
       * The first is a LAYOUT claim: `failure` is a rail style, so a slot
       * declaring it is placed exactly where a `secondary` slot is - same
       * partition, same boundary box - and the only thing that differs is the
       * word carried out to the DOM. The second is the EMIT claim: that word
       * actually reaches the element the stylesheet selects, as a direct
       * child relationship the CSS depends on.
       *
       * What is NOT asserted here is the paint. This page loads no spike CSS
       * on purpose, so there is no computed style to read; that the two rails
       * end up looking different is a screenshot, in three themes, on the
       * bead. What these checks pin is the seam the paint hangs off, which is
       * the half that can rot silently.
       *
       * Sabotage: restoring layout.js's old
       * `entry.slotStyle?.[slot.name] === "secondary" ? "secondary" : "primary"`
       * turns the failure-style checks below red (on_error falls back to
       * primary and leaves the rail entirely) while every other suite in this
       * file stays green - which is the blindness this suite exists to close.
       */
      suite("layout + render: a failure rail is placed like an interrupt rail (sb-68b)", () => {
        const proposing = proposingRegistry();

        const doc = createDocument(
          block({
            id: "blk_ROOT",
            type: "core.sequence",
            slots: {
              body: [
                block({
                  id: "blk_INV",
                  type: "core.invoke",
                  config: { invoke_type: "myapp:authorize" },
                  slots: {
                    on_error: [
                      block({ id: "blk_PARK", type: "core.wait", config: { duration: "PT1H" } }),
                    ],
                  },
                }),
                block({
                  id: "blk_GRP",
                  type: "core.group",
                  slots: {
                    body: [
                      block({ id: "blk_STEP", type: "core.wait", config: { duration: "PT1M" } }),
                    ],
                    interrupts: [
                      block({
                        id: "blk_RULE",
                        type: "core.on_event",
                        config: { event: "order.cancelled", outcome: "abandon" },
                      }),
                    ],
                  },
                }),
                block({
                  id: "blk_INV_EMPTY",
                  type: "core.invoke",
                  config: { invoke_type: "myapp:capture" },
                }),
              ],
            },
          }),
          { id: "bdoc_RAILS" }
        );

        const tree = layoutDocument(doc, proposing);
        const body = tree.root.slots.find((one) => one.name === "body");
        const at = (id) => body.children.find((child) => child.id === id);

        // The two vocabularies, side by side in one document.
        equal(
          "the failure path declares its own style",
          at("blk_INV").slots.map((one) => [one.name, one.style]),
          [["on_error", "failure"]]
        );
        equal(
          "an interrupt rail is untouched",
          at("blk_GRP").slots.map((one) => [one.name, one.style]),
          [
            ["body", "primary"],
            ["interrupts", "secondary"],
          ]
        );

        // Placement is what the two share: the rail partition holds both, so
        // both containers keep their boundary box (amendment 10c).
        equal("a failure slot is on the rail", at("blk_INV").secondary.map((one) => one.name), [
          "on_error",
        ]);
        equal("...and is not a primary slot", at("blk_INV").primary.length, 0);
        equal("an interrupt slot is on the same rail", at("blk_GRP").secondary.map((one) => one.name), [
          "interrupts",
        ]);

        // An unknown style is a metadata typo, and the safe reading of one is
        // the ordinary rendering rather than a slot hidden beside the body.
        const groupType = proposing.types["core.group"];
        const typo = {
          ...proposing,
          types: {
            ...proposing.types,
            "core.group": {
              ...groupType,
              paletteEntry: {
                ...groupType.paletteEntry,
                slotStyle: { body: "primary", interrupts: "sideways" },
              },
            },
          },
        };

        const typoTree = layoutDocument(doc, typo);
        const typoGroup = typoTree.root.slots
          .find((one) => one.name === "body")
          .children.find((child) => child.id === "blk_GRP");

        equal(
          "a style nothing recognizes falls back to primary",
          typoGroup.slots.map((one) => one.style),
          ["primary", "primary"]
        );
        equal("...so nothing is hidden on a rail", typoGroup.secondary.length, 0);

        /* ------------------------------------------------------- the DOM */

        const mount = el("div");
        document.body.append(mount);
        renderCanvas(mount, tree, { center: false });

        const railSlot = (id, name) =>
          mount.querySelector(`.sb-rail__slot[data-block-id="${id}"][data-slot="${name}"]`);

        equal(
          "the failure rail carries its style out to the DOM",
          railSlot("blk_INV", "on_error").dataset.slotStyle,
          "failure"
        );
        equal(
          "the interrupt rail carries its own",
          railSlot("blk_GRP", "interrupts").dataset.slotStyle,
          "secondary"
        );
        equal(
          "a failure slot still makes its container a boundary",
          mount.querySelector('.sb-node[data-block-id="blk_INV"]').dataset.boundary,
          "true"
        );

        // The stylesheet paints the failure card and the failure placeholder
        // through `> .sb-node >` and `> .sb-slot__empty`, so the direct-child
        // shape is load-bearing rather than incidental.
        check(
          "the failure card is a direct child of its rail slot",
          railSlot("blk_INV", "on_error").querySelector(
            ':scope > .sb-node[data-block-id="blk_PARK"] > .sb-card'
          ) !== null
        );
        check(
          "an EMPTY failure slot's placeholder is a direct child too (sb-mu2)",
          railSlot("blk_INV_EMPTY", "on_error").querySelector(":scope > .sb-slot__empty") !== null
        );

        mount.remove();
      });

      /* ----------------------------------- sb-jvz: the injected label field
       *
       * `label` is the editor's field, not a block type's. Every card titles
       * itself from it, so a type that had to declare one was writing the
       * editor's boilerplate - and a type that forgot lost its author's
       * words silently, which is exactly what happened to `core.invoke`:
       * `card-processing.json` stores "Authorize the card", the canvas titled
       * the card from it, and the config form could not edit it.
       *
       * The injection seam is `describe/2` and nothing else. These suites
       * assert that from both ends: every registered type comes back with the
       * field whether or not it asked, and no type declares one.
       *
       * Sabotage: dropping the `.filter` in `withEditorFields` leaves a
       * rogue host declaration duplicated in the schema, which the third
       * suite catches; returning the shared `LABEL_FIELD` rather than a copy
       * leaves the mutation check red.
       */

      const everyType = {
        types: { ...coreTypes, ...demoTypes, ...proposedCoreTypes },
      };

      suite("palette: the editor injects label into every type it resolves", () => {
        const names = Object.keys(everyType.types);

        check("the registry under test is not empty", names.length > 0, `${names.length} types`);

        for (const name of names) {
          const descriptor = everyType.types[name];
          const node = block({
            id: "blk_L",
            type: name,
            typeVersion: descriptor.currentVersion,
          });
          const schema = describe(everyType, node).descriptor.configSchema(node.config);

          equal(`${name} leads its schema with label`, schema[0].key, "label");
          equal(`...as an optional string`, [schema[0].type, schema[0].required], [
            "string",
            false,
          ]);
          check(
            `...seeding nothing into ${name}'s config`,
            !("default" in schema[0]),
            "the injected field declares a default"
          );
          equal(
            `...exactly once`,
            schema.filter((field) => field.key === "label").length,
            1
          );
          check(
            `...and NOT declared by the type itself`,
            (descriptor.configSchema({}) ?? []).every((field) => field.key !== "label"),
            "the type still declares its own label"
          );
        }
      });

      suite("palette: the injected label seeds nothing and titles everything", () => {
        /*
         * No `default`, deliberately: a default would write `{"label": ""}`
         * into the config of every block ever inserted - bytes in every
         * document to say nothing at all.
         *
         * The declaration is what carries this, and it is asserted above
         * per type as well. `blockForType` below is the belt to that
         * braces: it seeds from the RAW descriptor rather than through
         * `describe`, so it would not seed a label today even if the field
         * declared one - and the day someone routes seeding through the
         * injection seam, this is the check that has to stay green.
         */
        check("the injected field declares no default", !("default" in LABEL_FIELD));

        for (const name of Object.keys(everyType.types)) {
          const made = blockForType(everyType, name);
          check(
            `a new ${name} seeds no label`,
            !Object.hasOwn(made.config, "label"),
            JSON.stringify(made.config)
          );
        }

        // The canvas reads the field by SCHEMA - a string field keyed
        // `label` - so injecting it is all it takes for a stored label to
        // become a title. `core.invoke` is the type the bead was filed for.
        const doc = createDocument(
          block({
            id: "blk_ROOT",
            type: "core.sequence",
            slots: {
              body: [
                block({
                  id: "blk_INV",
                  type: "core.invoke",
                  config: { invoke_type: "myapp:authorize", label: "Authorize the card" },
                }),
                block({ id: "blk_SEQ", type: "core.sequence" }),
              ],
            },
          })
        );

        const cards = layoutDocument(doc, everyType).root.slots[0].children;

        equal("a stored label titles the card", cards[0].title, "Authorize the card");
        equal("the palette label becomes the caption", cards[0].caption, "Invoke");
        equal(
          "and a block with no stored label still reads its type",
          cards[1].title,
          "Sequence"
        );
      });

      suite("palette: the injected field is the editor's, in both directions", () => {
        // A host type that declares `label` anyway is not an error - its
        // declaration is dropped, so the field the canvas titles from cannot
        // be redefined into an integer out from under it.
        const rogue = {
          name: "myapp.rogue",
          currentVersion: 1,
          slots: () => [],
          configSchema: () => [
            { key: "label", type: "integer", label: "Rogue", required: true, default: 7 },
            { key: "other", type: "string", label: "Other", required: false },
          ],
          validateConfig: () => null,
          io: () => ({ kinds: ["step"] }),
          paletteEntry: { label: "Rogue" },
        };

        equal(
          "a declared label is replaced, not duplicated",
          withEditorFields(rogue).configSchema({}).map((field) => [field.key, field.type]),
          [
            ["label", "string"],
            ["other", "string"],
          ]
        );

        // Each call hands back a COPY, so a caller that edits a field view in
        // place cannot poison every other type's form.
        const schema = withEditorFields(coreTypes["core.wait"]).configSchema({});
        schema[0].label = "clobbered";
        equal(
          "the injected field is copied per call",
          withEditorFields(coreTypes["core.wait"]).configSchema({})[0].label,
          "Step name"
        );

        // One wrapper per descriptor: `describe` runs for every block on
        // every layout pass, and a fresh object each time would make
        // descriptor identity meaningless to anything holding one.
        const node = block({ id: "blk_W", type: "core.wait" });
        check(
          "and the wrapper is stable across calls",
          describe(registry, node).descriptor === describe(registry, node).descriptor
        );

        /*
         * ADR-0005 d12: an unresolvable block has no form at all, so there is
         * nothing to inject a field INTO. Injecting one would be offering to
         * edit the config of a block whose type nothing can validate.
         *
         * Two layers hold that, and both are asserted: `describe` never
         * routes its placeholder through the wrapper, AND the wrapper
         * refuses an unresolved descriptor if something else ever hands it
         * one. Asserting only the first would leave the guard untested and a
         * later caller free to inject by going around `describe`.
         */
        const gone = describe(registry, findBlock(retiredDocument(), "blk_GONE"));
        check("an unresolvable descriptor is left alone", gone.unresolved);
        equal("...declaring no fields, injected or otherwise", gone.descriptor.configSchema({}), []);
        equal(
          "and the wrapper itself refuses a placeholder",
          withEditorFields(placeholderDescriptor("myapp.retired", { tag: "unknown_block_type" }))
            .configSchema({}),
          []
        );
      });

      suite("palette: the injected field's check is the editor's too", () => {
        // It moved off `demo-types.js`, where only the myapp.* steps had it,
        // and onto the injection seam, where every type does.
        for (const name of ["core.wait", "core.invoke", "myapp.capture"]) {
          const descriptor = withEditorFields(everyType.types[name]);

          equal(
            `${name} refuses a non-string label`,
            (descriptor.validateConfig({ label: 7 }) ?? [])[0],
            { key: "label", message: "must be text" }
          );
          // ADR-0001 d6 admits `null` as a stored config value, so "absent"
          // and "stored null" are different questions and only the first is
          // fine - the canvas would otherwise have to title a card `null`.
          equal(
            `${name} refuses a null label`,
            (descriptor.validateConfig({ label: null }) ?? [])[0],
            { key: "label", message: "must be text" }
          );
        }

        const wait = withEditorFields(coreTypes["core.wait"]);

        check("an absent label is fine", wait.validateConfig({ duration: "PT1S" }) === null);
        check(
          "an empty string is fine - optional means optional",
          wait.validateConfig({ duration: "PT1S", label: "" }) === null
        );
        equal(
          "and the type's own findings survive beside the injected one",
          (wait.validateConfig({ duration: "soon", label: 7 }) ?? []).map((one) => one.key),
          ["label", "duration"]
        );
      });

      suite("panes: the config form edits label on every type", () => {
        for (const name of Object.keys(everyType.types)) {
          const descriptor = everyType.types[name];
          const form = configFormFor(
            everyType,
            block({ id: "blk_F", type: name, typeVersion: descriptor.currentVersion })
          );

          equal(`${name} offers label first`, form.fields[0].key, "label");
          equal(`...as a text control`, form.fields[0].control, "text");
          equal(`...writing to config.label`, form.fields[0].path, ["label"]);
        }

        // The gap the bead names, at the surface it was reported from.
        const authored = configFormFor(
          everyType,
          block({
            id: "blk_INV",
            type: "core.invoke",
            config: { invoke_type: "myapp:authorize", label: "Authorize the card" },
          })
        );

        equal(
          "an invoke's stored label reads back into the form",
          authored.fields[0].value,
          "Authorize the card"
        );

        // The types that used to land on "this block type declares no
        // configuration of its own" - the arm `inspector.js` dropped.
        const sequence = configFormFor(everyType, block({ id: "blk_S", type: "core.sequence" }));

        equal("a sequence's form is no longer empty", sequence.empty, false);
        equal("it is exactly the injected field", sequence.fields.map((f) => f.key), ["label"]);

        // d12 is unchanged: the bytes, not a form.
        const gone = configFormFor(registry, findBlock(retiredDocument(), "blk_GONE"));
        equal("an unresolvable block still offers no fields", gone.fields, []);
        equal("...and is still read-only", gone.readOnly, true);
      });

      /* ======================================== cond + core.timeout (sb-0o4) */

      /*
       * The mirror divergence, checked as a divergence.
       *
       * `core.on_event` is a SHIPPED type carrying a PROPOSED key, which is
       * the `core.parallel`/`complete` situation exactly (sb-dxs). The whole
       * risk of that shape is a stored document that used to decode and
       * validate and now does not, so that is what this suite is about: the
       * key is additive, absence is silent, and the shipped keys did not move.
       *
       * Sabotage: dropping the `"cond" in config` test from the descriptor's
       * validateConfig - so an absent key falls through to the non-empty
       * check - turns "an absent guard is silent" and both back-compat
       * assertions red. Reverted.
       */
      suite("palette: core.on_event's proposed cond is additive (sb-0o4)", () => {
        const onEvent = coreTypes["core.on_event"];
        const schema = onEvent.configSchema({});

        equal(
          "the shipped keys keep their indices, and cond is appended",
          schema.map((field) => field.key),
          ["event", "outcome", "cond"]
        );

        const cond = schema.find((field) => field.key === "cond");
        equal("declared as an expression, like a branch arm's", cond.type, "expression");
        check("and optional", cond.required === false);

        // Back-compat, the load-bearing property. Every stored `core.on_event`
        // in the demo documents predates this key.
        const before = { event: "order.cancelled", outcome: "abandon" };
        check("an absent guard is silent", onEvent.validateConfig(before) === null);
        check(
          "and so is the whole block, through the registry",
          checkConfig(
            registry,
            createDocument(block({ id: "blk_R", type: "core.on_event", config: before })),
            updateConfig("blk_R", before)
          ) === null
        );

        // Present-but-empty is NOT "no guard": it is a guard an author began
        // and did not finish, and ADR-0001 d6's absent-versus-null reading is
        // what makes those two different cases here.
        equal(
          "an empty guard is a finding on its own key",
          onEvent.validateConfig({ ...before, cond: "" }),
          [{ key: "cond", message: "a guard, if present, needs an expression" }]
        );
        equal(
          "a stored null lands on the same refusal",
          onEvent.validateConfig({ ...before, cond: null }),
          [{ key: "cond", message: "a guard, if present, needs an expression" }]
        );
        check(
          "an authored guard passes",
          onEvent.validateConfig({ ...before, cond: "auth.captured == false" }) === null
        );

        // The guard does not buy the rule a placement it did not have: the
        // single `interrupt_handler` tag is still the whole placement rule.
        equal("it is still an interrupt handler and nothing else", onEvent.io({}).kinds, [
          "interrupt_handler",
        ]);
      });

      /*
       * `core.timeout`, the proposed interrupt rule that replaced the demo's
       * `myapp.timeout_rule` crutch.
       *
       * The claim the suite is really checking is the one the retirement rests
       * on: the core form covers what the host form was standing in for, key
       * for key, so a document could be re-typed without its stored config
       * moving. That is asserted against the SHIPPED fixture's own bytes.
       *
       * Sabotage: spelling the duration key `duration` instead of `after`
       * turns "the shipped fixture's stored config is clean" red, which is the
       * point - the fixture was re-typed and not re-written. Reverted.
       */
      suite("proposed core: core.timeout is the interrupt rule's core form (sb-0o4)", () => {
        const timeout = proposedCoreTypes["core.timeout"];

        check("it exists", Boolean(timeout));
        equal("as an interrupt handler and nothing else", timeout.io({}).kinds, [
          "interrupt_handler",
        ]);
        equal("with no slots", timeout.slots({}), []);
        equal(
          "and the three keys the crutch carried",
          timeout.configSchema({}).map((field) => field.key),
          ["after", "outcome", "cond"]
        );
        equal(
          "`after` takes the EXISTING duration field type - nothing new is proposed for it",
          timeout.configSchema({}).find((field) => field.key === "after").type,
          "duration"
        );

        // The exact bytes `fixtures/documents/card-processing.json` stores at
        // `blk_cp_authz_timeout`, which used to be a `myapp.timeout_rule` and
        // was re-typed rather than re-written.
        const stored = {
          after: "PT15M",
          cond: "three_ds.completed == false OR fraud.cleared == false",
          outcome: "abandon",
        };
        check("the shipped fixture's stored config is clean", timeout.validateConfig(stored) === null);

        equal(
          "a plain-English duration is refused",
          timeout.validateConfig({ ...stored, after: "15 minutes" }),
          [{ key: "after", message: "must be an ISO-8601 duration, like PT15M" }]
        );
        equal(
          "a missing duration is the same finding, not a throw",
          (timeout.validateConfig({ outcome: "abandon" }) ?? []).map((f) => f.key),
          ["after"]
        );
        equal(
          "an outcome outside the pair is refused",
          timeout.validateConfig({ ...stored, outcome: "retry" }),
          [{ key: "outcome", message: 'pick "abandon" or "resume"' }]
        );

        // Its guard is the SAME rule `core.on_event`'s is. Two interrupt
        // rules on one rail whose optional guards disagreed about what an
        // empty string means is the drift this checks for.
        const onEvent = coreTypes["core.on_event"];
        const railTakes = (descriptor, base, cond) =>
          JSON.stringify(
            (descriptor.validateConfig({ ...base, ...cond }) ?? []).filter((f) => f.key === "cond")
          );

        equal(
          "every guard value lands the same way on both rules",
          [{}, { cond: "" }, { cond: null }, { cond: "a == 1" }, { cond: 7 }].filter(
            (c) =>
              railTakes(timeout, stored, c) !==
              railTakes(onEvent, { event: "a.b", outcome: "abandon" }, c)
          ),
          []
        );

        // It is a PROPOSAL: `coreRegistry()` and `spikeRegistry()` answer
        // "what does the package actually ship", and a proposal that quietly
        // joined them would make that question unanswerable.
        check("the shipped registry does not know it", registry.types["core.timeout"] === undefined);
        check("the proposing one does", proposingRegistry().types["core.timeout"] !== undefined);
        equal(
          "and it sits in the proposed group, beside core.invoke and core.raise",
          paletteEntryFor(timeout).group,
          "Proposed core"
        );
      /*
       * The retirement itself (D12, 2026-08-28).
       *
       * `demo-types.js` is not imported by this page - `spikeRegistry()` is
       * `palette.js`'s own maps - so this suite checks the property that
       * actually matters and that the page CAN see: the editor needed no
       * special case for either crutch, so removing them from the demo
       * vocabulary is a registry edit and nothing more. The re-authored
       * document is checked against the core descriptors directly.
       */
      suite("the retired crutches leave nothing behind (sb-0o4, D12)", () => {
        const proposing = proposingRegistry();

        // The three re-typed blocks, rebuilt here from the fixture's stored
        // bytes. A document written against the host crutches becomes a
        // document written against the core forms by changing `type` alone.
        const retyped = createDocument(
          block({
            id: "blk_ROOT",
            type: "core.group",
            slots: {
              body: [block({ id: "blk_BODY", type: "core.wait", config: { duration: "PT1H" } })],
              interrupts: [
                block({
                  id: "blk_cp_cancelled",
                  type: "core.on_event",
                  config: {
                    event: "customer.cancelled",
                    cond: "event.customer_cancelled.reason == 'customer_request' AND auth.captured == false",
                    outcome: "abandon",
                  },
                }),
                block({
                  id: "blk_cp_authz_timeout",
                  type: "core.timeout",
                  config: {
                    after: "PT15M",
                    cond: "three_ds.completed == false OR fraud.cleared == false",
                    outcome: "abandon",
                  },
                }),
                block({
                  id: "blk_cp_manual_resolved",
                  type: "core.on_event",
                  config: {
                    event: "review.resolved",
                    cond: "event.review_resolved.decision == 'approve' AND review.parked",
                    outcome: "resume",
                  },
                }),
              ],
            },
          }),
          { id: "bdoc_RETYPED", revision: 1 }
        );

        equal("the re-authored rail validates clean", validate(retyped, proposing), null);

        // Both crutch names are gone from the vocabulary this page knows, and
        // a block still naming one would be the d12 unresolvable case rather
        // than a silent resolution to something else.
        for (const gone of ["myapp.guarded_on_event", "myapp.timeout_rule"]) {
          check(`${gone} resolves to nothing`, proposing.types[gone] === undefined);
          check(
            `...and a block naming it is unresolvable, not silently retyped`,
            describe(proposing, block({ id: "blk_X", type: gone, config: {} })).unresolved === true
          );
        }

        // The condition pane picks both guards up off the DECLARED type, with
        // no list of type names anywhere - which is the property that made the
        // retirement free (`conditionFields` did not change).
        for (const id of ["blk_cp_cancelled", "blk_cp_authz_timeout", "blk_cp_manual_resolved"]) {
          const fields = conditionFields(configFormFor(proposing, findBlock(retyped, id)));
          equal(`${id} offers exactly its one guard`, fields.length, 1);
          equal(`...keyed the way it is stored`, fields[0].key, "cond");
          equal(`...carrying the stored source`, fields[0].value, findBlock(retyped, id).config.cond);
        }
      });

      });

      /* ========================================== core.subchart (sb-7s2) */

      /*
       * The proposed `core.subchart`, in four suites: what the descriptor
       * declares, where its chart picker's options come from, that its failure
       * path lands on the same rail `core.invoke`'s does, and that the shipped
       * runs for the new fixture document replay the two outcomes honestly.
       *
       * Self-contained on purpose - the fixture document is fetched here
       * rather than added to `shipped` above, so these suites can be read (and
       * moved) without unpicking the ones that came before.
       */

      const subchartType = proposedCoreTypes["core.subchart"];

      const shippedFixtureDocs = await Promise.all(
        fixtureDocuments.map((doc) =>
          fetch(`../fixtures/documents/${doc.file}.json`)
            .then((response) => (response.ok ? response.json() : null))
            .then((value) => [doc.file, value])
            .catch(() => [doc.file, null])
        )
      ).then((pairs) => Object.fromEntries(pairs));

      suite("proposed core: core.subchart declares a leaf with a failure slot", () => {
        check("the type is registered", subchartType !== undefined);
        if (subchartType === undefined) return;

        equal("it names itself", subchartType.name, "core.subchart");

        // The child chart is a REFERENCE, so there is no body slot to put it
        // in - the only slot is the failure path.
        equal(
          "its only slot is on_error",
          subchartType.slots().map((slot) => [slot.name, slot.arity, slot.label]),
          [["on_error", "zero_or_one", "If it fails"]]
        );

        // Character for character `core.invoke`'s, which is the claim the
        // descriptor's comment makes. Asserted rather than trusted: the two
        // drifting apart is exactly the failure a reader could not see.
        equal(
          "the slot is core.invoke's, unchanged",
          subchartType.slots(),
          proposedCoreTypes["core.invoke"].slots()
        );

        equal(
          "a subchart is a step with two outcomes",
          subchartType.io(),
          { kinds: ["step"], produces: "unknown", slotAccepts: { on_error: ["step"] } }
        );

        equal("the failure slot keeps sb-68b's style", subchartType.paletteEntry.slotStyle, {
          on_error: "failure",
        });
        equal("the badge is the one word a card cannot say", badgeFor(subchartType.paletteEntry), "subchart");
        equal("it sits with the other proposals", subchartType.paletteEntry.group, "Proposed core");
      });

      suite("proposed core: core.subchart's chart picker is the shell's list (D11)", () => {
        const schema = subchartType.configSchema();

        equal(
          "three fields, the reference first",
          schema.map((field) => field.key),
          ["chart", "assign_to", "params"]
        );
        equal("the chart is required", schema[0].required, true);
        equal("and defaults to nothing chosen", schema[0].default, "");

        // The D11 assertion: the options ARE the fixture-document list, not a
        // copy of it that happens to agree today.
        equal("the chart field is a select", Array.isArray(schema[0].type?.select), true);
        equal(
          "over exactly the spike's fixture documents",
          schema[0].type.select,
          fixtureDocumentOptions()
        );
        equal(
          "which are the ids the shell can open",
          schema[0].type.select.map((option) => option.value),
          fixtureDocumentIds()
        );

        // And the list has to be true about the files on disk, in both
        // directions: every entry loads, and the envelope id inside the file
        // is the id the picker stores.
        const wrong = [];
        for (const doc of fixtureDocuments) {
          const raw = shippedFixtureDocs[doc.file];
          if (raw === null) wrong.push(`${doc.file}.json did not load`);
          else if (raw.id !== doc.id) wrong.push(`${doc.file}.json is ${raw.id}, listed as ${doc.id}`);
        }
        equal("every listed document exists and matches its id", wrong, []);

        // The validator's job is the other half of the same rule.
        equal("an unchosen chart is a finding", subchartType.validateConfig({ chart: "" }), [
          { key: "chart", message: "pick one of the spike's fixture documents" },
        ]);
        equal(
          "so is a chart the shell has no file for",
          subchartType.validateConfig({ chart: "bdoc_not_a_fixture" }),
          [{ key: "chart", message: "pick one of the spike's fixture documents" }]
        );
        equal(
          "a chosen one with no other config is fine",
          subchartType.validateConfig({ chart: "bdoc_signup_demo" }),
          null
        );

        // The params and assign_to rules are core.invoke's, shared in one
        // place - so the interesting check is that they answer identically.
        const config = {
          chart: "bdoc_signup_demo",
          assign_to: "Onboarding",
          // sb-e2x: one row with a bad name, one with a bad path. Both types
          // now declare `paramsField()` itself, so this is the check that they
          // really are one declaration and not two that agree today.
          params: { "Email Address": "signup.email", plan: "not a path" },
        };
        const fromInvoke = proposedCoreTypes["core.invoke"]
          .validateConfig({ ...config, invoke_type: "myapp:signup" })
          .filter((finding) => finding.key !== "invoke_type");

        equal("the shared checks answer the same on both types", subchartType.validateConfig(config), fromInvoke);
        equal(
          "and they are the findings the fields deserve",
          subchartType.validateConfig(config).map((finding) => finding.key),
          ["assign_to", "params", "params"]
        );

        // sb-e2x: and the DECLARATIONS match too, not just the checks. This is
        // what "reusable beyond invoke" means concretely - one field, declared
        // by two types, with no type name anywhere in the control that draws it.
        const paramsOf = (type) =>
          proposedCoreTypes[type].configSchema({}).find((field) => field.key === "params");
        equal(
          "both types declare one and the same params field",
          paramsOf("core.subchart"),
          paramsOf("core.invoke")
        );
      });

      suite("layout + render: a subchart's failure path is on the rail (sb-7s2)", () => {
        const proposing = proposingRegistry();

        const doc = createDocument(
          block({
            id: "blk_ROOT",
            type: "core.sequence",
            slots: {
              body: [
                block({
                  id: "blk_SUB",
                  type: "core.subchart",
                  config: { chart: "bdoc_signup_demo", label: "Run the wizard" },
                  slots: {
                    on_error: [
                      block({ id: "blk_TELL", type: "core.raise", config: { event: "signup.abandoned" } }),
                    ],
                  },
                }),
                block({
                  id: "blk_SUB_EMPTY",
                  type: "core.subchart",
                  config: { chart: "bdoc_cp_demo" },
                }),
              ],
            },
          }),
          { id: "bdoc_SUBRAILS" }
        );

        const tree = layoutDocument(doc, proposing);
        const body = tree.root.slots.find((one) => one.name === "body");
        const at = (id) => body.children.find((child) => child.id === id);

        equal(
          "the failure path declares the failure style",
          at("blk_SUB").slots.map((one) => [one.name, one.style]),
          [["on_error", "failure"]]
        );
        equal("it is on the rail", at("blk_SUB").secondary.map((one) => one.name), ["on_error"]);
        equal("...and is not a primary slot", at("blk_SUB").primary.length, 0);

        // it has to survive layout rather than only exist in the descriptor.
        equal("the card carries the badge", at("blk_SUB").badge, "subchart");

        // An empty failure slot is still a declared slot: the rail is drawn
        // with nothing in it, exactly as an invoke's is.
        equal(
          "an unused failure slot is still on the rail",
          at("blk_SUB_EMPTY").secondary.map((one) => [one.name, one.children.length]),

      suite("fixtures / the shipped subchart runs (sb-7s2)", () => {
        const raw = shippedFixtureDocs["signup-invitations"];

        check("fixtures/runs.json loads", shipped.runs !== null);
        check("signup-invitations.json loads", raw !== null);
        if (shipped.runs === null || raw === null) return;

        const byId = new Map();
        const walk = (node) => {
          if (!node || typeof node !== "object") return;
          if (typeof node.id === "string" && typeof node.type === "string") byId.set(node.id, node);
          for (const children of Object.values(node.slots ?? {})) for (const child of children) walk(child);
        };
        walk(raw.root);

        const fixtures = fixturesFor(shipped.runs, "bdoc_su_invites_demo");
        check("the document has runs", fixtures.runs.length > 0, "no runs written");

        const ids = fixtures.runs.map((run) => run.id);
        equal("run ids are unique", ids.length, new Set(ids).size);

        const strays = [];
        for (const run of fixtures.runs) {
          for (const step of run.steps ?? []) {
            for (const id of step.active ?? []) {
              if (!byId.has(id)) strays.push(`${run.id}: ${id}`);
            }
          }
        }
        equal("every active id is a block in the document", strays, []);

        const steps = fixtures.runs.flatMap((run) => (run.steps ?? []).map((step) => ({ run, step })));
        const calls = steps.filter(({ step }) => invokeView(step.invoke) !== null);
        const subchartCalls = calls.filter(({ step }) => byId.get(step.invoke.block)?.type === "core.subchart");

        check("the runs record subchart calls", subchartCalls.length > 0, "no step carries a subchart call");

        // The `invoke` field is shared between the two types that leave the
        // chart, and nothing else may claim it: a fixture marking an ordinary
        // step would light a card with no badge on it.
        const wrong = calls
          .filter(({ step }) => !["core.invoke", "core.subchart"].includes(byId.get(step.invoke.block)?.type))
          .map(({ run, step }) => `${run.id}: ${step.invoke.block}`);
        equal("every call names a block that leaves the chart", wrong, []);

        const adrift = calls
          .filter(({ step }) => !(step.active ?? []).includes(step.invoke.block))
          .map(({ run, step }) => `${run.id}: ${step.invoke.block}`);
        equal("and the step activates it", adrift, []);

        equal(
          "both subchart outcomes are exercised",
          [...new Set(subchartCalls.map(({ step }) => step.invoke.outcome))].sort(),
          ["done", "error"]
        );

        // The authored-walk assertion, the same one the card-processing invoke
        // runs get: after an error outcome the next step's ids are inside that
        // block's own on_error subtree, because a human wrote them there.
        const subtree = (blockId) => {
          const inside = new Set();
          const collect = (node) => {
            if (!node) return;
            if (typeof node.id === "string") inside.add(node.id);
            for (const children of Object.values(node.slots ?? {})) for (const child of children) collect(child);
          };
          for (const child of byId.get(blockId)?.slots?.on_error ?? []) collect(child);
          return inside;
        };

        const misplaced = [];
        for (const run of fixtures.runs) {
          const list = run.steps ?? [];
          list.forEach((step, index) => {
            if (invokeView(step.invoke)?.outcome !== "error") return;

            const next = list[index + 1];
            const inside = subtree(step.invoke.block);

            if (!next) {
              misplaced.push(`${run.id}: the error step is last, so nothing shows the failure path`);
              return;
            }

            for (const id of next.active ?? []) {
              if (!inside.has(id)) misplaced.push(`${run.id}: ${id} is not under ${step.invoke.block}'s on_error`);
            }
          });
        }
        equal("an error step is followed by its on_error subtree", misplaced, []);

        // And the pane's own reading of the error run: the mark is on the step
        // the cursor is on, the step after it is just the next step - it
        // carries a call of its OWN, to the invoke inside the failure subtree,
        // which is the honest-replayer rule seen from the awkward side - and
        // the run reaches a pass.
        const errorRun = fixtures.runs.find((run) => run.id === "run_si_invite_abandoned");
        check("the error run is present", errorRun !== undefined);
        if (errorRun === undefined) return;

        const at = errorRun.steps.findIndex((step) => invokeView(step.invoke)?.outcome === "error");
        equal("the failing step marks its own card", runView(errorRun, at).invoke.block, "blk_si_invitee_signup");
        equal(
          "the next step's call is its own, not the subchart's",
          runView(errorRun, at + 1).invoke.block,
          "blk_si_notify_owner"
        );
        equal("and the run replays to a pass", runView(errorRun, errorRun.steps.length).verdict, "pass");
      });

      /* ============================================= core.assign (sb-y4a) */

       *
       * Appended at the end for the same merge reason `core.subchart`'s suites

        equal("a write has no subtree", assignType.slots(), []);

        equal(
          "two fields, the destination first",
          assignType.configSchema().map((field) => [field.key, field.type, field.required]),

            ["path", "string", true],
            ["value", "string", true],
          ]
        );

          "and neither defaults to a write nobody authored",
          assignType.configSchema().map((field) => field.default),
          ["", ""]
        );

        // `core.raise`'s io, not `core.invoke`'s: one outcome, so there is no
        // join to refuse and `produces` is absent rather than "unknown".
        equal("an assign is a plain step", assignType.io(), { kinds: ["step"] });
        equal("its io is core.raise's, unchanged", assignType.io(), proposedCoreTypes["core.raise"].io());

        equal("the badge is the one word a card cannot say", badgeFor(assignType.paletteEntry), "writes");
        equal("it sits with the other proposals", assignType.paletteEntry.group, "Proposed core");
        // The teal is for work that leaves the chart; a datamodel write does
        // not, so the type deliberately claims no accent of its own.
        equal("it takes the editor's own accent", accentTokenFor(assignType.paletteEntry), null);

        equal("the shipped registry does not know it", registry.types["core.assign"], undefined);
        check("the proposing one does", proposingRegistry().types["core.assign"] !== undefined);
      });

      suite("proposed core: core.assign refuses what it cannot store (sb-y4a)", () => {
        const pathFinding = {
          key: "path",
          message: "must be a datamodel path, like review.parked",
        };
        const valueFinding = {
          key: "value",
          message: 'must be a literal, written as source text - false, 42350, "manual_review"',
        };

        equal("an empty block is two findings", assignType.validateConfig({}), [
          pathFinding,
          valueFinding,
        ]);
        equal(
          "a path with whitespace in it is not a path",
          assignType.validateConfig({ path: "review parked", value: "false" }),
          [pathFinding]
        );
        equal(
          "and neither is a blank one",
          assignType.validateConfig({ path: "   ", value: "false" }),
          [pathFinding]
        );

        // The source-text rule is what makes an empty `value` refusable: the
        // empty STRING is spelled with two quote characters, so nothing an
        // author legitimately wants is spelled with nothing at all.
        equal(
          "an empty value is a finding",
          assignType.validateConfig({ path: "review.parked", value: "" }),
          [valueFinding]
        );
        equal(
          "the empty string, written as source text, is not",
          assignType.validateConfig({ path: "review.resolution", value: '""' }),
          null
        );

        // The grammar this file deliberately does NOT own: a dotted path and a
        // bare one are both accepted, exactly as a `params` row's path is,
        // because a stricter regex here would be a second proposal riding
        // along with this one.
        equal(
          "a dotted path is fine",
          assignType.validateConfig({ path: "review.parked", value: "false" }),
          null
        );
        equal(
          "so is a bare one",
          assignType.validateConfig({ path: "capture_attempts", value: "1" }),
          null
        );

        // The DECLARATION check is sb-c2o's, and this is what "not here" looks
        // like from the outside: a path no datamodel declares validates
        // clean, because `validate_config/1` is handed a config and not a
        // document. Asserted so the gap is pinned rather than assumed.
        equal(
          "an undeclared path is not this function's finding",
          assignType.validateConfig({ path: "not.a.declared.path", value: "true" }),
          null
        );
      });

      suite("layout + render: an assign is a badged leaf (sb-y4a)", () => {

        equal(

      suite("fixtures / the shipped assign replays as its own delta (sb-y4a)", () => {

        check("datamodel.json loads", shipped.datamodel !== null);

        const walk = (node) => {
          if (!node || typeof node !== "object") return;
          if (node.type === "core.assign") assigns.push(node);

        };

        equal("and its config validates", assignType.validateConfig(authored.config), null);

        // instead - which is the shape sb-c2o will build for every block.
        const index = indexPaths(shipped.datamodel);
        check(
          `the path it writes is declared (${authored.config.path})`,
          index.has(authored.config.path),

        // carries IS the block's work. Compared as strings, both sides being
        // source text, so the fixture and the document are checked against
        // each other rather than each against a reading of the other.
        equal(

        );

        const finished = runView(run, endCursor(run));

        check("the run binds the path it writes", binding !== undefined);

        equal("charged to the assign's step", binding?.step, run.steps.length - 1);

      /* ------------------------------------------- sb-ajr: core.send
       *
       * APPENDED, like the descriptor it covers, and for the same reason: a
       * sibling bead was appending its own suites to this file at the same
       * time. Reading order would put these beside core.raise's suites, which
       * are the ones they most want to be read against.
       *
       * `shipped` (fetched further up for the fixture-file suites) is reused
       * rather than re-fetched: the last suite here is about the block that
       * ships in signup-wizard.json, and one fetch of that file is enough.
       */

      const sendType = proposedCoreTypes["core.send"];

      suite("proposed core: core.send is a leaf that names an event and a time", () => {
        check("the type is registered", sendType !== undefined);
        if (sendType === undefined) return;

        equal("it names itself", sendType.name, "core.send");
        check("it is not in the shipped core vocabulary", !("core.send" in coreTypes));

        equal("no slots at all - a send has no subtree", sendType.slots({}), []);
        equal("it is a step", sendType.io({}).kinds, ["step"]);
        // core.raise's argument, and it holds with a delay in the config: the
        // block finishes when the send is ARMED, so there is still one
        // outcome and still no join to refuse.
        check("produces is absent, not 'unknown'", sendType.io({}).produces === undefined);
        check("and it consumes nothing", sendType.io({}).consumes === undefined);
        check(
          "so it drops into a group's body",
          admits(coreTypes["core.group"], {}, "body", sendType, {})
        );
        check(
          "...and not onto the interrupt rail, which takes handlers",
          !admits(coreTypes["core.group"], {}, "interrupts", sendType, {})
        );

        equal(
          "two config fields, the event first",
          sendType.configSchema({}).map((field) => [field.key, field.type, field.required]),
          [
            ["event", "string", true],
            ["delay", "duration", false],
          ]
        );
        // The default is "" and not a duration: a send with no delay is the
        // ordinary case, and core.wait's PT1H default would author a timer
        // nobody asked for.
        equal("the delay defaults to no delay", sendType.configSchema({})[1].default, "");
      });

      suite("proposed core: core.send speaks core.raise's event grammar", () => {
        const onEvent = coreTypes["core.on_event"];
        const raise = proposedCoreTypes["core.raise"];

        // core.raise's suite makes this check against core.on_event; the third
        // type joins the same assertion rather than adding a second one,
        // because the property is three-way now: a name any one of them
        // refuses is a rail that cannot catch what a step sends.
        const sendTakes = (event) =>
          (sendType.validateConfig({ event }) ?? []).every((finding) => finding.key !== "event");
        const raiseTakes = (event) => raise.validateConfig({ event }) === null;
        const railTakes = (event) =>
          (onEvent.validateConfig({ event, outcome: "abandon" }) ?? []).every(
            (finding) => finding.key !== "event"
          );

        const names = [
          "signup.abandoned",
          "signup.email_verified",
          "error.communication.invoke.blk_x",
          "done.state.blk_y",
          "Cancelled",
          "_internal",
          "a-b.c_d.9",
          "",
          "  ",
          ".leading",
          "9starts_with_a_digit",
          "has space",
          "has/slash",
        ];

        equal(
          "every name lands the same way on send, raise and rail",
          names.filter(
            (event) => sendTakes(event) !== raiseTakes(event) || sendTakes(event) !== railTakes(event)
          ),
          []
        );

        equal(
          "a missing event is core.raise's finding, word for word",
          sendType.validateConfig({}),
          [{ key: "event", message: "must be an event name, like signup.abandoned" }]
        );
      });

      suite("proposed core: core.send's delay is optional and otherwise a duration", () => {
        const delayFinding = {
          key: "delay",
          message: "must be an ISO-8601 duration, like PT2H, or empty to send now",
        };
        const withDelay = (delay) => sendType.validateConfig({ event: "signup.abandoned", delay });

        equal("an absent delay is silent", sendType.validateConfig({ event: "signup.abandoned" }), null);
        // "" is the field's own DEFAULT, which the config form writes into
        // every block of this type, so it cannot be a finding.
        equal("and so is the empty default", withDelay(""), null);
        equal("a real duration passes", withDelay("PT2H"), null);
        equal("as does one with a date part", withDelay("P1DT6H"), null);

        equal("an hours-and-minutes shorthand is refused", withDelay("2h"), [delayFinding]);
        equal("so is a bare number", withDelay("7200"), [delayFinding]);
        equal("so is a lone P", withDelay("P"), [delayFinding]);
        // ADR-0001 decision 6: a STORED null reaches the refusal arm rather
        // than being read as an absent key.
        equal("a stored null is refused, not defaulted", withDelay(null), [delayFinding]);
        equal("and so is a number", withDelay(90), [delayFinding]);

        // core.wait refuses what this refuses: one control, one grammar. The
        // asymmetry is deliberate and is the whole of the optional case - a
        // wait with no duration is unfinished, a send with no delay is a send.
        const wait = coreTypes["core.wait"];
        const durations = ["PT2H", "P1DT6H", "2h", "7200", "P", "PT", ""];
        equal(
          "every duration string a wait refuses, a delayed send refuses too",
          durations.filter(
            (value) =>
              value !== "" &&
              (wait.validateConfig({ duration: value }) === null) !== (withDelay(value) === null)
          ),
          []
        );

        equal(
          "a bad event and a bad delay are both reported, event first",
          sendType.validateConfig({ event: "has space", delay: "soon" }).map((finding) => finding.key),
          ["event", "delay"]
        );
      });

      suite("proposed core: core.send's badge is static, by decision", () => {
        const entry = paletteEntryFor(sendType);

        equal("it declares a badge", entry.badge, "sends");
        equal("...which survives the normalizer", badgeFor(entry), "sends");
        equal("it sits with the other proposals", entry.group, "Proposed core");

        // The mechanical half of the decision recorded at the descriptor: a
        // config-dependent badge is not expressible today. `badgeFor` takes an
        // ENTRY and nothing else, where `joinLabelFor` takes a config as well,
        // which is the precedent that made the question worth asking. If this
        // ever changes, this check is the one that says so.
        const parallelEntry = paletteEntryFor(coreTypes["core.parallel"]);
        check(
          "a joinLabel is a callback, so config moves it",
          joinLabelFor(parallelEntry, { complete: "first" }) !==
            joinLabelFor(parallelEntry, { complete: "all" })
        );
        equal("a badge is inert data - badgeFor takes the entry alone", badgeFor.length, 1);
        check(
          "...and a callback in its place degrades to no badge at all",
          badgeFor({ badge: () => "timer" }) === null
        );

        // The other half: `timer` is taken, and it means something else.
        equal("core.wait's badge is timer", badgeFor(paletteEntryFor(coreTypes["core.wait"])), "timer");
        check("core.send does not reuse it", badgeFor(entry) !== "timer");

        // With no target a send goes to this chart's own session, so it is
        // inside-the-chart work and takes the editor's accent - core.raise's
        // argument, and the thing that keeps the shared glyph off core.invoke.
        check("it claims no accent token", accentTokenFor(entry) === null);
        equal("it shares core.invoke's glyph", entry.icon, paletteEntryFor(proposedCoreTypes["core.invoke"]).icon);
        check(
          "...but not core.invoke's accent, which is what tells them apart",
          accentTokenFor(paletteEntryFor(proposedCoreTypes["core.invoke"])) !== null
        );
      });

      suite("proposed core: what core.send deliberately does not declare", () => {
        // `target` is SKETCHED in the descriptor's note and not built: what a
        // target may name is statifier-ex's (ADR-0052 identity, ADR-0051's
        // invoke seam), and a field that validates nothing is a proposal made
        // by accident.
        equal(
          "no target field",
          sendType.configSchema({}).filter((field) => field.key === "target"),
          []
        );
        equal(
          "and validation has nothing to say about one",
          sendType.validateConfig({ event: "signup.abandoned", target: "#_internal" }),
          null
        );

        // `<cancel>` is sketched at the descriptor and NOT built: a cancel
        // naming the send it cancels is a cross-subtree reference, which is
        // the shape D13 refused.
        check("no core.cancel is proposed", !("core.cancel" in proposedCoreTypes));
        check("...and none is shipped either", !("core.cancel" in coreTypes));
      });

      suite("proposed core: core.send in the shipped signup document", () => {
        const raw = shipped["bdoc_signup_demo"];
        check("signup-wizard.json loads", raw !== null);
        if (raw === null) return;

        const found = [];
        const walk = (node) => {
          if (!node || typeof node !== "object") return;
          if (node.type === "core.send") found.push(node);
          for (const children of Object.values(node.slots ?? {})) children.forEach(walk);
        };
        walk(raw.root);

        equal("the document uses the proposed type once", found.length, 1);
        if (found.length !== 1) return;

        const [sendBlock] = found;
        equal("it is the onboarding deadline", sendBlock.id, "blk_su_onboarding_deadline");
        equal("its stored config validates", sendType.validateConfig(sendBlock.config), null);
        equal("it is the delayed case, which is sb-d9's live test", sendBlock.config.delay, "PT2H");

        // The point of the demo appearance: a sent event and a raised one
        // reach the SAME rule, and neither is joined to it by an edge.
        const rules = [];
        const rails = (node) => {
          if (!node || typeof node !== "object") return;
          for (const [slot, children] of Object.entries(node.slots ?? {})) {
            if (slot === "interrupts") rules.push(...children);
            children.forEach(rails);
          }
        };
        rails(raw.root);

        check(
          "a rule on some rail catches what it sends",
          rules.some((rule) => rule.config?.event === sendBlock.config.event)
        );

        const raised = [];
        const raises = (node) => {
          if (!node || typeof node !== "object") return;
          if (node.type === "core.raise") raised.push(node.config?.event);
          for (const children of Object.values(node.slots ?? {})) children.forEach(raises);
        };

       * here rather than exported, because the strict decoder is the thing

      function stripFixtureComments(raw) {
        if (Array.isArray(raw)) return raw.map(stripFixtureComments);
        if (raw === null || typeof raw !== "object") return raw;

        const out = {};
        for (const [key, value] of Object.entries(raw)) {

          out[key] = key === "config" || key === "metadata" ? value : stripFixtureComments(value);

        return out;

      suite("zoom: the ladder is reversible, which is why it is a ladder", () => {
        // The property a multiply-by-1.2 zoom does not have, and the reason

        for (const rung of ZOOM_STEPS.slice(1, -1)) {
          equal(`${rung}: up then down returns`, stepZoom(stepZoom(rung, +1), -1), rung);
          equal(`${rung}: down then up returns`, stepZoom(stepZoom(rung, -1), +1), rung);
        }

        equal("the bottom rung cannot step down past itself", stepZoom(ZOOM_MIN, -1), ZOOM_MIN);
        equal("the top rung cannot step up past itself", stepZoom(ZOOM_MAX, +1), ZOOM_MAX);
        equal("a zero direction is a no-op", stepZoom(0.8, 0), 0.8);

        // A fit lands BETWEEN rungs, and "fit, then press +" has to do
        // something visible rather than snapping back to where it already is.
        check("a between-rungs scale steps up past itself", stepZoom(0.72, +1) > 0.72);
        check("a between-rungs scale steps down past itself", stepZoom(0.72, -1) < 0.72);

      /*
       * The shell's document loader is async, and until sb-3kf it was
       * unguarded: two switches inside one frame meant the fetch that resolved
       * last painted the canvas, so the picker and the canvas could disagree
       * persistently. `sequence.js` is the guard, kept pure precisely so this
       * page can assert it.
       *
       * Imported here rather than in the block at the top of the file because
       * imports hoist and this suite is additive; nothing above it moves.
       */
      const { createSequence: makeSequence } = await import("../js/sequence.js");

      suite("sequence: the generation token, which is the whole guard (sb-3kf)", () => {
        const seq = makeSequence();

        check("no generation is current before the first begin", !seq.isCurrent(0));
        check("and a token from nowhere is not current either", !seq.isCurrent(1));

        const first = seq.begin();
        check("the first token is current", seq.isCurrent(first));

        const second = seq.begin();
        check("beginning again supersedes the first", !seq.isCurrent(first));
        check("and makes the second current", seq.isCurrent(second));
        check("tokens are distinct", first !== second);

        // The property that matters is monotonic, not merely different: an
        // older token must never come back into force.
        const third = seq.begin();
        check("the first stays superseded after a third", !seq.isCurrent(first));
        check("the second is superseded too", !seq.isCurrent(second));
        check("only the newest is current", seq.isCurrent(third));

        // Two sequences do not share a namespace, so a token cannot leak
        // across loaders and accidentally read as current.
        const other = makeSequence();
        const foreign = other.begin();
        check("a foreign sequence's token is not current here", !seq.isCurrent(foreign));

        equal("the readout reports the generation", seq.generation, third);
      });

      /*
       * The loader itself is not importable here - `shell.js` reaches for the
       * shell's DOM at module scope and would throw on this page - so what
       * this asserts is the loader's SHAPE, written out against the same
       * guard: take a token, await, discard unless the token is still current.
       *
       * What is deliberately NOT covered: that `shell.js` actually wires the
       * guard this way, and that the picker's own value converges. Both need
       * the shell's DOM, and the spike is a static page with no runner; they
       * are covered by the base-vs-branch manual pass on the demo documents.
       */
      const outOfOrder = (() => {
        const seq = makeSequence();
        const painted = [];

        // Two "fetches", resolving in the opposite order to their requests -
        // the exact race the bug needed.
        const load = (name, resolveAfter) => {
          const token = seq.begin();
          return resolveAfter.then(() => {
            if (!seq.isCurrent(token)) return;
            painted.push(name);
          });
        };

        let releaseFirst;
        const first = new Promise((resolve) => {
          releaseFirst = resolve;
        });

        const runs = [load("card-processing", first), load("signup-wizard", Promise.resolve())];

        releaseFirst();

        return Promise.all(runs).then(() => painted);
      })();

      const outOfOrderPainted = await outOfOrder;

      suite("sequence: the loader shape converges on the last request (sb-3kf)", () => {
        equal(
          "the superseded load paints nothing, however late it lands",
          outOfOrderPainted,
          ["signup-wizard"]
        );
      });

      import { railExitEdge } from "../js/render.js";

      /*
       * sb-67s. A rail's exit edge is drawn in the vocabulary the SLOT
       * declares, and the operator's 2026-08-29 ruling says which vocabulary
       * `failure` gets: an ordinary solid flow edge, because the accepted
       * ADR-0004 amendment makes an `on_error` subtree's completion an outcome
       * the parent continues from IN BAND. The dashed exit channel stays
       * exclusively interrupt vocabulary.
       *
       * The derivation is pure and total so it can be asserted without a
       * layout, a measurement or a frame - the bug this replaces was a
       * hard-coded `kind: "interrupt"` for every rail child, which no amount
       * of DOM assertion would have caught while the only rails in the
       * fixtures were interrupt rails.
       */
      suite("render: a rail's exit edge reads the slot's style (sb-67s)", () => {
        equal(
          "a failure rail exits as flow",
          railExitEdge("failure"),
          { kind: "flow", routing: "flow", marker: "url(#sb-arrow)" }
        );

        equal(
          "a secondary rail still exits as interrupt",
          railExitEdge("secondary"),
          { kind: "interrupt", routing: "channel", marker: "url(#sb-arrow-interrupt)" }
        );

        // The class the routing pass builds is `sb-edge sb-edge--<kind>`, so
        // "flow" here is not a label: it is the assertion that a failure exit
        // shares one stylesheet rule with the edge between two adjacent steps
        // and can never pick up the dashes or the warning hue.
        equal("...and a failure exit takes no class of its own", railExitEdge("failure").kind, "flow");

        // Total, and conservatively so: an unrecognised style over-warns
        // rather than silently hiding a way out. `layout.js` treats an unknown
        // style as a metadata typo in exactly this direction.
        for (const odd of [undefined, null, "", "primary", "Failure", "on_error"]) {
          equal(
            `an unrecognised style (${show(odd)}) falls back to interrupt`,
            railExitEdge(odd).kind,
            "interrupt"
          );
        }

        // Nothing but the style reaches the decision. `"on_error"` above is
        // the load-bearing case: the SLOT NAME of the one type that has a
        // failure rail today gets the fallback, because a name is not
        // metadata and this function has never been told any.
        equal("the derivation reads one argument", railExitEdge.length, 1);
      });

      /*
       * The same ruling in the DOM, through the real two-pass render.
       *
       * Two documents rather than one, because each isolates a single
       * vocabulary: the failure document must produce NO dashed edge anywhere,
       * and the interrupt document must still produce one. Asserting only the
       * first would go green again the day the renderer stopped drawing rail
       * exits at all.
       *
       * Sabotage: restoring the hard-coded `kind: "interrupt"` in
       * `collectEdges` turns the first three checks red and leaves the control

       */
      suite("render: a failure exit is routed as flow, an interrupt exit is not (sb-67s)", () => {
        const proposing = proposingRegistry();

        const failureDocument = () =>
          createDocument(
            block({
              id: "blk_ROOT",
              type: "core.sequence",
              slots: {
                body: [
                  block({
                    id: "blk_INV",
                    type: "core.invoke",
                    config: { invoke_type: "myapp:authorize" },
                    slots: { on_error: [step("blk_RECOVER", "verify")] },
                  }),
                ],
              },
            }),
            { id: "bdoc_SB67S_FAILURE" }
          );

        const interruptDocument = () =>
          createDocument(
            block({
              id: "blk_ROOT",
              type: "core.sequence",
              slots: {
                body: [
                  block({
                    id: "blk_GRP",
                    type: "core.group",
                    slots: {
                      body: [step("blk_INNER", "email")],
                      interrupts: [
                        block({
                          id: "blk_RULE",
                          type: "core.on_event",
                          config: { event: "order.cancelled", outcome: "abandon" },
                        }),

                    },
                  }),
                ],
              },
            }),
            { id: "bdoc_SB67S_INTERRUPT" }

        // Mounted into the live document, because pass two measures real
        // rectangles; `route()` is called by hand so the assertions do not
        // wait on a frame.
        const drawn = (doc) => {
          const mount = el("div");
          document.body.append(mount);

          const handle = renderCanvas(mount, layoutDocument(doc, proposing), { center: false });
          handle.route();

          const edges = Array.from(mount.querySelectorAll(".sb-edge")).map((path) => ({
            kind: path.classList.contains("sb-edge--interrupt") ? "interrupt" : "flow",
            marker: path.getAttribute("marker-end"),
            d: path.getAttribute("d"),

        const interrupt = drawn(interruptDocument());

        check("the failure document draws edges at all", failure.length > 0, JSON.stringify(failure));
        equal(

        equal(
          "an interrupt rail still draws exactly one dashed exit",
          interrupt.filter((edge) => edge.kind === "interrupt").length,
          1

        check(
          "...carrying the interrupt arrowhead",
          interrupt.some((edge) => edge.marker === "url(#sb-arrow-interrupt)"),
          JSON.stringify(interrupt)

      /* =========================================== sb-5ow: draft accumulation
       *
       * The bug these suites pin down: ADR-0005 decision 9 validates a config
       * as a UNIT and stores nothing on a refusal, so a type with two required
       * fields and no usable defaults could not be configured through a form
       * that commits per field. Fill `path` and `value` is still empty, so the
       * gate refuses; fill `value` and the edit is computed against the stored
       * config, which never took `path`, so the gate refuses again.
       *
       * The operator's ruling is DRAFT ACCUMULATION, and what these check is
       * that the fix moved only ONE thing: which config the next edit is
       * written through. The gate is asked the same question, over a whole
       * config, every time; a refusal still stores nothing; the document still
       * only ever holds a config that validated.
       *
       * Imports are local to this block, and the suites are appended at the
       * END of the file, for the merge reason `core.subchart`'s suites give:
       * sibling beads are appending their own suites to this file tonight.
       */

      import { createDraftStore, pendingKeys } from "../js/panes.js";
      import { commitField } from "../js/inspector.js";

      /* One freshly inserted `core.assign` in a sequence, plus the editor host
       * `commitField` talks to - `interact.js`'s `updateConfig` seam, verbatim:
       * `null` when the edit landed, the refusal otherwise. */
      function assignFixture() {
        const registry = proposingRegistry();
        const inserted = blockForType(registry, "core.assign");

        const document = createDocument(
          block({
            id: "blk_ROOT",
            type: "core.sequence",
            slots: { body: [inserted] },
          }),
          { id: "doc_sb5ow", revision: 0 }
        );

        let session = select(createSession(document, registry), inserted.id);

        const host = {
          state: () => ({ session, findings: [] }),
          updateConfig: (id, config) => {
            const result = updateBlockConfig(session, id, config);
            if (!result.ok) return result.error;
            session = result.value;
            return null;
          },
        };

        return {
          registry,
          blockId: inserted.id,
          host,
          session: () => session,
          stored: () => findBlock(session.document, inserted.id).config,
          revision: () => session.document.revision,
          /* The form as the config pane builds it: over the DRAFT when one is
           * outstanding, which is the second half of the fix. */
          form: (drafts) => {
            const node = findBlock(session.document, inserted.id);
            const config = drafts ? drafts.read(inserted.id, node.config) : node.config;
            return configFormFor(registry, { ...node, config }, []);
          },
        };
      }

      const fieldNamed = (form, key) => form.fields.find((field) => field.key === key);

      /* `commitField` needs only these three things off its wrapper, which is
       * why it is exported: the sequencing is assertable without a page. */
      const wrapperStub = () => ({ dataset: {}, append: () => {}, querySelectorAll: () => [] });

      suite("config drafts: the bug, still true of the gate (sb-5ow)", () => {
        const fixture = assignFixture();

        equal("an insert seeds both required fields empty", fixture.stored(), {
          path: "",
          value: "",
        });

        // Straight at the seam, with no draft anywhere: this is what the
        // inspector used to do, and both halves of it are refused.
        const first = fixture.host.updateConfig(fixture.blockId, {
          path: "review.parked",
          value: "",
        });
        check("a config with only the path filled in is refused", first !== null);

        const second = fixture.host.updateConfig(fixture.blockId, {
          path: "",
          value: "true",
        });
        check("and so is one with only the value", second !== null);

        equal("so nothing was stored", fixture.stored(), { path: "", value: "" });
        equal("and the revision never moved", fixture.revision(), 0);

      suite("config drafts: two required fields, configured (sb-5ow)", () => {
        const fixture = assignFixture();
        const drafts = createDraftStore();
        const scope = { drafts, refresh: () => {}, mount: null };

        const commit = (key, value) => {
          const form = fixture.form(drafts);
          return commitField(
            fieldNamed(form, key),
            form,
            fixture.host,
            scope,
            wrapperStub(),
            value
          );
        };

        check("but it is held as a draft", drafts.pending(fixture.blockId));
        equal("the document is untouched", fixture.stored(), { path: "", value: "" });
        equal("and the revision has not moved", fixture.revision(), 0);

          "review.parked"

        equal("which lands whole", fixture.stored(), { path: "review.parked", value: "true" });

        check("and the draft is gone", !drafts.pending(fixture.blockId));
