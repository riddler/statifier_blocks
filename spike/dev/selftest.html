    <!--
      A dependency-free check on the spike's client-side core: document model,
      block-type registry, command algebra, and drop-target enumeration. It is
      a DEV page, not part of the editor: it loads no spike CSS, styles itself
      inline, and never reaches the shell.

      Why a page rather than a test runner: this repository's toolchain is
      Node-free on purpose (ADR-0005 decision 1's asset argument, sui-ADR-0009's
      reasons), so the committed verification artifact has to be something a
      browser can run from the same static server the spike is already served
      by. Open it at http://localhost:8642/dev/selftest.html.

      What it does NOT replace: `mix test`. Nothing here tests lib/ - these are
      assertions about the spike's own mirror of semantics that lib/ owns, and
      when the two disagree the ADR is the contract and this file is the bug.
    -->

  <body>
    <h1>JS core self-test</h1>
    <p class="lede">
      spike/js: document model, palette registry, command algebra, drop targets.
      Results also go to the console with a <code>[selftest]</code> prefix.
    </p>

    <div id="summary" data-state="running">running...</div>
    <div id="results"></div>

    <script type="module">
      import {
        blocks,
        block,
        createDocument,
        findBlock,
        fetchPath,
        fromJson,
        mintBlockId,
        parentOf,
        subtreeIds,
        toJson,
        validate,
      } from "../js/document.js";

      import {
        admits,
        badgeFor,
        coreTypes,
        describe,
        paletteEntryFor,
        paletteGroups,
        resolveBlock,
        spikeRegistry,
      } from "../js/palette.js";

      import { parseParams, proposedCoreTypes } from "../js/proposed-core.js";

      import {
        applyCommand,
        canRedo,
        canUndo,
        checkConfig,
        commit,
        createHistory,
        insert,
        move,
        redo,
        remove,
        target,
        undo,
        updateConfig,
      } from "../js/edit.js";

      import { droppableSlots, droppableSlotsFor, slotKey } from "../js/targets.js";

      import {
        accentTokenFor,
        blockAccentStyle,
        contrastRatio,
        coverage,
        declarationBlocks,
        declaredTokens,
        isAccentToken,
        structuralDeclarations,
        themeGaps,
        usedTokens,
      } from "../js/theme.js";

      import {
        beginDrag,
        blockForType,
        canRedoSession,
        canUndoSession,
        createSession,
        descendantCount,
        deselect,
        dropAt,
        dropStateFor,
        droppableCount,
        endDrag,
        insertTypeAt,
        isCollapsed,
        isDropAllowed,
        moveIndexFor,
        positionOf,
        redoSession,
        removeBlock,
        select,
        selectionSummary,
        toggleCollapsed,
        typesForSlot,
        undoSession,
      } from "../js/session.js";

      import {
        fanPath,
        flowPath,
        humanizeDuration,
        interruptPath,
        joinPath,
        layoutDocument,
        readValuePath,
      } from "../js/layout.js";

      import {
        addRow,
        anchorLabel,
        collectFindings,
        configFormFor,
        controlFor,
        demoFindings,
        durationFrom,
        durationParts,
        findingsUnder,
        highlight,
        moveRow,
        paletteView,
        removeRow,
        resolveAnchor,
        seedRow,
        severityCounts,
        writeAtPath,
      } from "../js/panes.js";

      import {
        annotateCondition,
        ancestorPaths,
        conditionFields,
        conditionPaths,
        datamodelView,
        exampleText,
        indexPaths,
        tokenizeCondition,
        typeLabel,
      } from "../js/datamodel.js";

      import {
        NOT_STARTED,
        bindingsAt,
        endCursor,
        fixturesFor,
        fixturesText,
        invokeView,
        moveCursor,
        parseFixtures,
        resetCursor,
        runById,
        runSummary,
        runView,
        tableBlockIds,
        tableView,
        tablesForBlock,
      } from "../js/fixtures.js";

      /* ------------------------------------------------ the assert harness */

      const groups = [];
      let current = null;

      function suite(name, body) {
        current = { name, checks: [] };
        groups.push(current);
        try {
          body();
        } catch (error) {
          current.checks.push({
            state: "fail",
            label: "suite threw",
            detail: String(error && error.stack ? error.stack : error),
          });
        }
        current = null;
      }

      function check(label, passed, detail) {
        current.checks.push({
          state: passed ? "pass" : "fail",
          label,
          detail: passed ? null : detail ?? null,
        });
      }

      function equal(label, actual, expected) {
        const passed = deepEqual(actual, expected);
        check(
          label,
          passed,
          passed ? null : `expected ${show(expected)}\n     got ${show(actual)}`
        );
      }

      function show(value) {
        return typeof value === "string" ? value : JSON.stringify(value);
      }

      function deepEqual(a, b) {
        if (a === b) return true;
        if (typeof a !== typeof b || a === null || b === null) return false;
        if (typeof a !== "object") return false;

        if (Array.isArray(a) !== Array.isArray(b)) return false;
        if (Array.isArray(a)) {
          return a.length === b.length && a.every((item, i) => deepEqual(item, b[i]));
        }

        const ak = Object.keys(a).sort();
        const bk = Object.keys(b).sort();
        return deepEqual(ak, bk) && ak.every((key) => deepEqual(a[key], b[key]));
      }

      /* ------------------------------------------------- inline fixtures */

      /*
       * Defined here rather than read from spike/fixtures/, so this page runs
       * on its own branch with nothing else present. Card-processing and
       * signup-wizard content only, and the three approved invoke flavors.
       *
       * The shape mirrors ADR-0001's worked example: a sequence root, an
       * authorize step, a resumable group carrying one interrupt rule, a
       * branch with one arm plus otherwise, and a parallel block with two
       * lanes - which between them exercise every schema feature decision 10
       * lists.
       */
      const registry = spikeRegistry();

      function cardDocument() {
        return createDocument(
          block({
            id: "blk_ROOT",
            type: "core.sequence",
            slots: {
              body: [
                block({
                  id: "blk_AUTH",
                  type: "myapp.authorize",
                  typeVersion: 2,
                  config: { assign_to: "authorization", timeout: "PT30S" },
                }),
                block({
                  id: "blk_GRP",
                  type: "core.resumable_group",
                  config: { history: "deep" },
                  slots: {
                    body: [
                      block({
                        id: "blk_BR",
                        type: "core.branch",
                        config: {
                          arms: [
                            { slot: "arm_approved", cond: "budget_remaining > amount" },
                          ],
                        },
                        slots: {
                          arm_approved: [
                            block({
                              id: "blk_PAR",
                              type: "core.parallel",
                              config: { lanes: ["capture", "receipt"] },
                              slots: {
                                lane_capture: [
                                  block({
                                    id: "blk_CAP",
                                    type: "myapp.capture",
                                    config: { amount_key: "amount", retries: 2 },
                                  }),
                                ],
                                lane_receipt: [
                                  block({
                                    id: "blk_WAI",
                                    type: "core.wait",
                                    config: { duration: "PT48H" },
                                  }),
                                  block({
                                    id: "blk_SIG",
                                    type: "myapp.signup",
                                    config: { step: "confirm" },
                                  }),
                                ],
                              },
                            }),
                          ],
                          otherwise: [
                            block({
                              id: "blk_SG2",
                              type: "myapp.signup",
                              config: { step: "email" },
                            }),
                          ],
                        },
                      }),
                    ],
                    interrupts: [
                      block({
                        id: "blk_INT",
                        type: "core.on_event",
                        config: { event: "myapp.cancelled", outcome: "abandon" },
                      }),
                    ],
                  },
                }),
              ],
            },
          }),
          { id: "bdoc_CARD", revision: 17, metadata: { name: "Card authorization" } }
        );
      }

      /* A tiny document carrying a block type this registry does not have. */
      function retiredDocument() {
        return createDocument(
          block({
            id: "blk_R1",
            type: "core.sequence",
            slots: {
              body: [
                block({
                  id: "blk_GONE",
                  type: "myapp.retired",
                  typeVersion: 3,
                  config: { note: "a step whose block type the host removed" },
                  slots: {
                    body: [
                      block({
                        id: "blk_KEPT",
                        type: "myapp.capture",
                        config: { amount_key: "amount" },
                      }),
                    ],
                  },
                }),
              ],
            },
          }),
          { id: "bdoc_RETIRED" }
        );
      }

      const step = (id, stepName = "email") =>
        block({ id, type: "myapp.signup", config: { step: stepName } });

      /* ----------------------------------------------------------- suites */

      suite("document: load and serialize round-trip (ADR-0001 d8)", () => {
        const doc = cardDocument();

        check("the fixture validates", validate(doc) === null, JSON.stringify(validate(doc)));

        const bytes = toJson(doc);
        const decoded = fromJson(bytes);

        check("decoding succeeds", decoded.ok, JSON.stringify(decoded.error));
        equal("decode(encode(d)) == d", decoded.value, doc);
        equal("encode(decode(encode(d))) == encode(d)", toJson(decoded.value), bytes);

        check(
          "canonical keys are sorted and unspaced",
          bytes.startsWith('{"id":"bdoc_CARD","metadata":'),
          bytes.slice(0, 60)
        );
        check(
          "an empty slot list is omitted, not encoded as []",
          !bytes.includes('"slots":{}') && !bytes.includes("[]"),
          bytes.slice(0, 200)
        );
        check(
          "type_version is spelled as stored",
          bytes.includes('"type_version":2'),
          "missing type_version"
        );

        const withFloat = cardDocument();
        withFloat.root.config = { ratio: 1.5 };
        equal("a float in config is rejected by name", validate(withFloat)?.tag, "malformed_block");
        equal("...and named as a float", validate(withFloat)?.problem?.tag, "float");

        const dup = cardDocument();
        dup.root.slots.body.push(step("blk_AUTH"));
        equal("a duplicate id is rejected", validate(dup)?.tag, "duplicate_block_id");

        equal(
          "bytes that are not a block document refuse",
          fromJson('{"hello":1}').error.tag,
          "not_a_block_document"
        );
      });

      /*
       * Decoding is where the spike is most tempted to be lenient, and every
       * lenience is a silent divergence from Decode: a default the package
       * does not have accepts bytes it would refuse, and a dropped key breaks
       * decision 2's `encode(decode(bytes)) == bytes` with no error to say so.
       */
      suite("document: decode refuses what Decode refuses", () => {
        const bytes = toJson(cardDocument());

        const withStray = JSON.parse(bytes);
        withStray.root.slots.body[0].collapsed = true;
        const stray = fromJson(JSON.stringify(withStray));
        check("a block key the encoder never writes is refused", !stray.ok);
        equal("...as a malformed block", stray.error.tag, "malformed_block");
        equal("...naming the key", stray.error.key, "collapsed");
        equal("...and the block it is on", stray.error.id, "blk_AUTH");

        const noRevision = JSON.parse(bytes);
        delete noRevision.revision;
        equal(
          "a document missing revision is refused, not defaulted to 0",
          fromJson(JSON.stringify(noRevision)).error,
          { tag: "malformed_envelope", field: "revision" }
        );

        const noTypeVersion = JSON.parse(bytes);
        delete noTypeVersion.root.type_version;
        const missing = fromJson(JSON.stringify(noTypeVersion));
        equal(
          "a block missing type_version is refused, not defaulted to 1",
          missing.error.tag,
          "malformed_block"
        );
        equal("...naming the field", missing.error.field, "type_version");

        const noConfig = JSON.parse(bytes);
        delete noConfig.metadata;
        check(
          "metadata IS optional and reads back as empty",
          fromJson(JSON.stringify(noConfig)).ok
        );

        for (const [label, version] of [
          ["a string", "1"],
          ["zero", 0],
          ["null", null],
          ["a float", 1.5],
        ]) {
          const bad = JSON.parse(bytes);
          bad.schema_version = version;
          equal(
            `schema_version as ${label} is a malformed envelope, not a future version`,
            fromJson(JSON.stringify(bad)).error,
            { tag: "malformed_envelope", field: "schema_version" }
          );
        }

        const future = JSON.parse(bytes);
        future.schema_version = 2;
        equal(
          "a positive integer that is not 1 IS a future version",
          fromJson(JSON.stringify(future)).error,
          { tag: "unsupported_schema_version", version: 2 }
        );

        // Precedence: the tree walk runs to completion before uniqueness, so a
        // malformed block outranks a duplicate id however pre-order orders them.
        const both = cardDocument();
        both.root.slots.body[0].id = "blk_ROOT";
        both.root.slots.body[1].slots.interrupts[0].typeVersion = 0;
        equal(
          "a malformed block outranks a duplicate id",
          validate(both).tag,
          "malformed_block"
        );
      });

      /*
       * JavaScript hazards with no Elixir counterpart. `Map.get/3` cannot see
       * an inherited key and `Map.put/3` cannot reach a prototype; a plain JS
       * object read and write can do both, and slot names arrive from decoded
       * bytes and from replayed commands.
       */
      suite("document: slot names are data, not property lookups", () => {
        const doc = cardDocument();

        // "toString" resolves off Object.prototype without the read guard, and
        // a function's `.length` of 0 would admit index 0 and then throw.
        const inherited = applyCommand(
          doc,
          insert(target("blk_ROOT", "toString", 0), step("blk_TS"))
        );
        check(
          "a slot named toString creates an own key, as Map.put would",
          inherited.ok,
          JSON.stringify(inherited.error)
        );
        equal(
          "...holding just that block",
          inherited.value.document.root.slots["toString"].map((b) => b.id),
          ["blk_TS"]
        );
        equal(
          "...and index 1 is out of range, so no inherited length was read",
          applyCommand(doc, insert(target("blk_ROOT", "toString", 1), step("blk_TS2"))).error.tag,
          "index_out_of_range"
        );
        check(
          "applyCommand stays total rather than throwing",
          applyCommand(doc, remove("blk_ROOT")).ok === false
        );

        // "__proto__" assigns the prototype instead of defining an own key,
        // unless the write defines rather than assigns.
        const proto = applyCommand(
          doc,
          insert(target("blk_ROOT", "__proto__", 0), step("blk_PT"))
        );
        check("a slot named __proto__ applies", proto.ok, JSON.stringify(proto.error));
        check(
          "...as an own, enumerable key",
          Object.keys(proto.value.document.root.slots).includes("__proto__"),
          JSON.stringify(Object.keys(proto.value.document.root.slots))
        );
        equal(
          "...and survives a decode round-trip",
          fromJson(toJson(proto.value.document)).value.root.slots["__proto__"].map((b) => b.id),
          ["blk_PT"]
        );
      });

      suite("document: traversal", () => {
        const doc = cardDocument();

        equal(
          "blocks/1 is pre-order with UTF-8-sorted slots",
          blocks(doc).map((b) => b.id),
          [
            "blk_ROOT",
            "blk_AUTH",
            "blk_GRP",
            "blk_BR",
            "blk_PAR",
            "blk_CAP",
            "blk_WAI",
            "blk_SIG",
            "blk_SG2",
            "blk_INT",
          ]
        );

        equal("findBlock reaches a deep block", findBlock(doc, "blk_WAI").type, "core.wait");
        check("findBlock on an absentee is null", findBlock(doc, "blk_NOPE") === null);

        equal("the root's path is empty", fetchPath(doc, "blk_ROOT"), []);
        equal("a deep path names every step", fetchPath(doc, "blk_SIG"), [
          { parentId: "blk_ROOT", slot: "body", index: 1 },
          { parentId: "blk_GRP", slot: "body", index: 0 },
          { parentId: "blk_BR", slot: "arm_approved", index: 0 },
          { parentId: "blk_PAR", slot: "lane_receipt", index: 1 },
        ]);
        check("an absent id has no path", fetchPath(doc, "blk_NOPE") === null);

        equal("parentOf walks one step up", parentOf(doc, "blk_SIG").id, "blk_PAR");
        check("the root has no parent", parentOf(doc, "blk_ROOT") === null);

        equal(
          "subtreeIds includes the block itself",
          [...subtreeIds(findBlock(doc, "blk_PAR"))].sort(),
          ["blk_CAP", "blk_PAR", "blk_SIG", "blk_WAI"]
        );
      });

      suite("palette: the core vocabulary, transcribed", () => {
        equal("seven core entries", Object.keys(coreTypes).length, 7);

        equal(
          "core.sequence declares one body slot",
          coreTypes["core.sequence"].slots({}),
          [{ name: "body", arity: "any", label: "Steps" }]
        );

        equal(
          "core.branch's slots follow its arms, then otherwise",
          coreTypes["core.branch"]
            .slots({ arms: [{ slot: "arm_approved", cond: "x > 1" }] })
            .map((s) => [s.name, s.arity]),
          [
            ["arm_approved", "at_least_one"],
            ["otherwise", "any"],
          ]
        );

        equal(
          "a branch arm's condition field reads through value_path",
          coreTypes["core.branch"].configSchema({
            arms: [{ slot: "arm_bad" }, { slot: "arm_approved", cond: "x > 1" }],
          })[1],
          {
            key: "arm_approved",
            type: "expression",
            label: 'When "approved"',
            required: true,
            default: "",
            valuePath: ["arms", 1, "cond"],
          }
        );

        equal(
          "a lane stores its bare name and the slot prefixes it",
          coreTypes["core.parallel"].slots({ lanes: ["capture", "receipt"] }).map((s) => s.name),
          ["lane_capture", "lane_receipt"]
        );

        equal(
          "core.parallel renders as columns (d10)",
          paletteEntryFor(coreTypes["core.parallel"]).layout,
          "columns"
        );
        equal(
          "a group's interrupts render as a secondary rail (d10)",
          paletteEntryFor(coreTypes["core.group"]).slotStyle.interrupts,
          "secondary"
        );

        equal(
          "core.wait rejects a duration that is not ISO-8601",
          coreTypes["core.wait"].validateConfig({ duration: "48 hours" }),
          [{ key: "duration", message: "must be an ISO-8601 duration, like PT30S or P1D" }]
        );
        check(
          "...and accepts one that is",
          coreTypes["core.wait"].validateConfig({ duration: "PT48H" }) === null
        );

        equal(
          "core.on_event is an interrupt handler and nothing else",
          coreTypes["core.on_event"].io({}).kinds,
          ["interrupt_handler"]
        );

        // A stored null is a config value ADR-0001 decision 6 admits, so it
        // has to reach the "must be a list" arm rather than be coalesced into
        // a valid empty list - `Map.get/3` defaults on an ABSENT key only.
        equal(
          "a null arms list is refused, not read as empty",
          coreTypes["core.branch"].validateConfig({ arms: null }),
          [{ key: "arms", message: "must be a list of arms" }]
        );
        equal(
          "a null lanes list is refused, not read as empty",
          coreTypes["core.parallel"].validateConfig({ lanes: null }),
          [{ key: "lanes", message: "must be a list of lane names" }]
        );
        check(
          "an absent arms key IS the empty case",
          coreTypes["core.branch"].validateConfig({}) === null
        );

        const groupsView = paletteGroups(registry);
        equal(
          "the palette browser sorts groups by name, then order, then label",
          groupsView.map((g) => g.name),
          ["Card processing", "Signup wizard", "Structure"]
        );
        equal(
          "...and orders a group's entries by declared order",
          groupsView.find((g) => g.name === "Structure").entries.map((e) => e.entry.label),
          ["Sequence", "Group", "Resumable group", "Branch", "Parallel", "Wait", "On event"]
        );
      });

      suite("palette: resolution, migration, and defaults", () => {
        const stored = block({
          id: "blk_OLD",
          type: "myapp.authorize",
          typeVersion: 1,
          config: { field: "authorization" },
        });

        const resolved = resolveBlock(registry, stored);
        check("a stale type_version resolves", resolved.ok, JSON.stringify(resolved.error));
        equal("...migrating the config in memory", resolved.value.block.config, {
          assign_to: "authorization",
        });
        equal(
          "...and leaving type_version as stored",
          resolved.value.block.typeVersion,
          1
        );
        equal("the document's own block is untouched", stored.config, { field: "authorization" });

        const tooNew = block({ id: "blk_NEW", type: "myapp.capture", typeVersion: 9 });
        equal(
          "a block authored by a newer type is a hard error",
          resolveBlock(registry, tooNew).error.tag,
          "block_type_too_new"
        );

        const current = block({ id: "blk_NM", type: "myapp.capture", typeVersion: 1 });
        check("a current-version block resolves untouched", resolveBlock(registry, current).ok);

        const noMigration = block({ id: "blk_NM2", type: "myapp.capture", typeVersion: 0 });
        equal(
          "a stale type with no migrate_config refuses",
          resolveBlock(registry, noMigration).error.tag,
          "migration_failed"
        );

        const bare = { name: "myapp.bare", currentVersion: 1, slots: () => [] };
        equal("a type declaring no palette_entry still renders", paletteEntryFor(bare), {
          label: "myapp.bare",
          group: "Other",
          description: "",
          icon: null,
          keywords: [],
          order: 0,
          layout: "stack",
          slotStyle: {},
          // sb-957: no accent means the editor's own, which is what every
          // core type gets and what a bare descriptor must keep getting.
          accentToken: null,
          // sb-nt3 added the key and sb-p0k the renderer; this assertion is
          // the reason both belong in PALETTE_ENTRY_DEFAULTS rather than in
          // the proposal file. A bare descriptor reads `null`, never
          // `undefined`, so the renderer's `!== null` test is total.
          badge: null,
        });
      });

      suite("palette: unresolvable types never crash (d12)", () => {
        const doc = retiredDocument();

        check("a document naming an unknown type decodes", fromJson(toJson(doc)).ok);

        const view = describe(registry, findBlock(doc, "blk_GONE"));
        check("it resolves to a placeholder", view.unresolved === true);
        equal("...naming the missing type", view.reason.tag, "unknown_block_type");
        equal("...labelled by its type name", paletteEntryFor(view.descriptor).label, "myapp.retired");
        equal("...declaring no slots, so it is no drop target", view.descriptor.slots({}), []);
        check(
          "...and validating nothing, so no form is offered",
          view.descriptor.validateConfig({ anything: true }) === null
        );

        equal(
          "its children are still in the document",
          findBlock(doc, "blk_KEPT").type,

        );

        // The preservation property: edit an unrelated part of the tree, and
        // the unresolvable block's bytes are unchanged.

        );

        );
        check(

        );

        equal(

          invoke.configSchema({}).map((field) => [field.key, field.type, field.required]),
          [
            ["invoke_type", "string", true],
            ["assign_to", "string", false],
            ["params", "string", false],
          ]
        );

        /*
         * The regex is GENERIC, which is the whole point of it living in a
         * core type rather than in demo-types.js. Sabotage: replacing
         * INVOKE_TYPE with demo-types.js's `^myapp:` spelling turns the

        check(

        );
        for (const bad of ["authorize", "myapp:", ":authorize", "MyApp:authorize", "myapp:Auth", ""]) {

            `refuses ${JSON.stringify(bad)}`,
            invoke.validateConfig({ invoke_type: bad }),

        equal(

        const invoke = proposedCoreTypes["core.invoke"];
        const ok = (params) => invoke.validateConfig({ invoke_type: "myapp:authorize", params });

        equal(
          "one name=path pair per line, whitespace tolerated",
          parseParams("amount = order.total\n  card=order.card_token  "),

      /*

      suite("proposed core: core.raise is a leaf that names an event", () => {
        const raise = proposedCoreTypes["core.raise"];

        check("it is not in the shipped core vocabulary", !("core.raise" in coreTypes));

        equal("no slots at all - a raise has no subtree", raise.slots({}), []);
        equal("it is a step", raise.io({}).kinds, ["step"]);
        check(
          "produces is absent, not 'unknown' - one outcome is no join to refuse",
          raise.io({}).produces === undefined
        );
        check("and it consumes nothing", raise.io({}).consumes === undefined);
        check(

          admits(coreTypes["core.group"], {}, "body", raise, {})
        );
        check(

        );

        equal(

          [["event", "string", true]]
        );

      suite("proposed core: core.raise and core.on_event share one grammar", () => {
        const raise = proposedCoreTypes["core.raise"];
        const onEvent = coreTypes["core.on_event"];

        // The load-bearing property: a name one of them accepts and the other
        // refuses is a rail that can never catch what a step raises. Checked
        // as agreement rather than by asserting a regex twice, because two
        // spellings of the same regex is exactly the drift this guards.
        const raiseTakes = (event) => raise.validateConfig({ event }) === null;
        const railTakes = (event) =>
          (onEvent.validateConfig({ event, outcome: "abandon" }) ?? []).every(
            (finding) => finding.key !== "event"
          );

          "signup.abandoned",
          "signup.email_verified",
          "error.communication.invoke.blk_x",
          "done.state.blk_y",
          "Cancelled",
          "_internal",
          "a-b.c_d.9",
          "",
          "  ",
          ".leading",
          "9starts_with_a_digit",
          "has space",
          "has/slash",
        ];

        equal(
          "every name lands the same way on both",
          names.filter((event) => raiseTakes(event) !== railTakes(event)),
          []
        );

        check("the document's own event validates", raiseTakes("signup.abandoned"));
        equal(
          "a missing event is the field's finding",
          raise.validateConfig({}),
          [{ key: "event", message: "must be an event name, like signup.abandoned" }]
        );
        equal(
          "and so is one that is not a string",
          raise.validateConfig({ event: 3 }),
          [{ key: "event", message: "must be an event name, like signup.abandoned" }]
        );

      /*
       * sb-p0k. `badgeFor` is the renderer's whole view of the key, so the
       * refusals are the part worth pinning: a badge is interpolated onto a
       * card that is already narrow, and a host that declares a sentence must
       * get the ordinary card rather than one with its title squeezed out.
       *

       * sentence" assertion red and leaves the rest green; dropping the

      suite("proposed core: badgeFor normalizes, and refuses rather than truncates", () => {
        equal("a plain badge comes back as itself", badgeFor({ badge: "timer" }), "timer");
        equal("surrounding space is trimmed", badgeFor({ badge: "  timer  " }), "timer");

        equal("a type that declares nothing has none", badgeFor({}), null);
        equal("and neither does a null", badgeFor({ badge: null }), null);
        equal("nor a non-object", badgeFor(null), null);
        equal("nor a non-string", badgeFor({ badge: 3 }), null);
        equal("nor an all-whitespace string", badgeFor({ badge: "   " }), null);
        equal(
          "a sentence is refused, not ellipsized - 25 characters is one too many",
          badgeFor({ badge: "x".repeat(25) }),

        );
        equal("24 is the last one that fits", badgeFor({ badge: "x".repeat(24) }), "x".repeat(24));
        equal(
          "a newline means something a chip cannot say, so it is refused",
          badgeFor({ badge: "calls\nthe host" }),
          null
        );

        // The two real declarations survive the normalizer, which is the

        equal(
          "core.invoke's survives",

        equal(

      suite("layout: the badge rides the view model like the accent does", () => {
        // `spikeRegistry()` deliberately does not know the proposals, so the
        // one document in this suite builds its own registry - the same way a
        // host registering its own types would.
        const proposing = {
          ...registry,
          types: { ...registry.types, ...proposedCoreTypes },

        const doc = createDocument(
          block({
            id: "blk_ROOT",
            type: "core.sequence",
            slots: {

                  id: "blk_INV",

                  config: { invoke_type: "myapp:authorize", assign_to: "authorization" },
                  slots: {

                    ],
                  },
                }),
                block({ id: "blk_SEQ", type: "core.sequence" }),
              ],
            },
          })
        );

        const tree = layoutDocument(doc, proposing).root;
        const body = tree.slots.find((one) => one.name === "body");
        const invokeNode = body.children[0];
        const plainNode = body.children[1];
        const errorSlot = invokeNode.slots.find((one) => one.name === "on_error");

        equal("the invoke carries its badge", invokeNode.badge, "calls the host");
        equal("a type that declares none carries null", plainNode.badge, null);
        equal("and so does the wait inside on_error", errorSlot.children[0].badge, "timer");

        // The rail treatment the badge shares a card with. `secondary` is
        // what `core.group`'s interrupts slot already declares, so the
        // failure path needed no new renderer machinery - that claim is
        // exactly this assertion.
        equal("on_error is a secondary slot, like an interrupts rail", errorSlot.style, "secondary");
        equal("it is the node's only slot", invokeNode.slots.length, 1);
        equal("and it is not a primary one", invokeNode.primary.length, 0);
        equal("it is a secondary one", invokeNode.secondary.length, 1);

      suite("edit: the undo and redo stacks (d3)", () => {
        const doc = cardDocument();

        check("a fresh history can do neither", !canUndo(history) && !canRedo(history));
        equal("undo on an empty stack refuses", undo(history, registry, doc).error.tag,
          "nothing_to_undo");
        equal("redo on an empty stack refuses", redo(history, registry, doc).error.tag,
          "nothing_to_redo");

        const first = commit(history, registry, doc,
          insert(target("blk_ROOT", "body", 0), step("blk_N1")));
        check("a commit applies", first.ok, JSON.stringify(first.error));
        check("...and fills the undo stack", canUndo(first.value.history));
        check("...leaving redo empty", !canRedo(first.value.history));

        const second = commit(first.value.history, registry, first.value.document,
          updateConfig("blk_WAI", { duration: "PT1H" }));

        const back = undo(second.value.history, registry, second.value.document);
        check("undo applies", back.ok, JSON.stringify(back.error));
        equal(
          "...stepping the document back one command",
          back.value.document,
          first.value.document
        );
        check("...and filling the redo stack", canRedo(back.value.history));

        const forward = redo(back.value.history, registry, back.value.document);
        equal("redo replays the original command", forward.value.document, second.value.document);
        check("...and returns it to the undo stack", canUndo(forward.value.history));

        const back2 = undo(forward.value.history, registry, forward.value.document);
        const back3 = undo(back2.value.history, registry, back2.value.document);
        equal("undoing to the bottom restores the original", back3.value.document, doc);
        check("...leaving nothing to undo", !canUndo(back3.value.history));

        const branched = commit(back3.value.history, registry, back3.value.document,
          insert(target("blk_ROOT", "body", 0), step("blk_N2")));
        check("a fresh commit clears the redo stack", !canRedo(branched.value.history));

          updateConfig("blk_WAI", { duration: "not a duration" }));
        equal("the history refuses an invalid config", gated.error.tag, "invalid_config");

        let bounded = createHistory({ limit: 2 });
        let boundedDoc = doc;
        for (const id of ["blk_B1", "blk_B2", "blk_B3"]) {

            { parentId: "blk_BR", slot: "arm_approved" },
            { parentId: "blk_BR", slot: "otherwise" },
            { parentId: "blk_PAR", slot: "lane_capture" },
            { parentId: "blk_PAR", slot: "lane_receipt" },
            { parentId: "blk_SG2", slot: "on_complete" },
          ]
        );

        check(
          "rule 2: a step is not admitted into an interrupts slot",
          !droppableSlots(doc, registry, "blk_SIG").some(
            (t) => t.parentId === "blk_GRP" && t.slot === "interrupts"

        equal(
          "rule 2: an interrupt handler is admitted only into interrupts",
          droppableSlots(doc, registry, "blk_INT"),
          [{ parentId: "blk_GRP", slot: "interrupts" }]

        check(
          "rule 1: an undeclared slot key is never a target",
          !droppableSlots(doc, registry, "blk_SIG").some((t) => t.slot === "review"),
          "an undeclared slot leaked into the target set"
        );

        // Rule 1 again, from the other side: a config change removes a slot,
        // and the slot stops being a target with no other edit.
        const oneLane = applyCommand(doc, updateConfig("blk_PAR", { lanes: ["capture"] }));
        check(
          "rule 1: a slot config no longer declares is not a target",
          !droppableSlots(oneLane.value.document, registry, "blk_CAP").some(
            (t) => t.slot === "lane_receipt"

          !droppableSlots(filled.value.document, registry, "blk_SIG").some(

        check(

          "a palette insert asks the same question",

            id: mintBlockId(),
            type: "core.on_event",

          [{ parentId: "blk_GRP", slot: "interrupts" }]

        check(

            JSON.stringify(droppableSlots(doc, registry, "blk_SIG"))

        check(

          admits(coreTypes["core.wait"], {}, "anything", coreTypes["core.wait"], {}),
          "an absent slot_accepts entry should read as any"
        );

              ? node
              : node.slots
                  .flatMap((slot) => slot.children)
                  .map(walk)
                  .find(Boolean) ?? null;
          return walk(tree.root);
        };

        equal("every block is laid out", tree.blockCount, blocks(doc).length);
        check("depth is reported", tree.maxDepth >= 4, `got ${tree.maxDepth}`);

        // The three derivations layout.js's header comment commits to. Each
        // is asserted against a DIFFERENT core type reaching the same rule by
        // a different route, which is the property that matters: no branch on
        // a type name anywhere.
        equal("one primary slot stacks", find("blk_ROOT").arrangement, "stack");
        equal(
          "a secondary slot does not make a block fan",
          find("blk_GRP").arrangement,

        equal(

        equal("a duration summary is humanized", find("blk_WAI").summary, [

        // Vertically aligned is the common case inside a sequence, and it

        equal(

          "M 10 20 L 10 60"
        );
        equal(
          "an offset flow edge turns on the halfway line",
          flowPath({ x: 10, y: 20 }, { x: 50, y: 60 }),
          "M 10 20 V 30 Q 10 40 20 40 H 40 Q 50 40 50 50 V 60"
        );

        // A fan's elbow sits close to the HUB so every arm turns on one
        // line and the result reads as a distribution bar.
        equal(
          "a fan edge elbows just below its hub",
          fanPath({ x: 100, y: 10 }, { x: 40, y: 100 }),
          "M 100 10 V 16 Q 100 26 90 26 H 50 Q 40 26 40 36 V 100"
        );
        equal(
          "a rejoin edge elbows just above its hub",
          joinPath({ x: 40, y: 100 }, { x: 100, y: 200 }),
          "M 40 100 V 174 Q 40 184 50 184 H 90 Q 100 184 100 194 V 200"

        equal(

        check(
          "a short edge cannot turn its corners inside out",
          flowPath({ x: 0, y: 0 }, { x: 3, y: 2 }).startsWith("M 0 0") &&

        equal("as does redo", redoSession(start).error.tag, "nothing_to_redo");

        const one = insertTypeAt(start, "core.wait", {

          slot: "body",

        const two = removeBlock(one, "blk_AUTH").value;

        check("and offers a redo", canRedoSession(back), "redo unavailable after undo");

          slot: "body",
          index: 0,

       * Its shape is the SPIKE'S PROPOSAL, not a record - no accepted ADR

      function datamodelDoc() {
        return {
          version: 1,
          scopes: [
            {

              description: "Host-owned. The same for every run.",

                  path: "amount_cents",
                  type: "integer",
                  label: "Amount (minor units)",
                  example: 42350,

                {
                  name: "risk_reasons",
                  path: "risk_reasons",
                  type: "list",
                  item_type: "string",
                  label: "Risk reasons",
                  example: ["velocity", "new_device"],
                },

                  name: "review",
                  path: "review",
                  type: "object",
                  label: "Manual review",
                  note: "Written by the park step.",

                      label: "Parked",
                      example: false,
                    },

                      path: "review.resolution",
                      type: "string",
                      label: "Resolution",
                      example: "",
                      one_of: ["", "approve", "decline"],
                    },
                  ],
                },
              ],
            },
            {
              scope: "event",
              label: "Event payload",
              description: "The payload of the event being handled.",
              entries: [
                {
                  name: "review_resolved",
                  path: "event.review_resolved",
                  type: "object",
                  label: "review.resolved",
                  fields: [
                    {
                      name: "decision",
                      path: "event.review_resolved.decision",
                      type: "string",
                      label: "Decision",
                      example: "approve",
                      one_of: ["approve", "decline"],
                    },
                  ],
                },
              ],
            },
          ],
        };
      }

      const names = (nodes) => nodes.map((node) => node.path);

          "global",

        // which of two identically-named paths an author wants.
        equal("a scope carries its own description", view.scopes[1].description, "One per run.");
        // The `event.` prefix is stated once on the scope, not on every row.
        equal("only the event scope is prefixed", view.scopes.map((one) => one.prefix), [
          "",

        // search box has to be the number the tree can show.
        equal("the total counts nested fields too", view.total, 9);
        equal("and nothing is filtered out with no query", view.matched, 9);

        equal("a note rides along", review.note, "Written by the park step.");

        const byPath = datamodelView(doc, "review.parked");

        // Two entries carry those words - the `review` object here and
        // `limits.manual_review_backlog` a scope away - and the count says two.
        // The object then shows three ROWS, because it brings its fields with
        // it; counting those as matches would make one hit read as three,
        // which the author can see is wrong from the highlighting alone.
        const parent = datamodelView(doc, "manual review");
        equal("the count is entries that matched", parent.matched, 2);
        equal("a matched object is shown with all of its children", countRows(parent.scopes[1].nodes), 3);
        equal(
          "including ones that do not match themselves",
          names(parent.scopes[1].nodes[0].children),
          ["review.parked", "review.resolution"]
        );

        const child = datamodelView(doc, "resolution");
        equal("an unmatched parent is kept for its match", child.matched, 1);
        equal("but is shown, so the match has a home", countRows(child.scopes[1].nodes), 2);
        equal("with only the matching child", names(child.scopes[1].nodes[0].children), [
          "review.resolution",
        ]);

        // Searching by type answers "every datetime in this chart", which is a
        // real question a typed tree should be able to answer.
        equal("a type is searchable", datamodelView(doc, "boolean").matched, 1);
        equal(
          "and finds the nested one",
          names(datamodelView(doc, "boolean").scopes[1].nodes[0].children),
          ["review.parked"]
        );

        // An empty scope is still listed. A section that vanishes reads as a
        // broken pane; "nothing here matches" is information.
        const none = datamodelView(doc, "nothing_at_all");
        equal("a miss still lists every scope", none.scopes.length, 3);
        check("and says so", none.empty === true);
        check("a hit does not", datamodelView(doc, "review").empty === false);
        check("nor does an empty query", datamodelView(doc, "").empty === false);

        // The label's matched runs are data, never markup - the same rule the
        // palette's highlighter follows for the same reason.
        equal("the label is split into runs", child.scopes[1].nodes[0].children[0].labelSegments, [
          { text: "Resolution", match: true },
        ]);
        // Both names are lit, because the row shows both and lighting one
        // would look like the filter had missed the other.
        equal("and so is the name", child.scopes[1].nodes[0].children[0].nameSegments, [
          { text: "resolution", match: true },
        ]);
      });

      suite("datamodel: the path index, and what a reveal has to unfold", () => {
        const index = indexPaths(datamodelDoc());

        // Containers are indexed too: `card` is a path an author can name, and

        // was known.
        check("a container resolves as well", index.has("review"));
        check("an event path keeps its prefix", index.has("event.review_resolved.decision"));
        check("an undeclared path does not", index.has("review.parkd") === false);

        const entry = index.get("event.review_resolved.decision");
        equal("an entry knows its scope", entry.scope, "event");
        equal("and its scope's label", entry.scopeLabel, "Event payload");
        equal("and its type", entry.type, "string");
        equal("and its closed set", entry.oneOf, ["approve", "decline"]);

        // The reveal contract: every ancestor, outermost first, is what the

        equal("a nested path names its ancestors", ancestorPaths("event.review_resolved.decision"), [

      suite("condition: tokenizing is lossless, and it classifies", () => {
        const source = "fraud.verdict == 'review' AND limits.manual_review_backlog < 50";
        const tokens = tokenizeCondition(source);

        // The property the whole coloured rendering rests on: what is on
        // screen is byte-for-byte the stored condition, never rebuilt.
        equal("concatenating the tokens is the input", tokens.map((one) => one.text).join(""), source);

        const kinds = tokens.filter((one) => one.kind !== "space").map((one) => one.kind);
        equal("each part is classified", kinds, [
          "path",
          "operator",
          "string",
          "keyword",
          "path",
          "operator",
          "number",
        ]);

        // Both spellings, because predicator takes both and a highlighter that
        // refused one would be making a language decision that is not its.
        equal(
          "= and == are both operators",
          tokenizeCondition("a = 1 AND b == 2").filter((one) => one.kind === "operator").length,
          2
        );
        equal(
          "so are the four comparisons",
          tokenizeCondition("a >= 1 AND b <= 2 AND c != 3 AND d > 4")
            .filter((one) => one.kind === "operator")
            .map((one) => one.text),
          [">=", "<=", "!=", ">"]
        );

        equal("parens are their own kind", tokenizeCondition("(a)")[0].kind, "paren");
        equal(
          "a double-quoted string is one token",
          tokenizeCondition('a == "two words"').filter((one) => one.kind === "string")[0].text,
          '"two words"'
        );
        equal(
          "a bare word is a path",
          tokenizeCondition("auth.approved")[0].path,
          "auth.approved"
        );
        // A condition an author is halfway through typing still has to render.
        equal("a half-typed condition still tokenizes", tokenizeCondition("amount_cents >").length, 3);
        equal("and an empty one is empty", tokenizeCondition(""), []);
        equal("as is a missing one", tokenizeCondition(null), []);
      });

      suite("condition: paths are looked up, never evaluated", () => {
        const index = indexPaths(datamodelDoc());
        const source = "review.parked AND event.review_resolved.decision == 'approve'";

        const annotated = annotateCondition(source, index).filter((one) => one.kind === "path");
        equal("every path is resolved", annotated.map((one) => one.known), [true, true]);
        equal("a known path carries its entry", annotated[0].entry.label, "Parked");

        // Unknown means "the datamodel does not declare this", never "this is
        // wrong" - which is why this is advisory and not a finding.
        const typo = conditionPaths("review.parkd == true", index);
        equal("an undeclared path is flagged", typo.map((one) => one.known), [false]);
        equal("and carries no entry", typo[0].entry, null);

        // `true` typed in lower case must not be reported as an unknown path;
        // it is the single most confusing thing this pane could say.
        const literals = annotateCondition("a == true OR b == false", index);
        equal(
          "lower-case literals are literals",
          literals.filter((one) => one.kind === "literal").map((one) => one.text),
          ["true", "false"]
        );
        equal(
          "and the keywords are keywords",
          literals.filter((one) => one.kind === "keyword").map((one) => one.text),
          ["OR"]
        );

        // First-appearance order, de-duplicated: the footer's count is a claim
        // a reader of a screenshot can check against the highlighted source.
        equal(
          "repeats are counted once, in first-appearance order",
          conditionPaths("amount_cents > 0 AND amount_cents < 100 AND review.parked", index).map(
            (one) => one.path
          ),
          ["amount_cents", "review.parked"]
        );

        // With no datamodel document at all the pane still tokenizes; it just
        // has no basis for the affirmative treatment.
        equal(
          "with no index nothing is known",
          conditionPaths("review.parked", new Map()).map((one) => one.known),
          [false]
        );

      /* ================================================ fixtures (sb-9z3) */

      /*
       * A small fixture set of the same SHAPE as `fixtures/runs.json`, written
       * here rather than fetched so these suites stay synchronous and so a
       * change to the shipped file cannot silently rewrite what they assert.
       * The shipped file gets its own suite at the bottom, which is about the
       * file rather than about the module.
       *
       * Everything here is mocked, exactly as D4 requires of the real thing:
       * `result` is a value someone wrote down and nothing evaluates `expr`.
       */
      const FIX = {
        version: 1,
        documents: {
          doc_a: {
            runs: [

                id: "run_one",
                name: "One",
                description: "three steps, one of them parallel",

                  {
                    label: "two lanes",
                    active: ["blk_2", "blk_3"],
                    event: "e.arrived",
                    deltas: [{ path: "b", value: "2" }],
                    check: { label: "both lanes armed", result: "pass" },
                  },
                  {
                    label: "done",
                    active: ["blk_4"],
                    deltas: [{ path: "a", value: "9" }],
                  },
                ],
              },
              {
                id: "run_two",
                name: "Two",
                expected: "pass",

                  { key: "arm_y", label: "Y", expr: "b" },

                paths: ["a", "b"],
                rows: [
                  { name: "both", bindings: { a: "2", b: "true" }, expected: { arm_x: true, arm_y: true } },
                  { name: "neither", bindings: { a: "0", b: "false" }, expected: { arm_x: false, arm_y: false } },
                  { name: "half said", bindings: { a: "5" }, expected: { arm_x: true } },
                ],
              },
            ],
          },
          doc_empty: { runs: [], tables: [] },
        },
      };

      const runOne = FIX.documents.doc_a.runs[0];
      const runTwo = FIX.documents.doc_a.runs[1];

      suite("fixtures / the document section", () => {
        const a = fixturesFor(FIX, "doc_a");
        equal("finds a document's runs", a.runs.length, 2);
        equal("and its tables", a.tables.length, 1);
        check("a section that exists is known", a.known === true);

        const empty = fixturesFor(FIX, "doc_empty");
        check("an empty section is still known", empty.known === true);
        equal("with no runs in it", empty.runs.length, 0);

        // The distinction the pane says two different sentences for: nobody has
        // written fixtures for this document, versus someone wrote the section
        // and left it empty.
        const missing = fixturesFor(FIX, "doc_nope");
        check("a document with no section is not known", missing.known === false);
        equal("and reads as empty rather than throwing", missing.runs, []);
        equal("a null fixture file degrades the same way", fixturesFor(null, "doc_a").runs, []);

        equal("block ids owning a table", tableBlockIds(a), ["blk_9"]);
        equal("tables for a block", tablesForBlock(a, "blk_9").length, 1);
        equal("tables for a block with none", tablesForBlock(a, "blk_1"), []);
        equal("tables for no selection", tablesForBlock(a, null), []);
        equal("a run by id", runById(a, "run_two").name, "Two");
        equal("an unknown run id is null, not a throw", runById(a, "nope"), null);
      });

      suite("fixtures / the replay cursor", () => {
        equal("a fresh cursor is 'not started'", resetCursor(), NOT_STARTED);
        equal("the end cursor is one past the last step", endCursor(runOne), 3);

        equal("forward from not-started lands on step 0", moveCursor(runOne, NOT_STARTED, 1), 0);
        equal("forward again", moveCursor(runOne, 0, 1), 1);

        // Clamped rather than refused, at BOTH ends: the transport disables the
        // buttons for looks, and the model is what makes that safe.
        equal("back from not-started stays put", moveCursor(runOne, NOT_STARTED, -1), NOT_STARTED);
        equal("forward from the end stays put", moveCursor(runOne, 3, 1), 3);
        equal("back from the end returns to the last step", moveCursor(runOne, 3, -1), 2);
        equal("a nonsense cursor reads as not-started", moveCursor(runOne, "x", 1), 0);
        equal("a run with no steps cannot move forward", moveCursor({ steps: [] }, NOT_STARTED, 1), NOT_STARTED);
      });

      suite("fixtures / a run at a cursor", () => {
        const fresh = runView(runOne, NOT_STARTED);
        equal("a fresh run has not started", fresh.started, false);
        // The chip beside it already says "not run"; the progress line's job
        // before the replay starts is to say how long the run is.
        equal("its progress reads the step count", fresh.progress, "3 steps");
        equal("nothing is active", fresh.activeIds, []);
        equal("and its verdict is 'not-run'", fresh.verdict, "not-run");
        equal("no bindings yet", fresh.bindings, []);
        equal("every step is in the future", fresh.steps.map((s) => s.state), [
          "future",
          "future",
          "future",
        ]);

        const mid = runView(runOne, 1);
        equal("the cursor's step is current", mid.steps[1].state, "current");
        equal("the one behind it is past", mid.steps[0].state, "past");
        equal("the one ahead is future", mid.steps[2].state, "future");
        equal("progress counts from one", mid.progress, "step 2 of 3");
        // The whole reason the runner exists: a parallel step lights more than
        // one block, and the highlight is a SET.
        equal("a parallel step activates two blocks", mid.activeIds, ["blk_2", "blk_3"]);
        equal("the current step carries its event", mid.current.event, "e.arrived");
        equal("mid-run with no failure reads 'replaying'", mid.verdict, "running");
        equal("bindings accumulate up to the cursor", mid.bindings, [
          { path: "a", value: "1", step: 0 },
          { path: "b", value: "2", step: 1 },
        ]);

        const done = runView(runOne, 3);
        equal("a finished run has no current step", done.current, null);
        equal("nothing is highlighted once it finishes", done.activeIds, []);
        equal("its progress reads 'finished'", done.progress, "finished");
        equal("with no failed check it passes", done.verdict, "pass");
        equal("and agrees with its declared expectation", done.agrees, true);
        // Last write wins, insertion order kept - `a` was written twice.
        equal("a later write replaces an earlier one in place", done.bindings, [
          { path: "a", value: "9", step: 2 },
          { path: "b", value: "2", step: 1 },
        ]);

        // A check only counts once the cursor has REACHED it. Anything else
        // would let a step list spoil its own ending.
        const before = runView(runTwo, 0);
        equal("an unconsumed failing check does not count", before.verdict, "running");
        equal("and reports no failures yet", before.failures.length, 0);

        const after = runView(runTwo, 1);
        equal("consuming it turns the verdict to 'failing'", after.verdict, "failing");
        equal("which is not yet the final verdict", after.finished, false);
        equal("the failure names its step", after.failures[0].step, 1);

        const finished = runView(runTwo, 2);
        equal("finishing after a failed check fails", finished.verdict, "fail");
        equal("and disagrees with 'expects pass'", finished.agrees, false);
        equal("agreement is unknown before the end", runView(runTwo, 0).agrees, null);

        const summary = runSummary(runOne);
        equal("a summary counts steps", summary.stepCount, 3);
        equal("and counts only the steps carrying a check", summary.checkCount, 1);

        equal("bindingsAt before any step is empty", bindingsAt(runOne.steps, NOT_STARTED), []);

      suite("fixtures / the truth table", () => {
        const table = tableView(FIX.documents.doc_a.tables[0]);

        equal("columns keep their declared order", table.columns.map((c) => c.key), [
          "arm_x",
          "arm_y",
        ]);
        equal("the expression is carried, not evaluated", table.columns[0].expr, "a > 1");
        equal("declared paths are the column order", table.paths, ["a", "b"]);
        equal("every row binds every path", table.rows[0].bindings.length, 2);
        equal("a row that binds nothing for a path shows a dash", table.rows[2].bindings[1].value, "—");

        equal("a true cell", table.rows[0].cells[0].expected, true);
        equal("a false cell", table.rows[1].cells[0].expected, false);
        // Tri-state on purpose: an unfilled cell must read as "nobody said",
        // never as false - the one wrong answer a truth table can give.
        equal("an unstated cell is null, not false", table.rows[2].cells[1].expected, null);

        equal("true counts are per column", table.trueCounts, [2, 1]);

        // Declared beats derived; derived is the fallback and keeps first-seen
        // order rather than sorting, because sorting would reorder the columns
        // every time a row changed.
        const derived = tableView({
          id: "t",
          columns: [{ key: "k" }],

      suite("fixtures / the JSON editor", () => {
        const good = parseFixtures(fixturesText(FIX));
        check("round-trips the fixture file", good.ok === true);
        equal("and keeps its documents", Object.keys(good.value.documents).sort(), [
          "doc_a",
          "doc_empty",
        ]);

        // A refusal is a value, never an exception - the pane has to render the

        check("refuses invalid JSON", broken.ok === false);
        check("with the engine's message", typeof broken.message === "string" && broken.message !== "");

        );

        check("refuses a truncated file", truncated.ok === false);
        equal("placing the end of the input on its last line", truncated.line, 3);
        equal("and one column past its last character", truncated.column, 12);

        // ...and does NOT invent one for a message it cannot place.

        check(
          "without inventing a line for a message that names no place",

        );
