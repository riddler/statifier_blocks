    <!--
      A dependency-free check on the spike's client-side core: document model,
      block-type registry, command algebra, and drop-target enumeration. It is
      a DEV page, not part of the editor: it loads no spike CSS, styles itself
      inline, and never reaches the shell.

      Why a page rather than a test runner: this repository's toolchain is
      Node-free on purpose (ADR-0005 decision 1's asset argument, sui-ADR-0009's
      reasons), so the committed verification artifact has to be something a
      browser can run from the same static server the spike is already served
      by. Open it at http://localhost:8642/dev/selftest.html.

      What it does NOT replace: `mix test`. Nothing here tests lib/ - these are
      assertions about the spike's own mirror of semantics that lib/ owns, and
      when the two disagree the ADR is the contract and this file is the bug.
    -->

  <body>
    <h1>JS core self-test</h1>
    <p class="lede">
      spike/js: document model, palette registry, command algebra, drop targets.
      Results also go to the console with a <code>[selftest]</code> prefix.
    </p>

    <div id="summary" data-state="running">running...</div>
    <div id="results"></div>

    <script type="module">
      import {
        blocks,
        block,
        createDocument,
        findBlock,
        fetchPath,
        fromJson,
        mintBlockId,
        parentOf,
        subtreeIds,
        toJson,
        validate,
      } from "../js/document.js";

      import {
        LABEL_FIELD,
        admits,
        badgeFor,
        coreTypes,
        demoTypes,
        describe,
        joinLabelFor,
        paletteEntryFor,
        paletteGroups,
        placeholderDescriptor,
        resolveBlock,
        spikeRegistry,
        withEditorFields,
      } from "../js/palette.js";

      import { paramRows, proposedCoreTypes } from "../js/proposed-core.js";

      import {
        fixtureDocumentIds,
        fixtureDocumentOptions,
        fixtureDocuments,
      } from "../js/fixture-documents.js";

      import {
        applyCommand,
        canRedo,
        canUndo,
        checkConfig,
        commit,
        createHistory,
        insert,
        move,
        redo,
        remove,
        target,
        undo,
        updateConfig,
      } from "../js/edit.js";

      import { droppableSlots, droppableSlotsFor, slotKey } from "../js/targets.js";

      /*
       * The emit pass, imported for sb-mu2. This page runs in a real browser,
       * so `renderCanvas` needs no shim - the one discipline is to mount into
       * a node this file appends and removes itself, and to `destroy()` the
       * handle so its ResizeObserver does not outlive the suite.
       */
      import { el, renderCanvas } from "../js/render.js";

      import {
        accentTokenFor,
        blockAccentStyle,
        contrastRatio,
        coverage,
        declarationBlocks,
        declaredTokens,
        isAccentToken,
        structuralDeclarations,
        themeGaps,
        usedTokens,
      } from "../js/theme.js";

      import {
        beginDrag,
        blockForType,
        canRedoSession,
        canUndoSession,
        createSession,
        descendantCount,
        deselect,
        dropAt,
        dropStateFor,
        droppableCount,
        endDrag,
        insertTypeAt,
        isCollapsed,
        isDropAllowed,
        moveIndexFor,
        positionOf,
        redoSession,
        removeBlock,
        select,
        selectionSummary,
        toggleCollapsed,
        typesForSlot,
        undoSession,
        updateBlockConfig,
      } from "../js/session.js";

      import {
        fanPath,
        flowPath,
        humanizeDuration,
        interruptPath,
        joinPath,
        layoutDocument,
        readValuePath,
      } from "../js/layout.js";

      import {
        addMapRow,
        addRow,
        anchorLabel,
        collectFindings,
        configFormFor,
        controlFor,
        demoFindings,
        durationFrom,
        durationParts,
        findingsUnder,
        highlight,
        mapEntries,
        moveRow,
        paletteView,
        removeMapRow,
        removeRow,
        renameMapRow,
        resolveAnchor,
        seedRow,
        setMapValue,
        severityCounts,
        writeAtPath,
      } from "../js/panes.js";

      import {
        annotateCondition,
        ancestorPaths,
        conditionFields,
        conditionPaths,
        datamodelView,
        exampleText,
        indexPaths,
        tokenizeCondition,
        typeLabel,
      } from "../js/datamodel.js";

      import {
        NOT_STARTED,
        bindingsAt,
        endCursor,
        fixturesFor,
        fixturesText,
        foreachView,
        invokeView,
        moveCursor,
        parseFixtures,
        resetCursor,
        runById,
        runSummary,
        runView,
        tableBlockIds,
        tableView,
        tablesForBlock,
      } from "../js/fixtures.js";

      /*
       * The host seam itself, for sb-foh. `createEditor` wires window listeners
       * and a ResizeObserver, so its suite mounts a canvas this file appends and
       * removes, and calls `destroy()` on the way out; `paintInvokeMark` is pure
       * over the cards it is handed and needs neither.
       */
      import { INVOKE_MARK_CLASS, createEditor, paintInvokeMark } from "../js/interact.js";

      import {
        ZOOM_MAX,
        ZOOM_MIN,
        ZOOM_STEPS,
        clampZoom,
        fitBoxZoom,
        fitZoom,
        formatZoom,
        rescaleScroll,
        sameZoom,
        scaleOf,
        stepZoom,
        unscaleRect,
      } from "../js/zoom.js";

      /* ------------------------------------------------ the assert harness */

      const groups = [];
      let current = null;

      function suite(name, body) {
        current = { name, checks: [] };
        groups.push(current);
        try {
          body();
        } catch (error) {
          current.checks.push({
            state: "fail",
            label: "suite threw",
            detail: String(error && error.stack ? error.stack : error),
          });
        }
        current = null;
      }

      function check(label, passed, detail) {
        current.checks.push({
          state: passed ? "pass" : "fail",
          label,
          detail: passed ? null : detail ?? null,
        });
      }

      function equal(label, actual, expected) {
        const passed = deepEqual(actual, expected);
        check(
          label,
          passed,
          passed ? null : `expected ${show(expected)}\n     got ${show(actual)}`
        );
      }

      function show(value) {
        return typeof value === "string" ? value : JSON.stringify(value);
      }

      function deepEqual(a, b) {
        if (a === b) return true;
        if (typeof a !== typeof b || a === null || b === null) return false;
        if (typeof a !== "object") return false;

        if (Array.isArray(a) !== Array.isArray(b)) return false;
        if (Array.isArray(a)) {
          return a.length === b.length && a.every((item, i) => deepEqual(item, b[i]));
        }

        const ak = Object.keys(a).sort();
        const bk = Object.keys(b).sort();
        return deepEqual(ak, bk) && ak.every((key) => deepEqual(a[key], b[key]));
      }

      /* ------------------------------------------------- inline fixtures */

      /*
       * Defined here rather than read from spike/fixtures/, so this page runs
       * on its own branch with nothing else present. Card-processing and
       * signup-wizard content only, and the three approved invoke flavors.
       *
       * The shape mirrors ADR-0001's worked example: a sequence root, an
       * authorize step, a resumable group carrying one interrupt rule, a
       * branch with one arm plus otherwise, and a parallel block with two
       * lanes - which between them exercise every schema feature decision 10
       * lists.
       */
      const registry = spikeRegistry();

      function cardDocument() {
        return createDocument(
          block({
            id: "blk_ROOT",
            type: "core.sequence",
            slots: {
              body: [
                block({
                  id: "blk_AUTH",
                  type: "myapp.authorize",
                  typeVersion: 2,
                  config: { assign_to: "authorization", timeout: "PT30S" },
                }),
                block({
                  id: "blk_GRP",
                  type: "core.resumable_group",
                  config: { history: "deep" },
                  slots: {
                    body: [
                      block({
                        id: "blk_BR",
                        type: "core.branch",
                        config: {
                          arms: [
                            { slot: "arm_approved", cond: "budget_remaining > amount" },
                          ],
                        },
                        slots: {
                          arm_approved: [
                            block({
                              id: "blk_PAR",
                              type: "core.parallel",
                              config: { lanes: ["capture", "receipt"] },
                              slots: {
                                lane_capture: [
                                  block({
                                    id: "blk_CAP",
                                    type: "myapp.capture",
                                    config: { amount_key: "amount", retries: 2 },
                                  }),
                                ],
                                lane_receipt: [
                                  block({
                                    id: "blk_WAI",
                                    type: "core.wait",
                                    config: { duration: "PT48H" },
                                  }),
                                  block({
                                    id: "blk_SIG",
                                    type: "myapp.signup",
                                    config: { step: "confirm" },
                                  }),
                                ],
                              },
                            }),
                          ],
                          otherwise: [
                            block({
                              id: "blk_SG2",
                              type: "myapp.signup",
                              config: { step: "email" },
                            }),
                          ],
                        },
                      }),
                    ],
                    interrupts: [
                      block({
                        id: "blk_INT",
                        type: "core.on_event",
                        config: { event: "myapp.cancelled", outcome: "abandon" },
                      }),
                    ],
                  },
                }),
              ],
            },
          }),
          { id: "bdoc_CARD", revision: 17, metadata: { name: "Card authorization" } }
        );
      }

      /* A tiny document carrying a block type this registry does not have. */
      function retiredDocument() {
        return createDocument(
          block({
            id: "blk_R1",
            type: "core.sequence",
            slots: {
              body: [
                block({
                  id: "blk_GONE",
                  type: "myapp.retired",
                  typeVersion: 3,
                  config: { note: "a step whose block type the host removed" },
                  slots: {
                    body: [
                      block({
                        id: "blk_KEPT",
                        type: "myapp.capture",
                        config: { amount_key: "amount" },
                      }),
                    ],
                  },
                }),
              ],
            },
          }),
          { id: "bdoc_RETIRED" }
        );
      }

      const step = (id, stepName = "email") =>
        block({ id, type: "myapp.signup", config: { step: stepName } });

      /*
       * sb-mu2's fixture: one of every shape, with every declared slot EMPTY.
       *
       * `spikeRegistry()` deliberately does not know the proposals, so a
       * document naming `core.invoke` builds its own registry the way a host
       * registering its own types would.
       */
      function proposingRegistry() {
        return { ...registry, types: { ...registry.types, ...proposedCoreTypes } };
      }

      function emptyContainerDocument() {
        return createDocument(
          block({
            id: "blk_ROOT",
            type: "core.sequence",
            slots: {
              body: [
                block({
                  id: "blk_INV",
                  type: "core.invoke",
                  config: { invoke_type: "myapp:authorize" },
                }),
                block({ id: "blk_GRP", type: "core.group" }),
                block({
                  id: "blk_BR",
                  type: "core.branch",
                  config: { arms: [{ slot: "arm_high", cond: "amount > 100" }] },
                }),
                block({ id: "blk_WAI", type: "core.wait", config: { duration: "PT2M" } }),
                block({
                  id: "blk_CAP",
                  type: "myapp.capture",
                  config: { amount_key: "amount" },
                }),
                block({ id: "blk_GONE", type: "myapp.retired", config: {} }),
              ],
            },
          }),
          { id: "bdoc_EMPTY" }
        );
      }

      /* ----------------------------------------------------------- suites */

      suite("document: load and serialize round-trip (ADR-0001 d8)", () => {
        const doc = cardDocument();

        check("the fixture validates", validate(doc) === null, JSON.stringify(validate(doc)));

        const bytes = toJson(doc);
        const decoded = fromJson(bytes);

        check("decoding succeeds", decoded.ok, JSON.stringify(decoded.error));
        equal("decode(encode(d)) == d", decoded.value, doc);
        equal("encode(decode(encode(d))) == encode(d)", toJson(decoded.value), bytes);

        check(
          "canonical keys are sorted and unspaced",
          bytes.startsWith('{"id":"bdoc_CARD","metadata":'),
          bytes.slice(0, 60)
        );
        check(
          "an empty slot list is omitted, not encoded as []",
          !bytes.includes('"slots":{}') && !bytes.includes("[]"),
          bytes.slice(0, 200)
        );
        check(
          "type_version is spelled as stored",
          bytes.includes('"type_version":2'),
          "missing type_version"
        );

        const withFloat = cardDocument();
        withFloat.root.config = { ratio: 1.5 };
        equal("a float in config is rejected by name", validate(withFloat)?.tag, "malformed_block");
        equal("...and named as a float", validate(withFloat)?.problem?.tag, "float");

        const dup = cardDocument();
        dup.root.slots.body.push(step("blk_AUTH"));
        equal("a duplicate id is rejected", validate(dup)?.tag, "duplicate_block_id");

        equal(
          "bytes that are not a block document refuse",
          fromJson('{"hello":1}').error.tag,
          "not_a_block_document"
        );
      });

      /*
       * Decoding is where the spike is most tempted to be lenient, and every
       * lenience is a silent divergence from Decode: a default the package
       * does not have accepts bytes it would refuse, and a dropped key breaks
       * decision 2's `encode(decode(bytes)) == bytes` with no error to say so.
       */
      suite("document: decode refuses what Decode refuses", () => {
        const bytes = toJson(cardDocument());

        const withStray = JSON.parse(bytes);
        withStray.root.slots.body[0].collapsed = true;
        const stray = fromJson(JSON.stringify(withStray));
        check("a block key the encoder never writes is refused", !stray.ok);
        equal("...as a malformed block", stray.error.tag, "malformed_block");
        equal("...naming the key", stray.error.key, "collapsed");
        equal("...and the block it is on", stray.error.id, "blk_AUTH");

        const noRevision = JSON.parse(bytes);
        delete noRevision.revision;
        equal(
          "a document missing revision is refused, not defaulted to 0",
          fromJson(JSON.stringify(noRevision)).error,
          { tag: "malformed_envelope", field: "revision" }
        );

        const noTypeVersion = JSON.parse(bytes);
        delete noTypeVersion.root.type_version;
        const missing = fromJson(JSON.stringify(noTypeVersion));
        equal(
          "a block missing type_version is refused, not defaulted to 1",
          missing.error.tag,
          "malformed_block"
        );
        equal("...naming the field", missing.error.field, "type_version");

        const noConfig = JSON.parse(bytes);
        delete noConfig.metadata;
        check(
          "metadata IS optional and reads back as empty",
          fromJson(JSON.stringify(noConfig)).ok
        );

        for (const [label, version] of [
          ["a string", "1"],
          ["zero", 0],
          ["null", null],
          ["a float", 1.5],
        ]) {
          const bad = JSON.parse(bytes);
          bad.schema_version = version;
          equal(
            `schema_version as ${label} is a malformed envelope, not a future version`,
            fromJson(JSON.stringify(bad)).error,
            { tag: "malformed_envelope", field: "schema_version" }
          );
        }

        const future = JSON.parse(bytes);
        future.schema_version = 2;
        equal(
          "a positive integer that is not 1 IS a future version",
          fromJson(JSON.stringify(future)).error,
          { tag: "unsupported_schema_version", version: 2 }
        );

        // Precedence: the tree walk runs to completion before uniqueness, so a
        // malformed block outranks a duplicate id however pre-order orders them.
        const both = cardDocument();
        both.root.slots.body[0].id = "blk_ROOT";
        both.root.slots.body[1].slots.interrupts[0].typeVersion = 0;
        equal(
          "a malformed block outranks a duplicate id",
          validate(both).tag,
          "malformed_block"
        );
      });

      /*
       * JavaScript hazards with no Elixir counterpart. `Map.get/3` cannot see
       * an inherited key and `Map.put/3` cannot reach a prototype; a plain JS
       * object read and write can do both, and slot names arrive from decoded
       * bytes and from replayed commands.
       */
      suite("document: slot names are data, not property lookups", () => {
        const doc = cardDocument();

        // "toString" resolves off Object.prototype without the read guard, and
        // a function's `.length` of 0 would admit index 0 and then throw.
        const inherited = applyCommand(
          doc,
          insert(target("blk_ROOT", "toString", 0), step("blk_TS"))
        );
        check(
          "a slot named toString creates an own key, as Map.put would",
          inherited.ok,
          JSON.stringify(inherited.error)
        );
        equal(
          "...holding just that block",
          inherited.value.document.root.slots["toString"].map((b) => b.id),
          ["blk_TS"]
        );
        equal(
          "...and index 1 is out of range, so no inherited length was read",
          applyCommand(doc, insert(target("blk_ROOT", "toString", 1), step("blk_TS2"))).error.tag,
          "index_out_of_range"
        );
        check(
          "applyCommand stays total rather than throwing",
          applyCommand(doc, remove("blk_ROOT")).ok === false
        );

        // "__proto__" assigns the prototype instead of defining an own key,
        // unless the write defines rather than assigns.
        const proto = applyCommand(
          doc,
          insert(target("blk_ROOT", "__proto__", 0), step("blk_PT"))
        );
        check("a slot named __proto__ applies", proto.ok, JSON.stringify(proto.error));
        check(
          "...as an own, enumerable key",
          Object.keys(proto.value.document.root.slots).includes("__proto__"),
          JSON.stringify(Object.keys(proto.value.document.root.slots))
        );
        equal(
          "...and survives a decode round-trip",
          fromJson(toJson(proto.value.document)).value.root.slots["__proto__"].map((b) => b.id),
          ["blk_PT"]
        );
      });

      suite("document: traversal", () => {
        const doc = cardDocument();

        equal(
          "blocks/1 is pre-order with UTF-8-sorted slots",
          blocks(doc).map((b) => b.id),
          [
            "blk_ROOT",
            "blk_AUTH",
            "blk_GRP",
            "blk_BR",
            "blk_PAR",
            "blk_CAP",
            "blk_WAI",
            "blk_SIG",
            "blk_SG2",
            "blk_INT",
          ]
        );

        equal("findBlock reaches a deep block", findBlock(doc, "blk_WAI").type, "core.wait");
        check("findBlock on an absentee is null", findBlock(doc, "blk_NOPE") === null);

        equal("the root's path is empty", fetchPath(doc, "blk_ROOT"), []);
        equal("a deep path names every step", fetchPath(doc, "blk_SIG"), [
          { parentId: "blk_ROOT", slot: "body", index: 1 },
          { parentId: "blk_GRP", slot: "body", index: 0 },
          { parentId: "blk_BR", slot: "arm_approved", index: 0 },
          { parentId: "blk_PAR", slot: "lane_receipt", index: 1 },
        ]);
        check("an absent id has no path", fetchPath(doc, "blk_NOPE") === null);

        equal("parentOf walks one step up", parentOf(doc, "blk_SIG").id, "blk_PAR");
        check("the root has no parent", parentOf(doc, "blk_ROOT") === null);

        equal(
          "subtreeIds includes the block itself",
          [...subtreeIds(findBlock(doc, "blk_PAR"))].sort(),
          ["blk_CAP", "blk_PAR", "blk_SIG", "blk_WAI"]
        );
      });

      suite("palette: the core vocabulary, transcribed", () => {
        equal("seven core entries", Object.keys(coreTypes).length, 7);

        equal(
          "core.sequence declares one body slot",
          coreTypes["core.sequence"].slots({}),
          [{ name: "body", arity: "any", label: "Steps" }]
        );

        equal(
          "core.branch's slots follow its arms, then otherwise",
          coreTypes["core.branch"]
            .slots({ arms: [{ slot: "arm_approved", cond: "x > 1" }] })
            .map((s) => [s.name, s.arity]),
          [
            ["arm_approved", "at_least_one"],
            ["otherwise", "any"],
          ]
        );

        equal(
          "a branch arm's condition field reads through value_path",
          coreTypes["core.branch"].configSchema({
            arms: [{ slot: "arm_bad" }, { slot: "arm_approved", cond: "x > 1" }],
          })[1],
          {
            key: "arm_approved",
            type: "expression",
            label: 'When "approved"',
            required: true,
            default: "",
            valuePath: ["arms", 1, "cond"],
          }
        );

        equal(
          "a lane stores its bare name and the slot prefixes it",
          coreTypes["core.parallel"].slots({ lanes: ["capture", "receipt"] }).map((s) => s.name),
          ["lane_capture", "lane_receipt"]
        );

        equal(
          "core.parallel renders as columns (d10)",
          paletteEntryFor(coreTypes["core.parallel"]).layout,
          "columns"
        );
        // sb-dxs. This descriptor is no longer a verbatim transcription:
        // `complete` is PROPOSED and the shipped type declares no such key.
        // Asserted here, in the suite that claims the transcription, so the
        // divergence cannot be read off the mirror as something that ships.
        equal(
          "core.parallel's schema is the shipped field plus one proposed one",
          coreTypes["core.parallel"].configSchema({}).map((field) => field.key),
          ["lanes", "complete"]
        );
        equal(
          "a group's interrupts render as a secondary rail (d10)",
          paletteEntryFor(coreTypes["core.group"]).slotStyle.interrupts,
          "secondary"
        );

        equal(
          "core.wait rejects a duration that is not ISO-8601",
          coreTypes["core.wait"].validateConfig({ duration: "48 hours" }),
          [{ key: "duration", message: "must be an ISO-8601 duration, like PT30S or P1D" }]
        );
        check(
          "...and accepts one that is",
          coreTypes["core.wait"].validateConfig({ duration: "PT48H" }) === null
        );

        equal(
          "core.on_event is an interrupt handler and nothing else",
          coreTypes["core.on_event"].io({}).kinds,
          ["interrupt_handler"]
        );

        // A stored null is a config value ADR-0001 decision 6 admits, so it
        // has to reach the "must be a list" arm rather than be coalesced into
        // a valid empty list - `Map.get/3` defaults on an ABSENT key only.
        equal(
          "a null arms list is refused, not read as empty",
          coreTypes["core.branch"].validateConfig({ arms: null }),
          [{ key: "arms", message: "must be a list of arms" }]
        );
        equal(
          "a null lanes list is refused, not read as empty",
          coreTypes["core.parallel"].validateConfig({ lanes: null }),
          [{ key: "lanes", message: "must be a list of lane names" }]
        );
        check(
          "an absent arms key IS the empty case",
          coreTypes["core.branch"].validateConfig({}) === null
        );

        const groupsView = paletteGroups(registry);
        equal(
          "the palette browser sorts groups by name, then order, then label",
          groupsView.map((g) => g.name),

        // field at the head of every schema, and a positional read of a
        // declared field would be asserting where the injection landed.
        const absent = configFormFor(
          registry,
          block({ id: "blk_PD", type: "core.parallel", config: lanes })
        ).fields.find((field) => field.key === "complete");

        equal("the field is the select", absent.control, "select");
        check("an absent key reads as undefined, not as the default", absent.value === undefined);
        equal("and the default rides the view", absent.default, "all");
        equal(
          "the placeholder borrows the declared choice's own words",
          absent.choices.find((choice) => choice.value === absent.default).label,
          "All - when every lane is done"
        );

        // The other arm: an authored value leaves nothing for a placeholder to
        // say, and the control must show the authored words instead.
        const authored = configFormFor(
          registry,

      /*
       * sb-dxs. `joinLabelFor` is the renderer's whole view of the key, and
       * the discipline is `badgeFor`'s plus one: the callback is HOST code
       * running during layout, so a throw degrades to the constant the
       * marker carried before rather than taking the canvas down.
       *
       * Every refusal returns the FALLBACK rather than null, because a join
       * marker is drawn either way - there is no "no marker" state for a
       * malformed declaration to fall into.
       */
      suite("palette: joinLabelFor is a callback, normalized like a badge", () => {
        const parallel = paletteEntryFor(coreTypes["core.parallel"]);

        equal("the default config reads all", joinLabelFor(parallel, {}), "continue when all");
        equal(
          "an explicit all reads the same",
          joinLabelFor(parallel, { complete: "all" }),
          "continue when all"
        );
        equal(
          "first reads at-first",
          joinLabelFor(parallel, { complete: "first" }),
          "continue at first"
        );
        equal(
          "and config the type would refuse still labels rather than throwing",
          joinLabelFor(parallel, { complete: "nonsense" }),
          "continue when all"
        );

        equal("a type declaring nothing keeps the old constant", joinLabelFor({}), "continue");
        equal("nor does a non-object declare one", joinLabelFor(null), "continue");
        equal(
          "a STRING is not a callback, and is refused rather than used",
          joinLabelFor({ joinLabel: "continue when all" }),
          "continue"
        );
        equal(
          "a host callback that throws does not take the canvas down",
          joinLabelFor({
            joinLabel: () => {
              throw new Error("host bug");
            },
          }),
          "continue"
        );
        equal("a non-string return is refused", joinLabelFor({ joinLabel: () => 3 }), "continue");
        equal("so is an empty one", joinLabelFor({ joinLabel: () => "   " }), "continue");
        equal("surrounding space is trimmed", joinLabelFor({ joinLabel: () => " join " }), "join");
        equal(
          "a newline means something a marker cannot say",
          joinLabelFor({ joinLabel: () => "a\nb" }),
          "continue"
        );
        equal(
          "24 characters is the last one that fits",
          joinLabelFor({ joinLabel: () => "x".repeat(24) }),
          "x".repeat(24)
        );
        equal(
          "25 is refused, not ellipsized",
          joinLabelFor({ joinLabel: () => "x".repeat(25) }),
          "continue"
        );
        equal(
          "the callback is handed the block's config",
          joinLabelFor({ joinLabel: (config) => config.word }, { word: "rejoin" }),
          "rejoin"
        );

        equal(
          "core.parallel is the ONLY core type that declares one",
          Object.entries(coreTypes)
            .filter(([, one]) => typeof paletteEntryFor(one).joinLabel === "function")
            .map(([name]) => name),
          ["core.parallel"]
        );
        equal(
          "...so every other one still reads the constant",
          [
            ...new Set(
              Object.values(coreTypes).map((one) => joinLabelFor(paletteEntryFor(one), {}))
            ),
          ].sort(),
          ["continue", "continue when all"]
        );
      });

       * sb-dxs, the seam that matters: the words reach `render.js` through
       * the VIEW MODEL, the same way the badge and the accent token do. If
       * this suite passes and the renderer still says "continue", the string
       * was hard-coded; if the renderer branched on a type name instead, the

        const find = (id) => {
          const walk = (node) =>
            node.id === id
              ? node
              : node.slots
                  .flatMap((slot) => slot.children)
                  .map(walk)
                  .find(Boolean) ?? null;
          return walk(layoutDocument(doc, registry).root);
        };

        // `blk_PAR` stores no `complete` - it is the shipped-document case.
        equal(
          "a parallel stored before the key existed still lays out",
          find("blk_PAR").arrangement,
          "lanes"
        );
        equal("...and its marker reads the default", find("blk_PAR").joinLabel, "continue when all");
        equal(
          "...and it grows no chip for a key it does not store",
          find("blk_PAR").chips,
          []
        );

        const first = applyCommand(
          doc,
          updateConfig("blk_PAR", { lanes: ["capture", "receipt"], complete: "first" })
        );
        check("switching the mode is an ordinary config edit", first.ok, JSON.stringify(first.error));
        const switched = (() => {

            node.id === "blk_PAR"
              ? node

                  .flatMap((slot) => slot.children)
                  .map(walk)
                  .find(Boolean) ?? null;

        equal("...and the marker follows it", switched.joinLabel, "continue at first");
        equal("...and the mode shows as an ordinary select chip", switched.chips, [
          { key: "complete", label: "Continue", value: "First" },
        ]);

        // already says whether one is drawn, and a sometimes-present field is

        equal("a branch keeps the old constant", find("blk_BR").joinLabel, "continue");
        equal("so does a leaf that never draws a marker", find("blk_WAI").joinLabel, "continue");

        const orphan = createDocument(

        const second = commit(first.value.history, registry, first.value.document,
          updateConfig("blk_WAI", { duration: "PT1H" }));

        check("...and returns it to the undo stack", canUndo(forward.value.history));

      /*
       * sb-mu2, in the DOM this time: the emit pass is where the change is
       * actually cashed in, because a shape that never reaches `renderBody`
       * produces no gap, no "+" and nothing carrying a `data-slot` for a drop

       * above green and turns the placeholder assertions here red.

      suite("render: an empty declared slot draws a labeled drop target (sb-mu2)", () => {
        const mount = el("div");
        document.body.append(mount);

        const handle = renderCanvas(
          mount,
          layoutDocument(emptyContainerDocument(), proposingRegistry()),
          { center: false }
        );

        const nodeFor = (id) => mount.querySelector(`.sb-node[data-block-id="${id}"]`);
        const slotIn = (id, name) =>
          nodeFor(id).querySelector(`[data-slot="${name}"][data-block-id="${id}"]`);

        check("an empty invoke emits a body", nodeFor("blk_INV").querySelector(".sb-node__body") !== null);
        check(
          "...and the body carries its on_error rail",
          nodeFor("blk_INV").querySelector(".sb-rail .sb-rail__slot") !== null
        );
        equal(
          "...which is a boundary, because it declares a rail slot",
          nodeFor("blk_INV").dataset.boundary,
          "true"
        );

        const errorSlot = slotIn("blk_INV", "on_error");
        equal(
          "the empty slot offers exactly one insertion point, at index 0",
          Array.from(errorSlot.querySelectorAll(".sb-gap")).map((gap) => gap.dataset.index),
          ["0"]
        );
        check(
          "...reachable without a pointer (d8)",
          errorSlot.querySelector('.sb-gap__add[data-action="open-picker"]') !== null
        );
        equal(
          "...and its placeholder leans on the rail header for the label",
          errorSlot.querySelector(".sb-slot__empty").textContent,
          "nothing here yet"
        );

        // A lone primary slot draws no header, so the placeholder is the only
        // thing that can say which slot it is - and the label is the type's
        // own words rather than a sentence built around them, because
        // "If it fails" and "After this step" are not plural nouns.
        const groupBody = slotIn("blk_GRP", "body");
        equal(
          "an unheaded slot labels its own placeholder",
          groupBody.querySelector(".sb-slot__empty-label").textContent,
          "Steps"
        );
        equal(
          "...beside the same hint",
          groupBody.querySelector(".sb-slot__empty-hint").textContent,
          "nothing here yet"
        );

        // The empty branch: both arms drawn, each its own drop target.
        equal(
          "an empty fan draws a column per arm",
          Array.from(nodeFor("blk_BR").querySelectorAll(".sb-column")).map(
            (column) => column.dataset.slot
          ),
          ["arm_high", "otherwise"]
        );

          "...each with an insertion point of its own",
          Array.from(nodeFor("blk_BR").querySelectorAll(".sb-column")).every(

        // A leaf is still a leaf: no body, no gap, nothing to drop into.
        check("a chip emits no body", nodeFor("blk_WAI").querySelector(".sb-node__body") === null);
        check("nor does a card", nodeFor("blk_CAP").querySelector(".sb-node__body") === null);

        handle.destroy();
        mount.remove();
      });

        check("nothing to redo either", !canRedoSession(start), "redo enabled on a fresh session");
        equal("and undo refuses rather than throwing", undoSession(start).error.tag, "nothing_to_undo");
        equal("as does redo", redoSession(start).error.tag, "nothing_to_redo");

        const one = insertTypeAt(start, "core.wait", {
          parentId: "blk_ROOT",
          slot: "body",

        check("and redo still empty", !canRedoSession(two), "redo unexpectedly available");
        equal("the revision counted both", two.document.revision, 19);

        check("and offers a redo", canRedoSession(back), "redo unavailable after undo");

        check("and redo is spent", !canRedoSession(forward), "redo still available");

        // The stack property that makes undo trustworthy: winding all the way

        equal("winding the stack out restores the original bytes", toJson(wound.document), toJson(

          parentId: "blk_ROOT",
          slot: "body",
          index: 0,

        equal("its sibling is untouched", next.arms[0].cond, "x");

          { a: { b: 1 } }
        );

        equal("P1M is months, and not a unit the control offers", durationParts("P1M").simple, false);

        equal("but it still reads", durationParts("PT1H30M").human, "1h 30m");

        equal("2 hours composes", durationFrom(2, "H"), "PT2H");
        equal("1 day composes without the T", durationFrom(1, "D"), "P1D");

       * A miniature of `fixtures/datamodel.json` - the same three scopes, the
       * same per-entry keys, an object with fields, a list with an item type, a
       * `one_of`, a note, and an example that is the empty string. Inline for

       * asserting the fixture's contents as well.

       * Its shape is the SPIKE'S PROPOSAL, not a record - no accepted ADR
       * defines a datamodel document - so everything below is a check that the
       * pane reads the proposal the way the pane's comments say it does.
       */
      function datamodelDoc() {
        return {
          version: 1,
          scopes: [
            {
              scope: "global",
              label: "Global",
              description: "Host-owned. The same for every run.",
              entries: [

            },

              scope: "local",
              label: "Chart-local",
              description: "One per run.",
              entries: [
                {
                  name: "amount_cents",
                  path: "amount_cents",
                  type: "integer",
                  label: "Amount (minor units)",
                  example: 42350,
                },
                {
                  name: "risk_reasons",
                  path: "risk_reasons",
                  type: "list",
                  item_type: "string",
                  label: "Risk reasons",
                  example: ["velocity", "new_device"],
                },
                {
                  name: "review",
                  path: "review",
                  type: "object",
                  label: "Manual review",
                  note: "Written by the park step.",
                  fields: [

                      name: "parked",
                      path: "review.parked",
                      type: "boolean",
                      label: "Parked",
                      example: false,
                    },

                      path: "review.resolution",
                      type: "string",
                      label: "Resolution",
                      example: "",
                      one_of: ["", "approve", "decline"],
                    },
                  ],
                },
              ],
            },
            {
              scope: "event",
              label: "Event payload",
              description: "The payload of the event being handled.",
              entries: [
                {
                  name: "review_resolved",
                  path: "event.review_resolved",
                  type: "object",
                  label: "review.resolved",
                  fields: [
                    {
                      name: "decision",
                      path: "event.review_resolved.decision",
                      type: "string",
                      label: "Decision",
                      example: "approve",
                      one_of: ["approve", "decline"],
                    },
                  ],
                },
              ],
            },
          ],
        };
      }

      const names = (nodes) => nodes.map((node) => node.path);

          "global",

        // which of two identically-named paths an author wants.
        equal("a scope carries its own description", view.scopes[1].description, "One per run.");
        // The `event.` prefix is stated once on the scope, not on every row.
        equal("only the event scope is prefixed", view.scopes.map((one) => one.prefix), [
          "",
          "",

        ]);

        // Every entry counts, nested fields included - the number under the
        // search box has to be the number the tree can show.
        equal("the total counts nested fields too", view.total, 9);
        equal("and nothing is filtered out with no query", view.matched, 9);

        equal("top-level entries keep document order", names(local.nodes), [
          "amount_cents",

        equal("a note rides along", review.note, "Written by the park step.");

          [0, 1, 0]
        );

        // The asymmetry: a matched parent keeps ALL its children, an unmatched
        // one keeps only the children that matched. `review` with three of its
        // five fields and no sign that two are missing is the reading everyone
        // calls a bug.
        // Two entries carry those words - the `review` object here and
        // `limits.manual_review_backlog` a scope away - and the count says two.
        // The object then shows three ROWS, because it brings its fields with
        // it; counting those as matches would make one hit read as three,
        // which the author can see is wrong from the highlighting alone.
        const parent = datamodelView(doc, "manual review");
        equal("the count is entries that matched", parent.matched, 2);
        equal("a matched object is shown with all of its children", countRows(parent.scopes[1].nodes), 3);
        equal(
          "including ones that do not match themselves",
          names(parent.scopes[1].nodes[0].children),
          ["review.parked", "review.resolution"]
        );

        const child = datamodelView(doc, "resolution");
        equal("an unmatched parent is kept for its match", child.matched, 1);
        equal("but is shown, so the match has a home", countRows(child.scopes[1].nodes), 2);
        equal("with only the matching child", names(child.scopes[1].nodes[0].children), [
          "review.resolution",
        ]);

        // Searching by type answers "every datetime in this chart", which is a
        // real question a typed tree should be able to answer.
        equal("a type is searchable", datamodelView(doc, "boolean").matched, 1);
        equal(
          "and finds the nested one",
          names(datamodelView(doc, "boolean").scopes[1].nodes[0].children),
          ["review.parked"]
        );

        // An empty scope is still listed. A section that vanishes reads as a
        // broken pane; "nothing here matches" is information.
        const none = datamodelView(doc, "nothing_at_all");
        equal("a miss still lists every scope", none.scopes.length, 3);
        check("and says so", none.empty === true);
        check("a hit does not", datamodelView(doc, "review").empty === false);
        check("nor does an empty query", datamodelView(doc, "").empty === false);

        // The label's matched runs are data, never markup - the same rule the
        // palette's highlighter follows for the same reason.
        equal("the label is split into runs", child.scopes[1].nodes[0].children[0].labelSegments, [
          { text: "Resolution", match: true },
        ]);
        // Both names are lit, because the row shows both and lighting one
        // would look like the filter had missed the other.
        equal("and so is the name", child.scopes[1].nodes[0].children[0].nameSegments, [
          { text: "resolution", match: true },
        ]);
      });

        equal("and its type", entry.type, "string");
        equal("and its closed set", entry.oneOf, ["approve", "decline"]);

        // The reveal contract: every ancestor, outermost first, is what the

      suite("condition: tokenizing is lossless, and it classifies", () => {
        const source = "fraud.verdict == 'review' AND limits.manual_review_backlog < 50";
        const tokens = tokenizeCondition(source);

        // The property the whole coloured rendering rests on: what is on
        // screen is byte-for-byte the stored condition, never rebuilt.
        equal("concatenating the tokens is the input", tokens.map((one) => one.text).join(""), source);

        const kinds = tokens.filter((one) => one.kind !== "space").map((one) => one.kind);
        equal("each part is classified", kinds, [
          "path",
          "operator",
          "string",
          "keyword",
          "path",
          "operator",
          "number",
        ]);

        // Both spellings, because predicator takes both and a highlighter that
        // refused one would be making a language decision that is not its.
        equal(
          "= and == are both operators",
          tokenizeCondition("a = 1 AND b == 2").filter((one) => one.kind === "operator").length,
          2
        );
        equal(
          "so are the four comparisons",
          tokenizeCondition("a >= 1 AND b <= 2 AND c != 3 AND d > 4")
            .filter((one) => one.kind === "operator")
            .map((one) => one.text),
          [">=", "<=", "!=", ">"]
        );

        equal("parens are their own kind", tokenizeCondition("(a)")[0].kind, "paren");
        equal(
          "a double-quoted string is one token",
          tokenizeCondition('a == "two words"').filter((one) => one.kind === "string")[0].text,
          '"two words"'
        );
        equal(
          "a bare word is a path",
          tokenizeCondition("auth.approved")[0].path,
          "auth.approved"
        );
        // A condition an author is halfway through typing still has to render.
        equal("a half-typed condition still tokenizes", tokenizeCondition("amount_cents >").length, 3);
        equal("and an empty one is empty", tokenizeCondition(""), []);
        equal("as is a missing one", tokenizeCondition(null), []);
      });

        equal("every path is resolved", annotated.map((one) => one.known), [true, true]);
        equal("a known path carries its entry", annotated[0].entry.label, "Parked");

        // Unknown means "the datamodel does not declare this", never "this is

        equal("an undeclared path is flagged", typo.map((one) => one.known), [false]);
        equal("and carries no entry", typo[0].entry, null);

        const literals = annotateCondition("a == true OR b == false", index);
        equal(
          "lower-case literals are literals",
          literals.filter((one) => one.kind === "literal").map((one) => one.text),

        equal(

      const FIX = {

        equal("the cursor's step is current", mid.steps[1].state, "current");
        equal("the one behind it is past", mid.steps[0].state, "past");
        equal("the one ahead is future", mid.steps[2].state, "future");
        equal("progress counts from one", mid.progress, "step 2 of 3");
        // The whole reason the runner exists: a parallel step lights more than
        // one block, and the highlight is a SET.
        equal("a parallel step activates two blocks", mid.activeIds, ["blk_2", "blk_3"]);
        equal("the current step carries its event", mid.current.event, "e.arrived");
        equal("mid-run with no failure reads 'replaying'", mid.verdict, "running");
        equal("bindings accumulate up to the cursor", mid.bindings, [

      /* --------------------------------- the shipped fixture file itself */

      /*
       * The suites above are about the module. This one is about
       * `fixtures/runs.json`: every block id it names has to exist in the
       * document it is filed under, or the runner reveals nothing and the
       * truth tables hang off blocks nobody can select. Fetched rather than
       * inlined, because the whole point is to check the file that ships.
       *
       * A failed fetch is reported as a failure rather than skipped: a fixture
       * file that 404s is exactly the bug this suite is for.
       */
      const shipped = await Promise.all(
        [
          ["runs", "../fixtures/runs.json"],
          ["bdoc_cp_demo", "../fixtures/documents/card-processing.json"],
          ["bdoc_signup_demo", "../fixtures/documents/signup-wizard.json"],
          ["datamodel", "../fixtures/datamodel.json"],
        ].map(([key, path]) =>
          fetch(path)
            .then((response) => (response.ok ? response.json() : null))
            .then((value) => [key, value])
            .catch(() => [key, null])
        )
      ).then((pairs) => Object.fromEntries(pairs));

      suite("fixtures / the shipped fixture file", () => {
        check("fixtures/runs.json loads", shipped.runs !== null);
        if (shipped.runs === null) return;

        const idsIn = (raw) => {
          const seen = new Set();
          const walk = (node) => {
            if (!node || typeof node !== "object") return;
            if (typeof node.id === "string" && typeof node.type === "string") seen.add(node.id);
            for (const children of Object.values(node.slots ?? {})) {
              for (const child of children) walk(child);
            }
          };
          walk(raw.root);
          return seen;
        };

        for (const documentId of ["bdoc_cp_demo", "bdoc_signup_demo"]) {
          const raw = shipped[documentId];
          check(`${documentId} loads`, raw !== null);
          if (raw === null) continue;

          const blocks = idsIn(raw);
          const fixtures = fixturesFor(shipped.runs, documentId);

          check(`${documentId} has runs`, fixtures.runs.length > 0, "no runs written");
          check(`${documentId} has tables`, fixtures.tables.length > 0, "no tables written");

          const ids = fixtures.runs.map((run) => run.id);
          equal(`${documentId} run ids are unique`, ids.length, new Set(ids).size);

          const strays = [];
          for (const run of fixtures.runs) {
            for (const step of run.steps ?? []) {
              for (const id of step.active ?? []) {
                if (!blocks.has(id)) strays.push(`${run.id}: ${id}`);
              }
            }
          }
          equal(`${documentId} every active block exists`, strays, []);

          const tableStrays = fixtures.tables
            .filter((table) => !blocks.has(table.blockId))
            .map((table) => `${table.id}: ${table.blockId}`);
          equal(`${documentId} every table's block exists`, tableStrays, []);

          // A row that binds nothing for a declared path renders a dash, which
          // is right for a table someone is still filling in and wrong for one
          // that ships as evidence.
          const holes = [];
          for (const table of fixtures.tables) {
            const view = tableView(table);
            for (const row of view.rows) {
              for (const binding of row.bindings) {
                if (binding.value === "—") holes.push(`${table.id}/${row.name}: ${binding.path}`);
              }
              for (const cell of row.cells) {
                if (cell.expected === null) holes.push(`${table.id}/${row.name}: ${cell.key}`);
              }
            }
          }
          equal(`${documentId} no table row is half filled in`, holes, []);

        }

        // At least one step somewhere must light two blocks at once - the
        // parallel case is the thing the runner exists to prove, and a fixture
        // set that quietly lost it would still look fine. Asserted against
        // card-processing specifically rather than against every document,
        // because signup-wizard has no parallel region and a two-block step in
        // it would be a fixture stating something the document does not do.
        const parallel = fixturesFor(shipped.runs, "bdoc_cp_demo").runs.some((run) =>
          (run.steps ?? []).some((step) => (step.active ?? []).length > 1)
        );
        check("card-processing has a step with two blocks active", parallel);

        // One run somewhere must disagree with its own declared expectation, so
        // the pane's "one of the two is out of date" state is reachable.
        const disagreeing = Object.keys(shipped.runs.documents).flatMap((documentId) =>
          fixturesFor(shipped.runs, documentId)
            .runs.map((run) => runView(run, endCursor(run)))
            .filter((state) => state.agrees === false)
        );
        check("at least one run's steps disagree with its expectation", disagreeing.length > 0);

        /*
         * Every datamodel path a run writes or a table binds has to be one the
         * datamodel document declares. A fixture naming `fraud.verdicts` reads
         * exactly as convincingly as one naming `fraud.verdict` and is wrong,
         * and nothing else in the spike would catch it: the runner does not
         * look these up, it prints them.
         */
        check("fixtures/datamodel.json loads", shipped.datamodel !== null);
        if (shipped.datamodel === null) return;

        const declared = indexPaths(shipped.datamodel);
        const undeclared = [];

        for (const documentId of Object.keys(shipped.runs.documents)) {
          const fixtures = fixturesFor(shipped.runs, documentId);

          for (const run of fixtures.runs) {
            for (const step of run.steps ?? []) {
              for (const delta of step.deltas ?? []) {
                if (!declared.has(delta.path)) undeclared.push(`${run.id}: ${delta.path}`);
              }
            }
          }

          for (const table of fixtures.tables) {
            for (const path of tableView(table).paths) {
              if (!declared.has(path)) undeclared.push(`${table.id}: ${path}`);
            }
          }
        }

        equal("every fixture path is declared in the datamodel", undeclared, []);
      });

        equal("and its payload as ordered lines", onCall.invoke.payload, [
          { name: "error", value: "boom" },
          { name: "retryable", value: "true" },
        ]);

        // The honest-replayer rule, asserted rather than only written down: an
        // error outcome routes nothing. The step after it is active because a
        // human wrote `blk_park` into it, and it accumulates its deltas exactly
        // as any other step does.
        const after = runView(run, 2);
        equal("the step after an error is just the next step", after.activeIds, ["blk_park"]);
        equal("with no call of its own", after.invoke, null);
        equal("and its writes land normally", after.bindings, [
          { path: "a", value: "1", step: 0 },
          { path: "b", value: "2", step: 2 },
        ]);

        equal("a step with no call exposes null", runView(run, 0).invoke, null);
        equal("a finished run marks nothing", runView(run, 3).invoke, null);
        equal("nor does one that has not started", runView(run, NOT_STARTED).invoke, null);
        equal("the summary counts the calls", runSummary(run).invokeCount, 1);

        // Normalization, and the two directions it refuses in. A call naming no
        // block cannot mark anything, so it is dropped rather than rendered as
        // a no-op; an outcome nobody recognizes reads as "done", because
        // painting an unasked-for red failure is the worse of the two errors.
        equal("an invoke naming no block is dropped", invokeView({ outcome: "error" }), null);
        equal("so is one that is not an object", invokeView("blk_call"), null);
        equal("and an absent field", invokeView(undefined), null);
        equal("an unknown outcome reads as done", invokeView({ block: "b", outcome: "?" }).outcome, "done");
        equal("a missing payload is an empty list", invokeView({ block: "b" }).payload, []);
        equal("an array payload is refused, not indexed", invokeView({ block: "b", payload: [1] }).payload, []);

      suite("fixtures / the shipped invoke runs", () => {
        check("fixtures/runs.json loads", shipped.runs !== null);
        if (shipped.runs === null || shipped.bdoc_cp_demo === null) return;

        const byId = new Map();
        const walk = (node) => {
          if (!node || typeof node !== "object") return;
          if (typeof node.id === "string" && typeof node.type === "string") byId.set(node.id, node);
          for (const children of Object.values(node.slots ?? {})) for (const child of children) walk(child);
        };
        walk(shipped.bdoc_cp_demo.root);

        const runs = fixturesFor(shipped.runs, "bdoc_cp_demo").runs;
        const steps = runs.flatMap((run) => (run.steps ?? []).map((step) => ({ run, step })));
        const calls = steps.filter(({ step }) => invokeView(step.invoke) !== null);

        check("card-processing records host calls", calls.length > 0, "no step carries an invoke");

        // A call has to name a block that EXISTS and that is actually a
        // core.invoke. A fixture marking an ordinary step's badge would light
        // a card with no badge on it, which looks like nothing at all.
        const wrong = calls
          .filter(({ step }) => byId.get(step.invoke.block)?.type !== "core.invoke")
          .map(({ run, step }) => `${run.id}: ${step.invoke.block}`);
        equal("every call names a core.invoke block", wrong, []);

        // And the step has to be standing on it. The badge mark and the active
        // highlight are two treatments of one fact, and a fixture that split
        // them would light one card and outline another.
        const adrift = calls
          .filter(({ step }) => !(step.active ?? []).includes(step.invoke.block))
          .map(({ run, step }) => `${run.id}: ${step.invoke.block}`);
        equal("and the step activates it", adrift, []);

        equal(
          "both outcomes are exercised",
          [...new Set(calls.map(({ step }) => step.invoke.outcome))].sort(),
          ["done", "error"]
        );

        /*
         * The authored-walk assertion. On an error outcome the NEXT step's
         * active ids have to be inside that block's own `on_error` subtree -
         * not because anything computed them, but because a human wrote them
         * and this is the check that they wrote the right ones. A fixture
         * whose failure step lands somewhere else is telling a reader the
         * failure edge goes somewhere it does not.
         */
        const subtree = (blockId) => {
          const ids = new Set();
          const collect = (node) => {
            if (!node) return;
            if (typeof node.id === "string") ids.add(node.id);
            for (const children of Object.values(node.slots ?? {})) for (const child of children) collect(child);
          };
          for (const child of byId.get(blockId)?.slots?.on_error ?? []) collect(child);
          return ids;
        };

        const misplaced = [];
        for (const run of runs) {
          const list = run.steps ?? [];
          list.forEach((step, index) => {
            if (invokeView(step.invoke)?.outcome !== "error") return;

            const next = list[index + 1];
            const inside = subtree(step.invoke.block);

            if (!next) {
              misplaced.push(`${run.id}: the error step is last, so nothing shows the failure path`);
              return;
            }

            for (const id of next.active ?? []) {
              if (!inside.has(id)) misplaced.push(`${run.id}: ${id} is not under ${step.invoke.block}'s on_error`);
            }
          });
        }
        equal("an error step is followed by its on_error subtree", misplaced, []);
      });

      /*
       * sb-foh. The pane used to paint `sb-card--invoking` onto the canvas
       * itself, because the host seam had `markActive` and nothing for the call
       * a step is waiting on. The two suites below are the two halves of the
       * seam that replaced it: what the painter does with a set of cards, and
       * what the editor holding the mark buys that painting from outside could
       * not - survival across a canvas rebuild the replay did not ask for.
       *
       * Sabotage (painter): dropping the `classList.remove` branch leaves the
       * first suite's "the previous card is cleared" checks red. Sabotage
       * (state): deleting the `applyInvokeMark()` call from `render` leaves
       * every direct-call check green and turns the rebuild checks red, which
       * is exactly the bug this bead exists to close.
       */
      suite("interact: paintInvokeMark marks one card and clears the rest (sb-foh)", () => {
        const cards = ["blk_A", "blk_B", "blk_C"].map((id) =>
          el("div", { class: "sb-card", "data-block-id": id })
        );

        const marked = () =>
          cards.filter((card) => card.classList.contains(INVOKE_MARK_CLASS))
            .map((card) => card.dataset.blockId);

        paintInvokeMark(cards, { block: "blk_B", outcome: "done" });
        equal("exactly the named card is marked", marked(), ["blk_B"]);
        equal("...carrying the outcome as data", cards[1].dataset.invokeOutcome, "done");

        paintInvokeMark(cards, { block: "blk_C", outcome: "error" });
        equal("moving the mark clears the previous card", marked(), ["blk_C"]);
        check(
          "...including its outcome, which no rule should still match",
          cards[1].dataset.invokeOutcome === undefined
        );
        equal("...and the new card carries its own", cards[2].dataset.invokeOutcome, "error");

        paintInvokeMark(cards, null);
        equal("null clears the mark entirely", marked(), []);
        check("...outcome and all", cards[2].dataset.invokeOutcome === undefined);

        // An id that is not on the canvas is not an error: a run can name a
        // block an author has since deleted, and a run that threw there would
        // take the whole transport down with it.
        paintInvokeMark(cards, { block: "blk_GONE", outcome: "done" });
        equal("an id no card carries marks nothing", marked(), []);

        // No outcome is a legal call - a step can be calling out without an
        // answer yet - and it must not leave a stale one behind.
        paintInvokeMark(cards, { block: "blk_A", outcome: "error" });
        paintInvokeMark(cards, { block: "blk_A", outcome: null });
        equal("the mark holds without an outcome", marked(), ["blk_A"]);
        check(
          "...and a null outcome drops the previous one",
          cards[0].dataset.invokeOutcome === undefined

      suite("interact: the invoke mark survives a canvas rebuild (sb-foh)", () => {
        const mount = el("div", { class: "sb-spike" });
        const canvas = el("div", { class: "sb-canvas" });
        mount.append(canvas);
        document.body.append(mount);

        const editor = createEditor({ canvas, registry });
        editor.open(cardDocument());

        const cardFor = (id) => canvas.querySelector(`.sb-card[data-block-id="${id}"]`);
        const isMarked = (id) => cardFor(id)?.classList.contains(INVOKE_MARK_CLASS) ?? false;

        check("nothing is marked before a step calls out", !isMarked("blk_CAP"));

        editor.markInvoking("blk_CAP", "done");
        check("the seam marks the called block", isMarked("blk_CAP"));
        equal("...with its outcome", cardFor("blk_CAP").dataset.invokeOutcome, "done");

        const before = cardFor("blk_CAP");

        /*
         * The author edits the document mid-replay: they select an unrelated
         * block and delete it. Nothing about the replay moved, so nothing
         * repaints the mark - which is precisely the case the old arrangement
         * lost it in, because the canvas is rebuilt from scratch and the class
         * the pane had painted went with the old elements.
         */
        editor.revealBlock("blk_SG2");
        document.body.dispatchEvent(
          new KeyboardEvent("keydown", { key: "Delete", bubbles: true })
        );

        check("the edit really did rebuild the canvas", cardFor("blk_SG2") === null);
        check("...into new elements", cardFor("blk_CAP") !== before);
        check("...and the mark came back with them", isMarked("blk_CAP"));
        equal(
          "...outcome included",
          cardFor("blk_CAP").dataset.invokeOutcome,
          "done"
        );

        editor.markInvoking("blk_AUTH", "error");
        check("moving the mark clears the old card", !isMarked("blk_CAP"));
        check("...and marks the new one", isMarked("blk_AUTH"));

        editor.markInvoking(null);
        check("a null block clears it", !isMarked("blk_AUTH"));

        editor.markActive(["blk_CAP"]);
        editor.markInvoking("blk_AUTH", "done");

        check("...on a card the invoke mark does not touch", !isMarked("blk_CAP"));
        check("...and the invoke mark is on the other card", isMarked("blk_AUTH"));
        check(
