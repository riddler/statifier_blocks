<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>statifier_blocks spike - JS core self-test</title>

    <!--
      A dependency-free check on the spike's client-side core: document model,
      block-type registry, command algebra, and drop-target enumeration. It is
      a DEV page, not part of the editor: it loads no spike CSS, styles itself
      inline, and never reaches the shell.

      Why a page rather than a test runner: this repository's toolchain is
      Node-free on purpose (ADR-0005 decision 1's asset argument, sui-ADR-0009's
      reasons), so the committed verification artifact has to be something a
      browser can run from the same static server the spike is already served
      by. Open it at http://localhost:8642/dev/selftest.html.

      What it does NOT replace: `mix test`. Nothing here tests lib/ - these are
      assertions about the spike's own mirror of semantics that lib/ owns, and
      when the two disagree the ADR is the contract and this file is the bug.
    -->

  <body>
    <h1>JS core self-test</h1>
    <p class="lede">
      spike/js: document model, palette registry, command algebra, drop targets.
      Results also go to the console with a <code>[selftest]</code> prefix.
    </p>

    <div id="summary" data-state="running">running...</div>
    <div id="results"></div>

    <script type="module">
      import {
        blocks,
        block,
        createDocument,
        findBlock,
        fetchPath,
        fromJson,
        mintBlockId,
        parentOf,
        subtreeIds,
        toJson,
        validate,
      } from "../js/document.js";

      import {
        admits,
        coreTypes,
        describe,
        paletteEntryFor,
        paletteGroups,
        resolveBlock,
        spikeRegistry,
      } from "../js/palette.js";

      import {
        applyCommand,
        canRedo,
        canUndo,
        checkConfig,
        commit,
        createHistory,
        insert,
        move,
        redo,
        remove,
        target,
        undo,
        updateConfig,
      } from "../js/edit.js";

      import { droppableSlots, droppableSlotsFor, slotKey } from "../js/targets.js";

      import {
        beginDrag,
        blockForType,
        canRedoSession,
        canUndoSession,
        createSession,
        descendantCount,
        deselect,
        dropAt,
        dropStateFor,
        droppableCount,
        endDrag,
        insertTypeAt,
        isCollapsed,
        isDropAllowed,
        moveIndexFor,
        positionOf,
        redoSession,
        removeBlock,
        select,
        selectionSummary,
        toggleCollapsed,
        typesForSlot,
        undoSession,
      } from "../js/session.js";

      import {
        fanPath,
        flowPath,
        humanizeDuration,
        interruptPath,
        joinPath,
        layoutDocument,
        readValuePath,
      } from "../js/layout.js";

      /* ------------------------------------------------ the assert harness */

      const groups = [];
      let current = null;

      function suite(name, body) {
        current = { name, checks: [] };
        groups.push(current);
        try {
          body();
        } catch (error) {
          current.checks.push({
            state: "fail",
            label: "suite threw",
            detail: String(error && error.stack ? error.stack : error),
          });
        }
        current = null;
      }

      function check(label, passed, detail) {
        current.checks.push({
          state: passed ? "pass" : "fail",
          label,
          detail: passed ? null : detail ?? null,
        });
      }

      function equal(label, actual, expected) {
        const passed = deepEqual(actual, expected);
        check(
          label,
          passed,
          passed ? null : `expected ${show(expected)}\n     got ${show(actual)}`
        );
      }

      function show(value) {
        return typeof value === "string" ? value : JSON.stringify(value);
      }

      function deepEqual(a, b) {
        if (a === b) return true;
        if (typeof a !== typeof b || a === null || b === null) return false;
        if (typeof a !== "object") return false;

        if (Array.isArray(a) !== Array.isArray(b)) return false;
        if (Array.isArray(a)) {
          return a.length === b.length && a.every((item, i) => deepEqual(item, b[i]));
        }

        const ak = Object.keys(a).sort();
        const bk = Object.keys(b).sort();
        return deepEqual(ak, bk) && ak.every((key) => deepEqual(a[key], b[key]));
      }

      /* ------------------------------------------------- inline fixtures */

      /*
       * Defined here rather than read from spike/fixtures/, so this page runs
       * on its own branch with nothing else present. Card-processing and
       * signup-wizard content only, and the three approved invoke flavors.
       *
       * The shape mirrors ADR-0001's worked example: a sequence root, an
       * authorize step, a resumable group carrying one interrupt rule, a
       * branch with one arm plus otherwise, and a parallel block with two
       * lanes - which between them exercise every schema feature decision 10
       * lists.
       */
      const registry = spikeRegistry();

      function cardDocument() {
        return createDocument(
          block({
            id: "blk_ROOT",
            type: "core.sequence",
            slots: {
              body: [
                block({
                  id: "blk_AUTH",
                  type: "myapp.authorize",
                  typeVersion: 2,
                  config: { assign_to: "authorization", timeout: "PT30S" },
                }),
                block({
                  id: "blk_GRP",
                  type: "core.resumable_group",
                  config: { history: "deep" },
                  slots: {
                    body: [
                      block({
                        id: "blk_BR",
                        type: "core.branch",
                        config: {
                          arms: [
                            { slot: "arm_approved", cond: "budget_remaining > amount" },
                          ],
                        },
                        slots: {
                          arm_approved: [
                            block({
                              id: "blk_PAR",
                              type: "core.parallel",
                              config: { lanes: ["capture", "receipt"] },
                              slots: {
                                lane_capture: [
                                  block({
                                    id: "blk_CAP",
                                    type: "myapp.capture",
                                    config: { amount_key: "amount", retries: 2 },
                                  }),
                                ],
                                lane_receipt: [
                                  block({
                                    id: "blk_WAI",
                                    type: "core.wait",
                                    config: { duration: "PT48H" },
                                  }),
                                  block({
                                    id: "blk_SIG",
                                    type: "myapp.signup",
                                    config: { step: "confirm" },
                                  }),
                                ],
                              },
                            }),
                          ],
                          otherwise: [
                            block({
                              id: "blk_SG2",
                              type: "myapp.signup",
                              config: { step: "email" },
                            }),
                          ],
                        },
                      }),
                    ],
                    interrupts: [
                      block({
                        id: "blk_INT",
                        type: "core.on_event",
                        config: { event: "myapp.cancelled", outcome: "abandon" },
                      }),
                    ],
                  },
                }),
              ],
            },
          }),
          { id: "bdoc_CARD", revision: 17, metadata: { name: "Card authorization" } }
        );
      }

      /* A tiny document carrying a block type this registry does not have. */
      function retiredDocument() {
        return createDocument(
          block({
            id: "blk_R1",
            type: "core.sequence",
            slots: {
              body: [
                block({
                  id: "blk_GONE",
                  type: "myapp.retired",
                  typeVersion: 3,
                  config: { note: "a step whose block type the host removed" },
                  slots: {
                    body: [
                      block({
                        id: "blk_KEPT",
                        type: "myapp.capture",
                        config: { amount_key: "amount" },
                      }),
                    ],
                  },
                }),
              ],
            },
          }),
          { id: "bdoc_RETIRED" }
        );
      }

      const step = (id, stepName = "email") =>
        block({ id, type: "myapp.signup", config: { step: stepName } });

      /* ----------------------------------------------------------- suites */

      suite("document: load and serialize round-trip (ADR-0001 d8)", () => {
        const doc = cardDocument();

        check("the fixture validates", validate(doc) === null, JSON.stringify(validate(doc)));

        const bytes = toJson(doc);
        const decoded = fromJson(bytes);

        check("decoding succeeds", decoded.ok, JSON.stringify(decoded.error));
        equal("decode(encode(d)) == d", decoded.value, doc);
        equal("encode(decode(encode(d))) == encode(d)", toJson(decoded.value), bytes);

        check(
          "canonical keys are sorted and unspaced",
          bytes.startsWith('{"id":"bdoc_CARD","metadata":'),
          bytes.slice(0, 60)
        );
        check(
          "an empty slot list is omitted, not encoded as []",
          !bytes.includes('"slots":{}') && !bytes.includes("[]"),
          bytes.slice(0, 200)
        );
        check(
          "type_version is spelled as stored",
          bytes.includes('"type_version":2'),
          "missing type_version"
        );

        const withFloat = cardDocument();
        withFloat.root.config = { ratio: 1.5 };
        equal("a float in config is rejected by name", validate(withFloat)?.tag, "malformed_block");
        equal("...and named as a float", validate(withFloat)?.problem?.tag, "float");

        const dup = cardDocument();
        dup.root.slots.body.push(step("blk_AUTH"));
        equal("a duplicate id is rejected", validate(dup)?.tag, "duplicate_block_id");

        equal(
          "bytes that are not a block document refuse",
          fromJson('{"hello":1}').error.tag,
          "not_a_block_document"
        );
      });

      /*
       * Decoding is where the spike is most tempted to be lenient, and every
       * lenience is a silent divergence from Decode: a default the package
       * does not have accepts bytes it would refuse, and a dropped key breaks
       * decision 2's `encode(decode(bytes)) == bytes` with no error to say so.
       */
      suite("document: decode refuses what Decode refuses", () => {
        const bytes = toJson(cardDocument());

        const withStray = JSON.parse(bytes);
        withStray.root.slots.body[0].collapsed = true;
        const stray = fromJson(JSON.stringify(withStray));
        check("a block key the encoder never writes is refused", !stray.ok);
        equal("...as a malformed block", stray.error.tag, "malformed_block");
        equal("...naming the key", stray.error.key, "collapsed");
        equal("...and the block it is on", stray.error.id, "blk_AUTH");

        const noRevision = JSON.parse(bytes);
        delete noRevision.revision;
        equal(
          "a document missing revision is refused, not defaulted to 0",
          fromJson(JSON.stringify(noRevision)).error,
          { tag: "malformed_envelope", field: "revision" }
        );

        const noTypeVersion = JSON.parse(bytes);
        delete noTypeVersion.root.type_version;
        const missing = fromJson(JSON.stringify(noTypeVersion));
        equal(
          "a block missing type_version is refused, not defaulted to 1",
          missing.error.tag,
          "malformed_block"
        );
        equal("...naming the field", missing.error.field, "type_version");

        const noConfig = JSON.parse(bytes);
        delete noConfig.metadata;
        check(
          "metadata IS optional and reads back as empty",
          fromJson(JSON.stringify(noConfig)).ok
        );

        for (const [label, version] of [
          ["a string", "1"],
          ["zero", 0],
          ["null", null],
          ["a float", 1.5],
        ]) {
          const bad = JSON.parse(bytes);
          bad.schema_version = version;
          equal(
            `schema_version as ${label} is a malformed envelope, not a future version`,
            fromJson(JSON.stringify(bad)).error,
            { tag: "malformed_envelope", field: "schema_version" }
          );
        }

        const future = JSON.parse(bytes);
        future.schema_version = 2;
        equal(
          "a positive integer that is not 1 IS a future version",
          fromJson(JSON.stringify(future)).error,
          { tag: "unsupported_schema_version", version: 2 }
        );

        // Precedence: the tree walk runs to completion before uniqueness, so a
        // malformed block outranks a duplicate id however pre-order orders them.
        const both = cardDocument();
        both.root.slots.body[0].id = "blk_ROOT";
        both.root.slots.body[1].slots.interrupts[0].typeVersion = 0;
        equal(
          "a malformed block outranks a duplicate id",
          validate(both).tag,
          "malformed_block"
        );
      });

      /*
       * JavaScript hazards with no Elixir counterpart. `Map.get/3` cannot see
       * an inherited key and `Map.put/3` cannot reach a prototype; a plain JS
       * object read and write can do both, and slot names arrive from decoded
       * bytes and from replayed commands.
       */
      suite("document: slot names are data, not property lookups", () => {
        const doc = cardDocument();

        // "toString" resolves off Object.prototype without the read guard, and
        // a function's `.length` of 0 would admit index 0 and then throw.
        const inherited = applyCommand(
          doc,
          insert(target("blk_ROOT", "toString", 0), step("blk_TS"))
        );
        check(
          "a slot named toString creates an own key, as Map.put would",
          inherited.ok,
          JSON.stringify(inherited.error)
        );
        equal(
          "...holding just that block",
          inherited.value.document.root.slots["toString"].map((b) => b.id),
          ["blk_TS"]
        );
        equal(
          "...and index 1 is out of range, so no inherited length was read",
          applyCommand(doc, insert(target("blk_ROOT", "toString", 1), step("blk_TS2"))).error.tag,
          "index_out_of_range"
        );
        check(
          "applyCommand stays total rather than throwing",
          applyCommand(doc, remove("blk_ROOT")).ok === false
        );

        // "__proto__" assigns the prototype instead of defining an own key,
        // unless the write defines rather than assigns.
        const proto = applyCommand(
          doc,
          insert(target("blk_ROOT", "__proto__", 0), step("blk_PT"))
        );
        check("a slot named __proto__ applies", proto.ok, JSON.stringify(proto.error));
        check(
          "...as an own, enumerable key",
          Object.keys(proto.value.document.root.slots).includes("__proto__"),
          JSON.stringify(Object.keys(proto.value.document.root.slots))
        );
        equal(
          "...and survives a decode round-trip",
          fromJson(toJson(proto.value.document)).value.root.slots["__proto__"].map((b) => b.id),
          ["blk_PT"]
        );
      });

      suite("document: traversal", () => {
        const doc = cardDocument();

        equal(
          "blocks/1 is pre-order with UTF-8-sorted slots",
          blocks(doc).map((b) => b.id),
          [
            "blk_ROOT",
            "blk_AUTH",
            "blk_GRP",
            "blk_BR",
            "blk_PAR",
            "blk_CAP",
            "blk_WAI",
            "blk_SIG",
            "blk_SG2",
            "blk_INT",
          ]
        );

        equal("findBlock reaches a deep block", findBlock(doc, "blk_WAI").type, "core.wait");
        check("findBlock on an absentee is null", findBlock(doc, "blk_NOPE") === null);

        equal("the root's path is empty", fetchPath(doc, "blk_ROOT"), []);
        equal("a deep path names every step", fetchPath(doc, "blk_SIG"), [
          { parentId: "blk_ROOT", slot: "body", index: 1 },
          { parentId: "blk_GRP", slot: "body", index: 0 },
          { parentId: "blk_BR", slot: "arm_approved", index: 0 },
          { parentId: "blk_PAR", slot: "lane_receipt", index: 1 },
        ]);
        check("an absent id has no path", fetchPath(doc, "blk_NOPE") === null);

        equal("parentOf walks one step up", parentOf(doc, "blk_SIG").id, "blk_PAR");
        check("the root has no parent", parentOf(doc, "blk_ROOT") === null);

        equal(
          "subtreeIds includes the block itself",
          [...subtreeIds(findBlock(doc, "blk_PAR"))].sort(),
          ["blk_CAP", "blk_PAR", "blk_SIG", "blk_WAI"]
        );
      });

      suite("palette: the core vocabulary, transcribed", () => {
        equal("seven core entries", Object.keys(coreTypes).length, 7);

        equal(
          "core.sequence declares one body slot",
          coreTypes["core.sequence"].slots({}),
          [{ name: "body", arity: "any", label: "Steps" }]
        );

        equal(
          "core.branch's slots follow its arms, then otherwise",
          coreTypes["core.branch"]
            .slots({ arms: [{ slot: "arm_approved", cond: "x > 1" }] })
            .map((s) => [s.name, s.arity]),
          [
            ["arm_approved", "at_least_one"],
            ["otherwise", "any"],
          ]
        );

        equal(
          "a branch arm's condition field reads through value_path",
          coreTypes["core.branch"].configSchema({
            arms: [{ slot: "arm_bad" }, { slot: "arm_approved", cond: "x > 1" }],
          })[1],
          {
            key: "arm_approved",
            type: "expression",
            label: 'When "approved"',
            required: true,
            default: "",
            valuePath: ["arms", 1, "cond"],
          }
        );

        equal(
          "a lane stores its bare name and the slot prefixes it",
          coreTypes["core.parallel"].slots({ lanes: ["capture", "receipt"] }).map((s) => s.name),
          ["lane_capture", "lane_receipt"]
        );

        equal(
          "core.parallel renders as columns (d10)",
          paletteEntryFor(coreTypes["core.parallel"]).layout,
          "columns"
        );
        equal(
          "a group's interrupts render as a secondary rail (d10)",
          paletteEntryFor(coreTypes["core.group"]).slotStyle.interrupts,
          "secondary"
        );

        equal(
          "core.wait rejects a duration that is not ISO-8601",
          coreTypes["core.wait"].validateConfig({ duration: "48 hours" }),
          [{ key: "duration", message: "must be an ISO-8601 duration, like PT30S or P1D" }]
        );
        check(
          "...and accepts one that is",
          coreTypes["core.wait"].validateConfig({ duration: "PT48H" }) === null
        );

        equal(
          "core.on_event is an interrupt handler and nothing else",
          coreTypes["core.on_event"].io({}).kinds,
          ["interrupt_handler"]
        );

        // A stored null is a config value ADR-0001 decision 6 admits, so it
        // has to reach the "must be a list" arm rather than be coalesced into
        // a valid empty list - `Map.get/3` defaults on an ABSENT key only.
        equal(
          "a null arms list is refused, not read as empty",
          coreTypes["core.branch"].validateConfig({ arms: null }),
          [{ key: "arms", message: "must be a list of arms" }]
        );
        equal(
          "a null lanes list is refused, not read as empty",
          coreTypes["core.parallel"].validateConfig({ lanes: null }),
          [{ key: "lanes", message: "must be a list of lane names" }]
        );
        check(
          "an absent arms key IS the empty case",
          coreTypes["core.branch"].validateConfig({}) === null
        );

        const groupsView = paletteGroups(registry);
        equal(
          "the palette browser sorts groups by name, then order, then label",
          groupsView.map((g) => g.name),
          ["Card processing", "Signup wizard", "Structure"]
        );
        equal(
          "...and orders a group's entries by declared order",
          groupsView.find((g) => g.name === "Structure").entries.map((e) => e.entry.label),
          ["Sequence", "Group", "Resumable group", "Branch", "Parallel", "Wait", "On event"]
        );
      });

      suite("palette: resolution, migration, and defaults", () => {
        const stored = block({
          id: "blk_OLD",
          type: "myapp.authorize",
          typeVersion: 1,
          config: { field: "authorization" },
        });

        const resolved = resolveBlock(registry, stored);
        check("a stale type_version resolves", resolved.ok, JSON.stringify(resolved.error));
        equal("...migrating the config in memory", resolved.value.block.config, {
          assign_to: "authorization",
        });
        equal(
          "...and leaving type_version as stored",
          resolved.value.block.typeVersion,
          1
        );
        equal("the document's own block is untouched", stored.config, { field: "authorization" });

        const tooNew = block({ id: "blk_NEW", type: "myapp.capture", typeVersion: 9 });
        equal(
          "a block authored by a newer type is a hard error",
          resolveBlock(registry, tooNew).error.tag,
          "block_type_too_new"
        );

        const current = block({ id: "blk_NM", type: "myapp.capture", typeVersion: 1 });
        check("a current-version block resolves untouched", resolveBlock(registry, current).ok);

        const noMigration = block({ id: "blk_NM2", type: "myapp.capture", typeVersion: 0 });
        equal(
          "a stale type with no migrate_config refuses",
          resolveBlock(registry, noMigration).error.tag,
          "migration_failed"
        );

        const bare = { name: "myapp.bare", currentVersion: 1, slots: () => [] };
        equal("a type declaring no palette_entry still renders", paletteEntryFor(bare), {
          label: "myapp.bare",
          group: "Other",
          description: "",
          icon: null,
          keywords: [],
          order: 0,
          layout: "stack",
          slotStyle: {},
        });
      });

      suite("palette: unresolvable types never crash (d12)", () => {
        const doc = retiredDocument();

        check("a document naming an unknown type decodes", fromJson(toJson(doc)).ok);

        const view = describe(registry, findBlock(doc, "blk_GONE"));
        check("it resolves to a placeholder", view.unresolved === true);
        equal("...naming the missing type", view.reason.tag, "unknown_block_type");
        equal("...labelled by its type name", paletteEntryFor(view.descriptor).label, "myapp.retired");
        equal("...declaring no slots, so it is no drop target", view.descriptor.slots({}), []);
        check(
          "...and validating nothing, so no form is offered",
          view.descriptor.validateConfig({ anything: true }) === null
        );

        equal(
          "its children are still in the document",
          findBlock(doc, "blk_KEPT").type,
          "myapp.capture"
        );

        // The preservation property: edit an unrelated part of the tree, and
        // the unresolvable block's bytes are unchanged.
        const before = JSON.stringify(findBlock(doc, "blk_GONE"));
        const edited = applyCommand(doc, insert(target("blk_R1", "body", 0), step("blk_NEW1")));
        check("an unrelated edit succeeds", edited.ok, JSON.stringify(edited.error));
        equal(
          "...and the unresolvable block is byte-identical",
          JSON.stringify(findBlock(edited.value.document, "blk_GONE")),
          before
        );

        const targets = droppableSlots(doc, registry, "blk_GONE");
        equal(
          "the unresolvable block is itself movable (d12)",
          targets,
          [{ parentId: "blk_R1", slot: "body" }]
        );
        check(
          "...but offers none of its own slots",
          !targets.some((t) => t.parentId === "blk_GONE"),
          JSON.stringify(targets)
        );
      });

      suite("edit: insert and its inverse", () => {
        const doc = cardDocument();
        const node = step("blk_NEW1", "profile");

        const applied = applyCommand(doc, insert(target("blk_ROOT", "body", 1), node));
        check("an insert applies", applied.ok, JSON.stringify(applied.error));
        equal(
          "...at the named index",
          applied.value.document.root.slots.body.map((b) => b.id),
          ["blk_AUTH", "blk_NEW1", "blk_GRP"]
        );
        equal("...with a remove as its inverse", applied.value.inverse, remove("blk_NEW1"));

        const undone = applyCommand(applied.value.document, applied.value.inverse);
        equal("apply then inverse restores the document", undone.value.document, doc);

        const intoAbsent = applyCommand(
          doc,
          insert(target("blk_AUTH", "review", 0), step("blk_NEW2"))
        );

          insert(target("blk_ROOT", "body", 0), step("blk_N1")));
        check("a commit applies", first.ok, JSON.stringify(first.error));
        check("...and fills the undo stack", canUndo(first.value.history));
        check("...leaving redo empty", !canRedo(first.value.history));

        const second = commit(first.value.history, registry, first.value.document,
          updateConfig("blk_WAI", { duration: "PT1H" }));

        const back = undo(second.value.history, registry, second.value.document);
        check("undo applies", back.ok, JSON.stringify(back.error));
        equal(
          "...stepping the document back one command",
          back.value.document,
          first.value.document

        check("...and filling the redo stack", canRedo(back.value.history));

        const forward = redo(back.value.history, registry, back.value.document);
        equal("redo replays the original command", forward.value.document, second.value.document);
        check("...and returns it to the undo stack", canUndo(forward.value.history));

        const back2 = undo(forward.value.history, registry, forward.value.document);
        const back3 = undo(back2.value.history, registry, back2.value.document);
        equal("undoing to the bottom restores the original", back3.value.document, doc);
        check("...leaving nothing to undo", !canUndo(back3.value.history));

        const doc = cardDocument();

            node.id === id
              ? node
              : node.slots
                  .flatMap((slot) => slot.children)
                  .map(walk)
                  .find(Boolean) ?? null;
          return walk(tree.root);
        };

        equal("every block is laid out", tree.blockCount, blocks(doc).length);
        check("depth is reported", tree.maxDepth >= 4, `got ${tree.maxDepth}`);

        // The three derivations layout.js's header comment commits to. Each
        // is asserted against a DIFFERENT core type reaching the same rule by
        // a different route, which is the property that matters: no branch on
        // a type name anywhere.
        equal("one primary slot stacks", find("blk_ROOT").arrangement, "stack");
        equal(
          "a secondary slot does not make a block fan",
          find("blk_GRP").arrangement,
          "stack"
        );
        equal(
          "more than one primary slot fans (branch: arm + otherwise)",

          "fan"

        equal(

          find("blk_GRP").slots.map((slot) => [slot.name, slot.style]),

        );

        // through its valuePath into the stored arms list.
        const branch = find("blk_BR");
        equal(
          "an arm's guard comes off the config schema, via valuePath",

        );
        equal(
          "otherwise has no guard",

        );

        // A leaf whose whole schema is one duration is a chip; a leaf with
        // anything else to say is a card.
        equal("a lone duration is a chip", find("blk_WAI").shape, "chip");
        equal("a duration summary is humanized", find("blk_WAI").summary, [

        equal("a select renders as a chip", find("blk_GRP").chips, [

        // Vertically aligned is the common case inside a sequence, and it
        // must not acquire corners it does not need.
        equal(

          "M 10 20 L 10 60"
        );
        equal(
          "an offset flow edge turns on the halfway line",
          flowPath({ x: 10, y: 20 }, { x: 50, y: 60 }),
          "M 10 20 V 30 Q 10 40 20 40 H 40 Q 50 40 50 50 V 60"
        );

        // A fan's elbow sits close to the HUB so every arm turns on one
        // line and the result reads as a distribution bar.
        equal(
          "a fan edge elbows just below its hub",

        );
        equal(

        check(

        equal("nor is the block itself", dropStateFor(group, "blk_GRP", "body"), "no");
        equal("but the slot it sits in still is", dropStateFor(group, "blk_ROOT", "body"), "ok");

        // An interrupt handler is the mirror case, and it is what makes the
        // rail light up while the body does not.
        const handler = beginDrag(start, { kind: "move", id: "blk_INT" });

        equal("an interrupt rule may go on a rail", dropStateFor(handler, "blk_GRP", "interrupts"), "ok");
        equal("and nowhere a step goes", dropStateFor(handler, "blk_ROOT", "body"), "no");
      });

      suite("session: a drop is a command, and it refuses off-target", () => {
        const start = beginDrag(createSession(cardDocument(), registry), {
          kind: "move",
          id: "blk_WAI",
        });

        const refused = dropAt(start, { parentId: "blk_GRP", slot: "interrupts", index: 0 });

        check("a drop outside the set is refused", !refused.ok, JSON.stringify(refused));
        equal("and says why", refused.error.tag, "not_droppable");

        const dropped = dropAt(start, { parentId: "blk_ROOT", slot: "body", index: 0 });

        check("a drop inside it applies", dropped.ok, JSON.stringify(dropped.error));
        equal("the block moved", positionOf(dropped.value.document, "blk_WAI"), {
          parentId: "blk_ROOT",
          slot: "body",
          index: 0,
        });
        equal("the drag session is over", dropped.value.drag, null);
        equal("the moved block is selected", dropped.value.selectedId, "blk_WAI");
        equal("the revision advanced", dropped.value.document.revision, 18);
        check("and it is undoable", canUndoSession(dropped.value), "empty undo stack");

        equal(
          "dropping with no drag running refuses",
          dropAt(createSession(cardDocument(), registry), {
            parentId: "blk_ROOT",
            slot: "body",
            index: 0,
          }).error.tag,
          "no_drag"
        );
      });

      suite("session: canvas gap indices become command indices (d4)", () => {
        // The four-child slot the arithmetic is about. Reordering inside one
        // slot is the case where the canvas and the command disagree, and the
        // disagreement is exactly one.
        const doc = createDocument(
          block({
            id: "blk_S",
            type: "core.sequence",
            slots: { body: [step("blk_A"), step("blk_B"), step("blk_C"), step("blk_D")] },
          })
        );

        equal(
          "moving later in the same slot loses one index",
          moveIndexFor(doc, "blk_A", { parentId: "blk_S", slot: "body", index: 3 }),
          2
        );
        equal(
          "moving earlier in the same slot keeps its index",
          moveIndexFor(doc, "blk_D", { parentId: "blk_S", slot: "body", index: 1 }),
          1
        );
        equal(
          "a move into a different slot keeps its index",
          moveIndexFor(doc, "blk_A", { parentId: "blk_S", slot: "other", index: 3 }),
          3
        );

        // The property the correction exists for: the canvas gap an author
        // released on is the position the block ends up in.
        const dragged = beginDrag(createSession(doc, registry), { kind: "move", id: "blk_A" });
        const moved = dropAt(dragged, { parentId: "blk_S", slot: "body", index: 3 });

        check("the drop applies", moved.ok, JSON.stringify(moved.error));
        equal(
          "and the block sits where the gap was",
          moved.value.document.root.slots.body.map((child) => child.id),
          ["blk_B", "blk_C", "blk_A", "blk_D"]
        );
      });

      suite("session: the \"+\" path produces the same command a drop does (d8)", () => {
        const start = createSession(cardDocument(), registry);
        const offered = typesForSlot(start, "blk_GRP", "interrupts");

        equal(
          "an interrupts rail offers only interrupt handlers",
          offered.map((entry) => entry.type),
          ["core.on_event"]
        );

        check(
          "a body offers steps and containers",
          typesForSlot(start, "blk_ROOT", "body").some((entry) => entry.type === "core.sequence") &&
            !typesForSlot(start, "blk_ROOT", "body").some((entry) => entry.type === "core.on_event"),
          typesForSlot(start, "blk_ROOT", "body").map((entry) => entry.type).join(",")
        );

        // Decision 8's actual claim: the picker's filter IS decision 5's
        // predicate. Asserted as an identity between the two lists rather
        // than as two lists that happen to look similar.
        for (const entry of typesForSlot(start, "blk_ROOT", "body")) {
          const candidate = blockForType(registry, entry.type);
          const slots = new Set(
            droppableSlotsFor(start.document, registry, candidate).map(slotKey)
          );

          check(
            `${entry.type} is offered because the drop rules admit it`,
            slots.has(slotKey({ parentId: "blk_ROOT", slot: "body" })),
            "offered a type a drag would have refused"
          );
        }

        const inserted = insertTypeAt(start, "core.wait", {
          parentId: "blk_ROOT",
          slot: "body",
          index: 1,
        });

        check("inserting applies", inserted.ok, JSON.stringify(inserted.error));
        equal(
          "the new block lands at the gap's index",
          inserted.value.document.root.slots.body.length,
          3
        );
        equal(
          "its config is seeded from the declared defaults",
          findBlock(inserted.value.document, inserted.value.selectedId).config,
          { duration: "PT1H" }
        );
        equal(
          "and it carries the type's current version",
          findBlock(inserted.value.document, inserted.value.selectedId).typeVersion,
          1
        );

        equal(
          "a type the registry does not have is refused",
          insertTypeAt(start, "myapp.nope", { parentId: "blk_ROOT", slot: "body", index: 0 }).error
            .tag,
          "unknown_block_type"
        );

        // A full `exactly_one`/`zero_or_one` slot offers nothing rather than
        // offering a drop that would silently replace a child (rule 3).
        check(
          "a slot no type fits offers an empty list, not a throw",
          Array.isArray(typesForSlot(start, "blk_ROOT", "no_such_slot")),
          "typesForSlot did not return a list"
        );
      });

      suite("session: delete, and what it selects afterwards", () => {
        const start = select(createSession(cardDocument(), registry), "blk_WAI");
        const removed = removeBlock(start, "blk_WAI");

        check("a selected block can be removed", removed.ok, JSON.stringify(removed.error));
        equal("it is gone", findBlock(removed.value.document, "blk_WAI"), null);
        equal("and its parent takes the selection", removed.value.selectedId, "blk_PAR");
        check("the removal is undoable", canUndoSession(removed.value), "empty undo stack");

        const restored = undoSession(removed.value);

        check("undo puts it back", restored.ok, JSON.stringify(restored.error));
        check(
          "with its subtree and its position",
          findBlock(restored.value.document, "blk_WAI") !== null,
          "block did not come back"
        );

        equal(
          "the root refuses to be deleted",
          removeBlock(start, "blk_ROOT").error.tag,
          "cannot_remove_root"
        );
        equal(
          "and deleting nothing says so",
          removeBlock(createSession(cardDocument(), registry), null).error.tag,
          "nothing_selected"
        );
      });

      suite("session: undo and redo, and what the buttons read off them", () => {
        const start = createSession(cardDocument(), registry);

        check("nothing to undo at rest", !canUndoSession(start), "undo enabled on a fresh session");
        check("nothing to redo either", !canRedoSession(start), "redo enabled on a fresh session");
        equal("and undo refuses rather than throwing", undoSession(start).error.tag, "nothing_to_undo");
        equal("as does redo", redoSession(start).error.tag, "nothing_to_redo");

        const one = insertTypeAt(start, "core.wait", {
          parentId: "blk_ROOT",
          slot: "body",
          index: 0,
        }).value;
        const two = removeBlock(one, "blk_AUTH").value;

        check("two commands leave undo available", canUndoSession(two), "undo unavailable");
        check("and redo still empty", !canRedoSession(two), "redo unexpectedly available");
        equal("the revision counted both", two.document.revision, 19);

        const back = undoSession(two).value;

        check("undo restores the removed block", findBlock(back.document, "blk_AUTH") !== null, "gone");
        check("and offers a redo", canRedoSession(back), "redo unavailable after undo");
        equal("undo counts as an applied command", back.document.revision, 20);

        const forward = redoSession(back).value;

        equal("redo removes it again", findBlock(forward.document, "blk_AUTH"), null);
        check("and redo is spent", !canRedoSession(forward), "redo still available");

        // The stack property that makes undo trustworthy: winding all the way
        // back reproduces the ORIGINAL document, structurally.
        let wound = forward;
        while (canUndoSession(wound)) wound = undoSession(wound).value;

        equal("winding the stack out restores the original bytes", toJson(wound.document), toJson(
          { ...cardDocument(), revision: wound.document.revision }
        ));

        // A fresh command after an undo invalidates the redo branch - the one
        // rule every author relies on without ever being told it.
        const branched = insertTypeAt(back, "core.wait", {
          parentId: "blk_ROOT",
          slot: "body",
          index: 0,
        }).value;

        check("a new command clears the redo stack", !canRedoSession(branched), "redo survived a new command");
      });

      suite("session: an unresolvable block stays a first-class citizen (d12)", () => {
        const start = createSession(retiredDocument(), registry);

        // Selectable, and the inspector says what it is rather than nothing.
        const chosen = select(start, "blk_GONE");

        equal("it can be selected", chosen.selectedId, "blk_GONE");
        equal("the inspector shows its stored type", selectionSummary(chosen).type, "myapp.retired");
        check("and flags it as unresolvable", selectionSummary(chosen).unresolved, "not flagged");

        // Movable: ADR-0003 decision 5's permissive default is what keeps a
        // block whose type is gone from becoming stuck in place.
        const dragging = beginDrag(chosen, { kind: "move", id: "blk_GONE" });

        check("it can be picked up", dragging.drag !== null, "no drag session");
        check("and it has somewhere to go", droppableCount(dragging) > 0, "no targets at all");
        equal("its own body is not a target", dropStateFor(dragging, "blk_GONE", "body"), "no");

        // ...and its slots are not targets for anything else either, because
        // decision 5's first rule needs `slots/1` and there is none. NOTE:
        // decision 12's prose also permits REORDERING within a slot it
        // already has, which `droppable_slots/3` cannot express at slot
        // granularity - the shipped enumeration excludes an unresolvable
        // parent outright, and `targets.js` mirrors that. The spike follows
        // the code, and the gap is recorded on the bead rather than papered
        // over here.
        const other = beginDrag(start, { kind: "move", id: "blk_KEPT" });

        equal(
          "an unresolvable parent offers no slots to a foreign block",
          dropStateFor(other, "blk_GONE", "body"),
          "no"
        );

        // Deletable, and its children come back with it.
        const removed = removeBlock(chosen, "blk_GONE");

        check("it can be deleted", removed.ok, JSON.stringify(removed.error));
        equal("its children go with it", findBlock(removed.value.document, "blk_KEPT"), null);

        // The acceptance property decision 12 names: preservation. Edit an
        // unrelated part of the tree, undo nothing, and the unresolvable
        // block's bytes are byte-for-byte what they were.
        const edited = insertTypeAt(start, "core.wait", {
          parentId: "blk_R1",
          slot: "body",
          index: 0,
        });

        check("an unrelated edit applies", edited.ok, JSON.stringify(edited.error));
        equal(
          "and the unresolvable block's bytes are untouched",
          JSON.stringify(findBlock(edited.value.document, "blk_GONE")),
          JSON.stringify(findBlock(start.document, "blk_GONE"))
        );
      });

      suite("session: the layout hooks the canvas stamps its state through", () => {
        const dragging = beginDrag(createSession(cardDocument(), registry), {
          kind: "move",
          id: "blk_WAI",
        });

        const tree = layoutDocument(dragging.document, registry, {
          collapsed: dragging.collapsed,
          dropState: (parentId, slot) => dropStateFor(dragging, parentId, slot),
        });

        const rootBody = tree.root.slots.find((slot) => slot.name === "body");

        equal("an accepting slot's view carries data-drop=ok", rootBody.dropState, "ok");

        const group = rootBody.children.find((child) => child.id === "blk_GRP");
        const interrupts = group.slots.find((slot) => slot.name === "interrupts");

        equal("a refusing slot's view carries data-drop=no", interrupts.dropState, "no");

        // And with no session at all the canvas is inert, which is what the
        // previous wave's two-argument call has to keep producing.
        const inert = layoutDocument(dragging.document, registry);

        equal(
          "a session-free layout stamps nothing",
          inert.root.slots.find((slot) => slot.name === "body").dropState,
          null
        );
        equal("and folds nothing", inert.root.collapsed, false);
      });

      /* ------------------------------------------------------- reporting */

      const results = document.getElementById("results");
      const summary = document.getElementById("summary");

      let passed = 0;
      let failed = 0;

      for (const group of groups) {
        const section = document.createElement("section");
        const heading = document.createElement("h2");
        heading.textContent = group.name;
        section.append(heading);

        const list = document.createElement("ul");

        for (const item of group.checks) {
          if (item.state === "pass") passed += 1;
          else failed += 1;

          const li = document.createElement("li");
          li.dataset.state = item.state;
          li.textContent = item.label;

          if (item.detail) {
            const pre = document.createElement("pre");
            pre.textContent = item.detail;
            li.append(pre);
          }

          list.append(li);
          console.log(
            `[selftest] ${item.state === "pass" ? "PASS" : "FAIL"} ${group.name} / ${item.label}` +
              (item.detail ? `\n[selftest]   ${item.detail.replace(/\n/g, "\n[selftest]   ")}` : "")
          );
        }

        section.append(list);
        results.append(section);
      }

      const state = failed === 0 ? "pass" : "fail";
      summary.dataset.state = state;
      summary.textContent =
        failed === 0
          ? `all ${passed} checks passed`
          : `${failed} of ${passed + failed} checks FAILED`;

      console.log(`[selftest] ${summary.textContent}`);
    </script>
  </body>
</html>
